-26\"\r\n}\r\n\n~~~~~~\n\n## scripts/build-workbuddy-app.mjs\n\nSHA-256: 47463748feae3514c40c223aae9a4a3c32f37aaf0b17db4a6797d11ee24bcd9a\n\n~~~~~~text\nimport { mkdir, readFile, writeFile } from 'node:fs/promises'\r\nimport { fileURLToPath } from 'node:url'\r\nimport { gzipSync } from 'node:zlib'\r\nimport { FINANCE_DASHBOARD_STYLES } from '../src/finance-dashboard-styles.js'\r\nimport { WORKBENCH_POLISH_CSS } from '../src/workflow-tools-styles.js'\r\n\r\nconst root = new URL('../', import.meta.url)\r\nconst output = new URL('./workbuddy/', root)\r\nconst esbuild = await import('esbuild')\r\nawait mkdir(output, { recursive: true })\r\n\r\nconst widget = await esbuild.build({\r\n  entryPoints: [fileURLToPath(new URL('./src/workbuddy-widget.jsx', root))],\r\n  bundle: true,\r\n  write: false,\r\n  minify: true,\r\n  platform: 'browser',\r\n  format: 'iife',\r\n  target: ['chrome123'],\r\n  jsx: 'automatic',\r\n  alias: {\r\n    react: 'preact/compat',\r\n    'react-dom/client': 'preact/compat/client',\r\n    'react/jsx-runtime': 'preact/jsx-runtime',\r\n  },\r\n})\r\nconst widgetCode = new TextDecoder().decode(widget.outputFiles[0].contents).replaceAll('\u003c/script>', '\u003c\\\\/script>')\r\nconst baseStyles = `\r\n:root{color-scheme:light dark;--dsw-font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"PingFang SC\",\"Microsoft YaHei\",sans-serif;--dsw-alias-bg-base:#f7f8fc;--dsw-alias-bg-layer-1:#fff;--dsw-alias-bg-layer-2:#f4f6fd;--dsw-alias-bg-hover:#eef1fb;--dsw-alias-border-l1:#e4e7f0;--dsw-alias-border-l2:#d9deea;--dsw-alias-label-primary:#17213b;--dsw-alias-label-secondary:#65708b;--dsw-alias-label-tertiary:#8790a7;--dsw-alias-interactive-bg-hover:#edf0fa;--dsw-specific-sidebar-nav-item-hover:#edf0fa;--dsw-specific-sidebar-nav-item-active:#e7ebfb}\r\nhtml[data-host-theme=\"dark\"]{--dsw-alias-bg-base:#121826;--dsw-alias-bg-layer-1:#182033;--dsw-alias-bg-layer-2:#202a40;--dsw-alias-bg-hover:#263149;--dsw-alias-border-l1:#293650;--dsw-alias-border-l2:#35425d;--dsw-alias-label-primary:#eff3fb;--dsw-alias-label-secondary:#b6c0d2;--dsw-alias-label-tertiary:#8f9bb0;--dsw-alias-interactive-bg-hover:#263149;--dsw-specific-sidebar-nav-item-hover:#263149;--dsw-specific-sidebar-nav-item-active:#303c57}\r\nhtml,body,#root{width:100%;height:100%;min-height:720px;margin:0}body{overflow:hidden;background:var(--dsw-alias-bg-base);font-family:var(--dsw-font-family)}#root{container:finance-workbench / inline-size}#root>.dfinance_panel{height:100%!important;min-height:720px}\r\n`\r\nconst packedStyles = gzipSync(baseStyles + FINANCE_DASHBOARD_STYLES + WORKBENCH_POLISH_CSS, { level: 9 }).toString('base64')\r\nconst packedWidget = gzipSync(widgetCode, { level: 9 }).toString('base64')\r\nconst html = `\u003c!doctype html>\r\n\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'\">\u003ctitle>ZY 财务工作台 · WorkBuddy 财务工作台\u003c/title>\u003c/head>\u003cbody>\u003cdiv id=\"root\">\u003c/div>\u003cscript>(()=>{const u=async s=>{const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text()};Promise.all([u('${packedStyles}'),u('${packedWidget}')]).then(([c,j])=>{const y=document.createElement('style');y.textContent=c;document.head.append(y);const x=document.createElement('script');x.textContent=j;document.body.append(x)}).catch(e=>{document.body.textContent='工作台资源加载失败，请重新打开：'+e.message})})()\u003c/script>\u003c/body>\u003c/html>`\r\nconst bytes = Buffer.byteLength(html)\r\nif (bytes >= 256 * 1024) throw new Error(`WorkBuddy Widget 为 ${bytes} 字节，超过 MCP Apps 256 KB 预取上限`)\r\nawait writeFile(new URL('./widget.html', output), html)\r\n\r\nawait esbuild.build({\r\n  entryPoints: [fileURLToPath(new URL('./src/workbuddy-mcp-server.mjs', root))],\r\n  bundle: true,\r\n  outfile: fileURLToPath(new URL('./server.mjs', output)),\r\n  minify: true,\r\n  platform: 'node',\r\n  format: 'esm',\r\n  target: ['node20'],\r\n})\r\n\r\nawait esbuild.build({\r\n  entryPoints: [fileURLToPath(new URL('./src/team-cli.mjs', root))],\r\n  bundle: true,\r\n  outfile: fileURLToPath(new URL('./team-cli.mjs', output)),\r\n  platform: 'node',\r\n  format: 'esm',\r\n  target: ['node20'],\r\n})\r\n\r\nconst serverSize = Buffer.byteLength(await readFile(new URL('./server.mjs', output)))\r\nconsole.log(`built WorkBuddy MCP App · widget ${bytes} B packed (${Buffer.byteLength(widgetCode)} B JS raw) · server ${serverSize} B`)\r\n\n~~~~~~\n\n## scripts/generate-agent-catalog.mjs\n\nSHA-256: 5b2c17ba856b1e5fe2a65794fbaae628c37c0bdae2d8cbfac64530fa657fa801\n\n~~~~~~text\nimport { mkdir, readFile, writeFile } from 'node:fs/promises'\r\nimport { FINANCE_WORKFLOWS, SOP_STEPS } from '../src/finance-data.js'\r\nimport { composeFinanceTask } from '../src/task-prompt.js'\r\n\r\nconst root = new URL('../agents/finance-workbench/references/', import.meta.url)\r\nconst promptRoot = new URL('./prompts/', root)\r\nawait mkdir(root, { recursive: true })\r\nawait mkdir(promptRoot, { recursive: true })\r\n\r\nconst pkg = JSON.parse(await readFile(new URL('../package.json', import.meta.url), 'utf8'))\r\nconst catalog = {\r\n  product: 'workbuddy-finance-workbench',\r\n  version: 2,\r\n  productVersion: pkg.version,\r\n  generatedAt: pkg.releaseDate,\r\n  sopSteps: SOP_STEPS.map(([number, title, note]) => ({ number, title, note })),\r\n  workflows: FINANCE_WORKFLOWS,\r\n}\r\n\r\nawait writeFile(new URL('workflows.json', root), `${JSON.stringify(catalog, null, 2)}\\n`)\r\n\r\nconst markdown = [\r\n  '# 财务工作流目录',\r\n  '',\r\n  `共 ${FINANCE_WORKFLOWS.length} 个工作流。主数据源为 \\`src/finance-data.js\\`。`,\r\n  '',\r\n  ...FINANCE_WORKFLOWS.flatMap(item => [\r\n    `## ${item.number || '扩展'} · ${item.title}`,\r\n    '',\r\n    `- 适用岗位：${item.role}`,\r\n    `- 目标：${item.desc}`,\r\n    `- 输入：${item.inputs.join('；')}`,\r\n    `- 新手最少先准备：${item.minimumInputs.join('；')}`,\r\n    `- 关键规则：${item.rules.join('；')}`,\r\n    `- 输出：${item.outputs.join('；')}`,\r\n    `- 验收：${item.checklist.join('；')}`,\r\n    `- [查看并复制完整提示词](prompts/${item.number}-${item.id}.md)`,\r\n    '',\r\n  ]),\r\n]\r\nawait writeFile(new URL('workflows.md', root), `${markdown.join('\\n').trimEnd()}\\n`)\r\n\r\nconst promptIndex = ['# 25 个财务工作流提示词', '', '每份提示词都可直接复制到 WorkBuddy、Codex、Claude Code 或其他支持文件处理的 AI 工具。新手填写区不清楚的项可留空，AI 会先识别现有资料并一次列出必需缺项。', '']\r\nfor (const item of FINANCE_WORKFLOWS) {\r\n  const filename = `${item.number}-${item.id}.md`\r\n  promptIndex.push(`- [${item.number} · ${item.title}](${filename}) — ${item.desc}`)\r\n  const content = [\r\n    `# ${item.number} · ${item.title}`,\r\n    '',\r\n    `适用岗位：${item.role}`,\r\n    '',\r\n    `新手起步：${item.beginnerTip}`,\r\n    '',\r\n    '复制以下全部内容到 AI 对话中：',\r\n    '',\r\n    '```text',\r\n    composeFinanceTask(item),\r\n    '```',\r\n    '',\r\n  ].join('\\n')\r\n  await writeFile(new URL(filename, promptRoot), content)\r\n}\r\nawait writeFile(new URL('README.md', promptRoot), `${promptIndex.join('\\n').trimEnd()}\\n`)\r\n\r\nconsole.log(`generated ${FINANCE_WORKFLOWS.length} agent workflows and ${FINANCE_WORKFLOWS.length} copy-ready prompts`)\r\n\n~~~~~~\n\n## scripts/generate-reproduction.mjs\n\nSHA-256: 1877f7b85c1f368b2cfcbc4672790e6ebee96a8ffd94c7368c4475b3977d3868\n\n~~~~~~text\nimport { readdir, readFile, mkdir, writeFile } from 'node:fs/promises'\nimport { createHash } from 'node:crypto'\nimport { fileURLToPath, pathToFileURL } from 'node:url'\nimport path from 'node:path'\nconst root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..')\nconst pkg = JSON.parse(await readFile(path.join(root, 'package.json'), 'utf8'))\nconst teacher = pkg.name.includes('teacher')\nconst title = teacher ? '教师工作台' : '财务工作台'\nconst repositoryUrl = pkg.repository.url.replace(/^git\\+/, '').replace(/\\.git$/, '')\nconst data = await import(pathToFileURL(path.join(root, teacher ? 'src/teacher-workflows.js' : 'src/finance-data.js')))\nconst composers = await import(pathToFileURL(path.join(root, 'src/task-prompt.js')))\nconst workflows = (teacher ? data.TEACHER_WORKFLOWS : data.FINANCE_WORKFLOWS).map(w => ({id:w.id, title:w.title, prompt:teacher ? composers.composeTeacherTask(w) : composers.composeFinanceTask(w)}))\nasync function walk(dir) {\n  const entries = await readdir(path.join(root,dir),{withFileTypes:true})\n  const result=[]\n  for(const e of entries.sort((a,b)=>a.name.localeCompare(b.name,'en'))) {\n    const p=path.posix.join(dir,e.name)\n    if(e.isDirectory()) result.push(...await walk(p))\n    else if(e.isFile()) result.push(p)\n  }\n  return result\n}\nconst extras = (await readdir(root,{withFileTypes:true})).filter(e=>e.isFile() && /(?:\\.md|\\.json|\\.yml|\\.sh|\\.command|LICENSE|\\.gitignore)$/.test(e.name)).map(e=>e.name)\nconst docs = (await walk('docs')).filter(p=>!p.startsWith('docs/reproduce/') && /\\.(md|json|yml)$/.test(p))\nconst optional=[]\nfor(const dir of ['agents','.codebuddy-plugin','.github']) { try { optional.push(...(await walk(dir)).filter(p=>/\\.(md|json|yml|yaml)$/.test(p))) } catch(e) { if(e.code!=='ENOENT') throw e } }\nconst paths = [...new Set(['package.json','package-lock.json','build.mjs','cordis.patch.yml',...extras,...docs,...optional,...await walk('src'),...await walk('scripts'),...await walk('test')])].sort()\nconst files=[]\nfor(const p of paths) {\n  const content=await readFile(path.join(root,p),'utf8')\n  files.push({path:p,sha256:createHash('sha256').update(content).digest('hex'),content})\n}\nconst master = [\n'# '+title+' '+pkg.version+'：源码级精确复刻总提示词',\n'你是负责交付可运行软件的 AI 工程师。请完整复刻本仓库工作台，不要用静态看板、功能缩水示例或重新设计的界面替代。',\n'## 1. 获取基准',\n'仓库：'+repositoryUrl,\nteacher ? '本仓库为私密仓库。由用户通过 GitHub 登录、授权连接器或本地源码提供访问；不要索取、输出或硬编码令牌。' : '这是现有开源仓库的增量版本；保留已有 WorkBuddy、DSH 和通用 Agent 三种入口。',\n'优先读取已有本地仓库。否则克隆到新的目录，不覆盖用户工作。若没有仓库访问能力，请使用用户附带的 source-context.md，按文件标题恢复相对路径。',\n'## 2. 完整读取',\n'先读取 README.md、存在的 AGENTS.md、package.json、package-lock.json、build.mjs、cordis.patch.yml、src/、scripts/ 和 test/；以实际源码为准，不凭印象猜测接口。',\n'## 3. 同样的外观与行为',\n'保持源码的布局、模块顺序、中文文案、字体、间距、颜色、主题、图标、响应式断点和交互。保留资料上传、索引、搜索、筛选、引用、下载、置顶，任务创建、编辑、状态、备份恢复及所有源码已有功能。',\n'工作流必须使用原 task-prompt.js 的组合器，保持角色、材料要求、完整执行规则、模块指令与验收清单。共 '+workflows.length+' 个工作流，逐个核对，不删减为摘要。',\n'复用原宿主协议、客户端注入和服务端注册，不虚构 RPC。按锁文件安装依赖；不要批量升级或强制替换宿主内部协议包。界面依赖宿主时，明确宿主要求，不把独立 HTML 预览当作真实安装成功。',\n'## 4. 运行与实现',\n'Node.js >=20；执行 npm ci，然后 '+(teacher ? 'npm run check && npm run audit:release' : 'npm run verify:release')+'。优先原样构建；确需适配环境时只做最小变更，逐项记录原因、差异和回滚步骤。',\n'安装按仓库说明和已有安装脚本执行；先备份已有插件与配置，保留用户数据。涉及退出或重启宿主时先提醒用户保存并取得确认。',\n'## 5. 保护数据',\n'演示仅使用合成数据；原始业务资料只读，输出另存，禁止写入仓库、日志或公开页面。不得自动付款、入账、纳税申报或替用户作重大专业判断；这些操作必须人工复核确认。',\n'## 6. 验收',\n'逐项运行测试与安全扫描，核对 manifest.json 的路径和 SHA-256。实际打开宿主页面，检查桌面和 390px 窄屏、主题切换、资料与任务交互、全部工作流提示词复制；确认浏览器无目标功能控制台错误。',\n'实际触发至少一次工作流，确认发送到 AI 的正文与组合器结果一致。无宿主时记录为待验收，不声称端到端成功。',\n'交付可运行源码、构建产物、中文安装/使用指南、测试结果、实际截图、已知限制、恢复方式；列明任何与基准的差异。',\n'## 7. 精确复刻的边界',\n'同一份源码和锁文件是复刻基准；单靠自然语言无法保证任何 AI 都生成像素级相同界面。应保留源码而非让 AI 自由重写；宿主版本、系统字体和窗口尺寸可能影响最终显示。'\n].join('\\n\\n')\nconst context = '# 源码上下文包\\n\\n按相对路径恢复 UTF-8 文件；manifest.json 用于完整性核对。此包含构建、源码、脚本和测试，不含依赖目录、运行资料或凭据。\\n\\n'+files.map(f=>'## '+f.path+'\\n\\nSHA-256: '+f.sha256+'\\n\\n~~~~~~text\\n'+f.content+'\\n~~~~~~').join('\\n\\n')\nconst payload={title,version:pkg.version,master,context,workflows}\nconst html='\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>'+title+' · 提示词中心\u003c/title>\u003cstyle>body{margin:0;background:#edf2f7;color:#172b42;font:17px/1.7 system-ui}main{max-width:1050px;margin:auto;padding:40px 20px}h1{font-size:32px}section{background:white;padding:24px;border-radius:18px;margin:20px 0}button,input{font:inherit;padding:11px 1 tus.textContent=ok?\"已复制 \"+text.length+\" 个字符\": \"请手动复制\"}document.getElementById(\"master\").onclick=()=>copy(d.master);document.getElementById(\"full\").onclick=()=>copy(d.master+\"\\\\n\\\\n\"+d.context);document.getElementById(\"preview\").textContent=d.master;document.getElementById(\"download\").onclick=()=>{const url=URL.createObjectURL(new Blob([d.context],{type:\"text/markdown;charset=utf-8\"}));const a=document.createElement(\"a\");a.href=url;a.download=\"source-context.md\";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};function render(){const q=document.getElementById(\"search\").value.trim().toLowerCase();const list=document.getElementById(\"list\");list.replaceChildren();d.workflows.filter(w=>(w.title+w.prompt).toLowerCase().includes(q)).forEach(w=>{const box=document.createElement(\"section\");const h=document.createElement(\"h3\");h.textContent=w.title;const b=document.createElement(\"button\");b.textContent=\"复制完整提示词\";b.onclick=()=>copy(w.prompt);const details=document.createElement(\"details\");const s=document.createElement(\"summary\");s.textContent=\"查看全文\";const pre=document.createElement(\"pre\");pre.textContent=w.prompt;details.append(s,pre);box.append(h,b,details);list.append(box)})}document.getElementById(\"search\").oninput=render;render();\u003c/script>\u003c/html>'\nconst dir=path.join(root,'docs/reproduce')\nawait mkdir(dir,{recursive:true})\nfor(const [name,value] of Object.entries({'MASTER_PROMPT.md':master,'WORKFLOWS.md':'# 完整工作流提示词\\n\\n'+workflows.map(w=>'## '+w.title+'\\n\\n~~~~text\\n'+w.prompt+'\\n~~~~').join('\\n\\n'),'source-context.md':context,'manifest.json':JSON.stringify({version:pkg.version,workflowCount:workflows.length,files:files.map(({path,sha256})=>({path,sha256}))},null,2)+'\\n','index.html':html})) await writeFile(path.join(dir,name),value)\nconsole.log(title+': '+workflows.length+' prompts, '+files.length+' source files')\n\n~~~~~~\n\n## scripts/install-agent.ps1\n\nSHA-256: 5219e4e79ed8da1760fdaa2e1ff9081ed4046c8c3413c9301df4158f75f95f8c\n\n~~~~~~text\nparam(\r\n  [ValidateSet(\"workbuddy\", \"codex\", \"claude\", \"custom\")]\r\n  [string]$Target = \"workbuddy\",\r\n  [string]$CustomRoot = \"\"\r\n)\r\n\r\n$ErrorActionPreference = \"Stop\"\r\n$RepoRoot = Split-Path -Parent $PSScriptRoot\r\n$Source = Join-Path $RepoRoot \"agents/finance-workbench\"\r\n\r\nswitch ($Target) {\r\n  \"workbuddy\" { $DestinationRoot = Join-Path $HOME \".workbuddy/skills\" }\r\n  \"codex\" { $DestinationRoot = Join-Path $HOME \".codex/skills\" }\r\n  \"claude\" { $DestinationRoot = Join-Path $HOME \".claude/skills\" }\r\n  \"custom\" {\r\n    if ([string]::IsNullOrWhiteSpace($CustomRoot)) { throw \"custom 模式需要提供目标 skills 目录\" }\r\n    $DestinationRoot = $CustomRoot\r\n  }\r\n}\r\n\r\nif (-not (Test-Path (Join-Path $Source \"SKILL.md\"))) { throw \"未找到 Agent Skill: $Source\" }\r\nNew-Item -ItemType Directory -Force -Path $DestinationRoot | Out-Null\r\n$Destination = Join-Path $DestinationRoot \"finance-workbench\"\r\n\r\nif (Test-Path $Destination) {\r\n  $Timestamp = (Get-Date -Format \"yyyyMMdd-HHmmss\") + \"-\" + [guid]::NewGuid().ToString(\"N\").Substring(0, 8)\r\n  $Backup = Join-Path $DestinationRoot \"finance-workbench.backup-$Timestamp\"\r\n  Move-Item $Destination $Backup\r\n  Write-Host \"旧版已备份到: $Backup\"\r\n}\r\n\r\nCopy-Item -Recurse $Source $Destination\r\nif (-not (Test-Path (Join-Path $Destination \"references/workflows.json\"))) { throw \"安装校验失败\" }\r\nWrite-Host \"安装完成: $Destination\"\r\nWrite-Host \"请重新打开 $Target，然后明确说：请使用 finance-workbench。\"\r\n\n~~~~~~\n\n## scripts/install-agent.sh\n\nSHA-256: e428eb8b6a168aba8b47c6d6e82088fa58651fd219ebed50ea0d241e6ca75e50\n\n~~~~~~text\n#!/usr/bin/env bash\nset -euo pipefail\n\ntarget=\"${1:-workbuddy}\"\ncustom_root=\"${2:-}\"\nscript_dir=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\nrepo_root=\"$(cd \"$script_dir/..\" && pwd)\"\nsource_dir=\"$repo_root/agents/finance-workbench\"\n\ncase \"$target\" in\n  workbuddy) destination_root=\"${WORKBUDDY_HOME:-$HOME/.workbuddy}/skills\" ;;\n  codex) destination_root=\"${CODEX_HOME:-$HOME/.codex}/skills\" ;;\n  claude) destination_root=\"${CLAUDE_HOME:-$HOME/.claude}/skills\" ;;\n  custom)\n    if [[ -z \"$custom_root\" ]]; then\n      echo \"用法: $0 custom /你的/Agent/skills目录\" >&2\n      exit 2\n    fi\n    destination_root=\"$custom_root\"\n    ;;\n  *)\n    echo \"未知目标: $target（可选: workbuddy、codex、claude、custom）\" >&2\n    exit 2\n    ;;\nesac\n\nif [[ ! -f \"$source_dir/SKILL.md\" ]]; then\n  echo \"未找到 Agent Skill: $source_dir\" >&2\n  exit 1\nfi\n\nmkdir -p \"$destination_root\"\ndestination=\"$destination_root/finance-workbench\"\nif [[ -e \"$destination\" ]]; then\n  timestamp=\"$(date +%Y%m%d-%H%M%S)-$$-$RANDOM\"\n  backup=\"$destination_root/finance-workbench.backup-$timestamp\"\n  mv \"$destination\" \"$backup\"\n  echo \"旧版已备份到: $backup\"\nfi\n\ncp -R \"$source_dir\" \"$destination\"\ntest -f \"$destination/SKILL.md\"\ntest -f \"$destination/references/workflows.json\"\necho \"安装完成: $destination\"\necho \"请重新打开 ${target}，然后明确说：请使用 finance-workbench。\"\n\n~~~~~~\n\n## scripts/install-dsh.sh\n\nSHA-256: 1be66a030b93f8284eb05f27b8ba10018e0bc2ab9c3fbfe10c60236be2afecfa\n\n~~~~~~text\n#!/usr/bin/env bash\nset -euo pipefail\n\nprofile=\"web\"\ndry_run=\"false\"\nwhile [[ $# -gt 0 ]]; do\n  case \"$1\" in\n    --profile) [[ $# -ge 2 && -n \"${2:-}\" ]] || { echo \"--profile 需要名称\" >&2; exit 2; }; profile=\"$2\"; shift 2 ;;\n    --dry-run) dry_run=\"true\"; shift ;;\n    *) echo \"未知参数: $1\" >&2; exit 2 ;;\n  esac\ndone\n\nscript_dir=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\nrepo_root=\"$(cd \"$script_dir/..\" && pwd)\"\ndsh_base=\"${DSH_HOME:-$HOME/.dsh}\"\n[[ \"$profile\" =~ ^[a-zA-Z0-9][a-zA-Z0-9_-]*$ ]] || { echo \"profile 名称无效\" >&2; exit 2; }\nprofile_dir=\"$dsh_base/profiles/$profile\"\nprofile_package=\"$profile_dir/package.json\"\n\ncommand -v node >/dev/null 2>&1 || { echo \"需要 Node.js 20+\" >&2; exit 1; }\ncommand -v npm >/dev/null 2>&1 || { echo \"需要 npm\" >&2; exit 1; }\n[[ -f \"$profile_package\" ]] || { echo \"未找到 DeepSeek Harness profile: $profile_package\" >&2; exit 1; }\n\nnode_major=\"$(node -p \"process.versions.node.split('.')[0]\")\"\n[[ \"$node_major\" -ge 20 ]] || { echo \"Node.js 版本过低: $(node --version)\" >&2; exit 1; }\n\necho \"仓库: $repo_root\"\necho \"目标 profile: $profile_dir\"\nif [[ \"$dry_run\" == \"true\" ]]; then\n  node -e \"const p=require(process.argv[1]); if(!p.dsh?.profile?.bundles) process.exit(2)\" \"$profile_package\"\n  echo \"预检通过；未修改任何配置。\"\n  exit 0\nfi\n\ncd \"$repo_root\"\nnpm ci\nnpm run check\n\nnode -e \"const p=require(process.argv[1]); if(!p.dsh?.profile||!Array.isArray(p.dsh.profile.bundles)) process.exit(2)\" \"$profile_package\"\nif ! command -v pnpm >/dev/null 2>&1 && ! command -v corepack >/dev/null 2>&1; then\n  echo \"未找到 pnpm 或 corepack；尚未修改 profile 配置。\" >&2\n  exit 1\nfi\ntimestamp=\"$(date +%Y%m%d-%H%M%S)-$(node -e 'console.log(require(\"node:crypto\").randomUUID().slice(0,8))')\"\nbackup=\"$profile_package.finance-workbench-backup-$timestamp\"\ncp \"$profile_package\" \"$backup\"\necho \"配置已备份: $backup\"\n\nnode --input-type=module - \"$profile_package\" \"$repo_root\" \u003c\u003c'NODE'\nimport { readFile, writeFile } from 'node:fs/promises'\nconst packagePath = process.argv[2]\nconst repoRoot = process.argv[3]\nconst data = JSON.parse(await readFile(packagePath, 'utf8'))\ndata.dependencies ||= {}\ndata.dependencies['dsh-finance-workbench'] = `link:${repoRoot}`\ndata.dsh ||= {}\ndata.dsh.profile ||= {}\ndata.dsh.profile.bundles ||= []\nif (!data.dsh.profile.bundles.includes('dsh-finance-workbench')) data.dsh.profile.bundles.push('dsh-finance-workbench')\nawait writeFile(packagePath, `${JSON.stringify(data, null, 2)}\\n`)\nNODE\n\nif command -v pnpm >/dev/null 2>&1; then\n  pnpm --dir \"$profile_dir\" install\nelif command -v corepack >/dev/null 2>&1; then\n  corepack pnpm --dir \"$profile_dir\" install\nelse\n  echo \"配置已写入，但未找到 pnpm。请安装 pnpm 后在 profile 目录执行 pnpm install。\" >&2\n  exit 1\nfi\n\necho \"财务工作台已安装。请先保存当前工作，再重启 DeepSeek Harness 使插件生效。\"\n\n~~~~~~\n\n## scripts/install-workbuddy-app.ps1\n\nSHA-256: d32020de5b7da27b54fc5cae8b9cff3bdf969b75aa96616428df084cfb3560dd\n\n~~~~~~text\n﻿param([switch]$DryRun)\r\n$ErrorActionPreference = 'Stop'\r\n$OutputEncoding = [System.Text.UTF8Encoding]::new($false)\r\n[Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)\r\n$NodeCommand = Get-Command node -ErrorAction SilentlyContinue\r\nif (-not $NodeCommand) { throw '请先安装 Node.js 20+：https://nodejs.org/' }\r\n$Arguments = @((Join-Path $PSScriptRoot 'workbuddy-install.mjs'), 'install')\r\nif ($DryRun) { $Arguments += '--dry-run' }\r\n& $NodeCommand.Source @Arguments\r\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\r\n\n~~~~~~\n\n## scripts/install-workbuddy-app.sh\n\nSHA-256: 0a8296b0db4a3ff8db3063a02a0355fb0c0c5dbb21dda7131b2da4e1b343e404\n\n~~~~~~text\n#!/usr/bin/env bash\nset -euo pipefail\nscript_dir=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\nnode_bin=\"$(command -v node || true)\"\n[[ -n \"$node_bin\" ]] || { echo \"请先安装 Node.js 20+：https://nodejs.org/\" >&2; exit 1; }\nexec \"$node_bin\" \"$script_dir/workbuddy-install.mjs\" install \"$@\"\n\n~~~~~~\n\n## scripts/package-release.sh\n\nSHA-256: 98aa7b8612150e13927310121c1d52fb89b259875587af53cb04314d1fa21b47\n\n~~~~~~text\n#!/usr/bin/env bash\nset -euo pipefail\n\nscript_dir=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\nrepo_root=\"$(cd \"$script_dir/..\" && pwd)\"\ncd \"$repo_root\"\n\nversion=\"$(node -p \"require('./package.json').version\")\"\ntimestamp=\"$(date +%Y%m%d-%H%M%S)\"\nif [[ -e release ]]; then mv release \"release.backup-$timestamp\"; fi\nmkdir -p release\nstage=\"$(mktemp -d \"${TMPDIR:-/tmp}/finance-workbench-release.XXXXXX\")\"\ntrap 'find \"$stage\" -depth -delete 2>/dev/null || true' EXIT\n\nnpm run verify:release\n\nmac=\"$stage/workbuddy-finance-workbench-macos\"\nmkdir -p \"$mac/scripts\"\ncp -R workbuddy agents \"$mac/\"\ncp -R docs \"$mac/\"\ncp scripts/workbuddy-install.mjs scripts/install-workbuddy-app.sh scripts/uninstall-workbuddy-app.sh \"$mac/scripts/\"\ncp \"安装 WorkBuddy 财务工作台.command\" \"卸载 WorkBuddy 财务工作台.command\" README.md LICENSE \"$mac/\"\nchmod +x \"$mac/scripts/\"*.sh \"$mac/\"*.command\n(cd \"$stage\" && zip -qry \"$repo_root/release/workbuddy-finance-workbench-macos.zip\" \"$(basename \"$mac\")\")\n\nwindows=\"$stage/workbuddy-finance-workbench-windows\"\nmkdir -p \"$windows/scripts\"\ncp -R workbuddy agents \"$windows/\"\ncp -R docs \"$windows/\"\ncp scripts/workbuddy-install.mjs scripts/install-workbuddy-app.ps1 scripts/uninstall-workbuddy-app.ps1 \"$windows/scripts/\"\ncp README.md LICENSE \"$windows/\"\n(cd \"$stage\" && zip -qry \"$repo_root/release/workbuddy-finance-workbench-windows.zip\" \"$(basename \"$windows\")\")\n\nagent=\"$stage/finance-workbench\"\ncp -R agents/finance-workbench \"$agent\"\n(cd \"$stage\" && zip -qry \"$repo_root/release/finance-workbench-agent-v${version}.zip\" \"$(basename \"$agent\")\")\n\nnpm pack --ignore-scripts --pack-destination release >/dev/null\n(\n  cd release\n  shasum -a 256 \"workbuddy-finance-workbench-macos.zip\" \"workbuddy-finance-workbench-windows.zip\" \"finance-workbench-agent-v${version}.zip\" \"dsh-finance-workbench-${version}.tgz\" > SHA256SUMS.txt\n)\n\necho \"发布包已生成：$repo_root/release\"\nls -lh release\n\n~~~~~~\n\n## scripts/preview.mjs\n\nSHA-256: ba180df4d6f34c55d9bbbdd54ac86e9151a6e16f48146a48edbb94574aad5c14\n\n~~~~~~text\nimport { createServer } from 'node:http'\r\nimport { readFile } from 'node:fs/promises'\r\nconst port = Number(process.env.PORT || 4173)\r\nif (!Number.isInteger(port) || port \u003c 1 || port > 65535) throw new Error('PORT 必须为 1–65535')\r\nconst widget = new URL('../workbuddy/widget.html', import.meta.url)\r\nawait readFile(widget)\r\ncreateServer(async (request, response) => {\r\n  if (request.url === '/' || request.url === '/index.html') {\r\n    try {\r\n      const html = await readFile(widget)\r\n      response.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8', 'Cache-Control': 'no-store' })\r\n      response.end(html)\r\n    } catch { response.writeHead(503); response.end('预览资源暂不可读，请完成构建后刷新') }\r\n  } else { response.writeHead(request.url === '/favicon.ico' ? 204 : 404); response.end() }\r\n}).listen(port, '127.0.0.1', () => console.log(`财务工作台本机预览：http://127.0.0.1:${port}（Ctrl+C 停止）`))\r\n\n~~~~~~\n\n## scripts/security-scan.mjs\n\nSHA-256: 5b839b68be012578e560abf115611f6e4242bb2edc2076ee2e882cc093a0abeb\n\n~~~~~~text\nimport { readdir, readFile } from 'node:fs/promises'\r\nimport { extname, join, relative } from 'node:path'\r\nimport { fileURLToPath } from 'node:url'\r\n\r\nconst root = fileURLToPath(new URL('..', import.meta.url))\r\nconst ignored = new Set(['.git', 'node_modules', 'output', 'release', '.playwright-cli', '.env', '.data', '.test'])\r\nconst textExtensions = new Set(['', '.js', '.jsx', '.ts', '.tsx', '.sql', '.mjs', '.cjs', '.html', '.command', '.json', '.md', '.yml', '.yaml', '.sh', '.ps1', '.csv', '.txt'])\r\nconst forbidden = [\r\n  ['private macOS home path', new RegExp(`/${'Users'}/`)],\r\n  ['private account name', new RegExp(['liu', 'yong', 'mo'].join(''), 'i')],\r\n  ['private display name', new RegExp(['永', '模'].join(''))],\r\n  ['GitHub OAuth token', new RegExp(`g${'ho'}_[A-Za-z0-9]{20,}`)],\r\n  ['common secret key', new RegExp(`s${'k'}-[A-Za-z0-9_-]{20,}`)],\r\n  ['private property reference', new RegExp(['荣安', '华府'].join(''))],\r\n]\r\n\r\nasync function walk(directory) {\r\n  const files = []\r\n  for (const entry of await readdir(directory, { withFileTypes: true })) {\r\n    if (ignored.has(entry.name)) continue\r\n    const full = join(directory, entry.name)\r\n    if (entry.isDirectory()) files.push(...await walk(full))\r\n    else if (textExtensions.has(extname(entry.name).toLowerCase())) files.push(full)\r\n  }\r\n  return files\r\n}\r\n\r\nconst findings = []\r\nfor (const file of await walk(root)) {\r\n  const content = await readFile(file, 'utf8')\r\n  for (const [label, pattern] of forbidden) {\r\n    if (pattern.test(content)) findings.push(`${relative(root, file)}: ${label}`)\r\n  }\r\n}\r\n\r\nif (findings.length) {\r\n  console.error('public release security scan failed:')\r\n  for (const finding of findings) console.error(`- ${finding}`)\r\n  process.exit(1)\r\n}\r\nconsole.log('public release security scan passed')\r\n\n~~~~~~\n\n## scripts/sync-version.mjs\n\nSHA-256: d35137ead91cb7b962ff4f6fe3bf92c10230e12698aa6a4fd81d1ac278403a06\n\n~~~~~~text\nimport { readFile, writeFile } from 'node:fs/promises'\r\nconst root = new URL('../', import.meta.url)\r\nconst pkg = JSON.parse(await readFile(new URL('package.json', root), 'utf8'))\r\nawait writeFile(new URL('src/version.js', root), `// Generated from package.json by scripts/sync-version.mjs.\\nexport const VERSION = '${pkg.version}'\\n`)\r\nconst pluginFile = new URL('.codebuddy-plugin/plugin.json', root)\r\nconst plugin = JSON.parse(await readFile(pluginFile, 'utf8'))\r\nplugin.version = pkg.version\r\nawait writeFile(pluginFile, `${JSON.stringify(plugin, null, 2)}\\n`)\r\nconst skillFile = new URL('agents/finance-workbench/SKILL.md', root)\r\nconst skill = await readFile(skillFile, 'utf8')\r\nawait writeFile(skillFile, skill.replace(/version: \"[^\"]+\"/, `version: \"${pkg.version}\"`))\r\n\n~~~~~~\n\n## scripts/uninstall-agent.sh\n\nSHA-256: faf2efa9195942d4814e03f624c96d98a8da084574e571d1d633396dbb152b14\n\n~~~~~~text\n#!/usr/bin/env bash\nset -euo pipefail\n\ntarget=\"${1:-workbuddy}\"\ncustom_root=\"${2:-}\"\ncase \"$target\" in\n  workbuddy) destination_root=\"${WORKBUDDY_HOME:-$HOME/.workbuddy}/skills\" ;;\n  codex) destination_root=\"${CODEX_HOME:-$HOME/.codex}/skills\" ;;\n  claude) destination_root=\"${CLAUDE_HOME:-$HOME/.claude}/skills\" ;;\n  custom) destination_root=\"$custom_root\" ;;\n  *) echo \"未知目标: $target\" >&2; exit 2 ;;\nesac\n\nif [[ -z \"$destination_root\" ]]; then\n  echo \"自定义目录不能为空\" >&2\n  exit 2\nfi\n\ndestination=\"$destination_root/finance-workbench\"\nif [[ ! -e \"$destination\" ]]; then\n  echo \"未发现已安装技能: $destination\"\n  exit 0\nfi\n\ntimestamp=\"$(date +%Y%m%d-%H%M%S)-$$-$RANDOM\"\nbackup=\"$destination_root/finance-workbench.uninstalled-$timestamp\"\nmv \"$destination\" \"$backup\"\necho \"已从技能目录移出，保留在: $backup\"\n\n~~~~~~\n\n## scripts/uninstall-workbuddy-app.ps1\n\nSHA-256: 38012fb7dd12577654caa0bab00a2d7743df469a01c9195545de70b3f91c9563\n\n~~~~~~text\n﻿param([switch]$DryRun)\r\n$ErrorActionPreference = 'Stop'\r\n$OutputEncoding = [System.Text.UTF8Encoding]::new($false)\r\n[Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)\r\n$NodeCommand = Get-Command node -ErrorAction SilentlyContinue\r\nif (-not $NodeCommand) { throw '请先安装 Node.js 20+：https://nodejs.org/' }\r\n$Arguments = @((Join-Path $PSScriptRoot 'workbuddy-install.mjs'), 'uninstall')\r\nif ($DryRun) { $Arguments += '--dry-run' }\r\n& $NodeCommand.Source @Arguments\r\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\r\n\n~~~~~~\n\n## scripts/uninstall-workbuddy-app.sh\n\nSHA-256: 0a37999c980b3234150ff747077c0530be8f606a7be11d7d49717d1725f52225\n\n~~~~~~text\n#!/usr/bin/env bash\nset -euo pipefail\nscript_dir=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\nnode_bin=\"$(command -v node || true)\"\n[[ -n \"$node_bin\" ]] || { echo \"请先安装 Node.js 20+：https://nodejs.org/\" >&2; exit 1; }\nexec \"$node_bin\" \"$script_dir/workbuddy-install.mjs\" uninstall \"$@\"\n\n~~~~~~\n\n## scripts/verify-release.sh\n\nSHA-256: 8b3c68ac5b064f1db48cd95607a34fd9dab7b3f9fce933fe68040a6c1699c779\n\n~~~~~~text\n#!/usr/bin/env bash\nset -euo pipefail\n\nscript_dir=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\nrepo_root=\"$(cd \"$script_dir/..\" && pwd)\"\ncd \"$repo_root\"\n\nbash -n scripts/install-agent.sh\nbash -n scripts/uninstall-agent.sh\nbash -n scripts/install-dsh.sh\nbash -n scripts/install-workbuddy-app.sh\nbash -n scripts/uninstall-workbuddy-app.sh\nbash -n \"安装 WorkBuddy 财务工作台.command\"\nbash -n \"卸载 WorkBuddy 财务工作台.command\"\nnode --check scripts/generate-agent-catalog.mjs\nnode --check scripts/security-scan.mjs\nnpm run check\nnode -e \"const c=require('./agents/finance-workbench/references/workflows.json'); if(c.workflows.length!==25) process.exit(1)\"\ntest -f workbuddy/server.mjs\ntest -f workbuddy/widget.html\ntest -f .codebuddy-plugin/plugin.json\ntest -f docs/INSTALL_WORKBUDDY.md\ntest -f docs/images/readme-hero.png\ntest -f docs/images/dashboard-desktop.png\ntest -f docs/images/dashboard-mobile.png\ntest -f docs/images/exception-control.png\n\nfixture_home=\"$(mktemp -d \"${TMPDIR:-/tmp}/finance-workbench-install.XXXXXX\")\"\ntrap 'find \"$fixture_home\" -depth -delete 2>/dev/null || true' EXIT\nmkdir -p \"$fixture_home\"\nprintf '{\"mcpServers\":{\"keep-existing\":{\"command\":\"fixture\"}}}\\n' > \"$fixture_home/.mcp.json\"\nWORKBUDDY_HOME=\"$fixture_home\" bash scripts/install-workbuddy-app.sh\nnode -e \"const c=require(process.argv[1]); if(!c.mcpServers['keep-existing']||!c.mcpServers['finance-workbench']) process.exit(1)\" \"$fixture_home/.mcp.json\"\ntest -f \"$fixture_home/apps/finance-workbench/server.mjs\"\ntest -f \"$fixture_home/skills/finance-workbench/SKILL.md\"\nWORKBUDDY_HOME=\"$fixture_home\" bash scripts/uninstall-workbuddy-app.sh\nnode -e \"const c=require(process.argv[1]); if(!c.mcpServers['keep-existing']||c.mcpServers['finance-workbench']) process.exit(1)\" \"$fixture_home/.mcp.json\"\n\nnpm pack --ignore-scripts --dry-run >/dev/null\necho \"release verification passed\"\n\n~~~~~~\n\n## scripts/workbuddy-install.mjs\n\nSHA-256: 8f6e2120b076799b420ba40f11c9e3f662edef8480bd1df707142e01af2c5a7a\n\n~~~~~~text\nimport { randomUUID } from 'node:crypto'\r\nimport { execFileSync } from 'node:child_process'\r\nimport { access, cp, lstat, mkdir, mkdtemp, readFile, rename, rm, writeFile } from 'node:fs/promises'\r\nimport { basename, dirname, isAbsolute, join, resolve } from 'node:path'\r\nimport { fileURLToPath } from 'node:url'\r\n\r\nconst repo = resolve(dirname(fileURLToPath(import.meta.url)), '..')\r\nconst [action, ...flags] = process.argv.slice(2)\r\nconst dryRun = flags.includes('--dry-run')\r\nif (!['install', 'uninstall'].includes(action) || flags.some(flag => flag !== '--dry-run')) {\r\n  console.error('用法：node scripts/workbuddy-install.mjs install|uninstall [--dry-run]')\r\n  process.exit(2)\r\n}\r\n\r\nasync function exists(path) {\r\n  try { await lstat(path); return true } catch (error) { if (error.code === 'ENOENT') return false; throw error }\r\n}\r\n\r\nasync function run() {\r\n  if (Number(process.versions.node.split('.')[0]) \u003c 20) throw new Error('需要 Node.js 20 或更高版本')\r\n  const home = process.env.WORKBUDDY_HOME || join(process.env.HOME || process.env.USERPROFILE || '', '.workbuddy')\r\n  if (!isAbsolute(home)) throw new Error('WorkBuddy 目录必须是绝对路径')\r\n  // CLI and desktop WorkBuddy versions use different configuration files.\r\n  const configPaths = [join(home, '.mcp.json'), join(home, 'mcp.json')]\r\n  const appPath = join(home, 'apps', 'finance-workbench')\r\n  const skillPath = join(home, 'skills', 'finance-workbench')\r\n  const configs = []\r\n  for (const configPath of configPaths) {\r\n    const hasConfig = await exists(configPath)\r\n    let originalConfig\r\n    let config = { mcpServers: {} }\r\n    if (hasConfig) {\r\n      if ((await lstat(configPath)).isSymbolicLink()) throw new Error('MCP 配置是符号链接，请先改用普通配置文件')\r\n      originalConfig = await readFile(configPath)\r\n      try { config = JSON.parse(originalConfig.toString('utf8').replace(/^\\uFEFF/, '')) } catch { throw new Error('MCP 配置不是有效 JSON；原应用、Skill 和配置均未修改') }\r\n      if (!config || typeof config !== 'object' || Array.isArray(config) || (config.mcpServers !== undefined && (!config.mcpServers || typeof config.mcpServers !== 'object' || Array.isArray(config.mcpServers)))) throw new Error('MCP 配置结构无效；原应用、Skill 和配置均未修改')\r\n      config.mcpServers ||= {}\r\n    }\r\n    configs.push({ configPath, hasConfig, originalConfig, config })\r\n  }\r\n  if (action === 'install') {\r\n    await Promise.all(['workbuddy/server.mjs', 'workbuddy/widget.html', 'workbuddy/team-cli.mjs', 'agents/finance-workbench/SKILL.md'].map(file => access(join(repo, file))))\r\n    execFileSync(process.execPath, ['--check', join(repo, 'workbuddy/server.mjs')], { stdio: 'pipe' })\r\n    for (const { configPath, config } of configs) {\r\n      const oldEntry = config.mcpServers['finance-workbench']\r\n      if (oldEntry !== undefined && (!oldEntry || typeof oldEntry !== 'object' || Array.isArray(oldEntry))) throw new Error('原财务工作台 MCP 配置结构无效')\r\n      if (oldEntry?.env !== undefined && (!oldEntry.env || typeof oldEntry.env !== 'object' || Array.isArray(oldEntry.env))) throw new Error('原财务工作台环境配置结构无效')\r\n      config.mcpServers['finance-workbench'] = {\r\n        ...oldEntry, ...(basename(configPath) === 'mcp.json' ? { type: 'stdio' } : {}), command: process.execPath, args: [join(appPath, 'server.mjs')],\r\n        env: { ...(process.platform === 'win32' && process.env.LOCALAPPDATA ? { LOCALAPPDATA: process.env.LOCALAPPDATA } : {}), ...oldEntry?.env, WORKBUDDY_FINANCE_WORKBENCH: '1' },\r\n      }\r\n    }\r\n  } else for (const { config } of configs) delete config.mcpServers['finance-workbench']\r\n  console.log(`WorkBuddy 目录：${home}`)\r\n  if (dryRun) { console.log('预检通过；未修改任何文件。'); return }\r\n\r\n  await mkdir(home, { recursive: true })\r\n  const stamp = `${new Date().toISOString().replace(/[:.]/g, '-')}-${randomUUID().slice(0, 8)}`\r\n  const stage = await mkdtemp(join(home, '.finance-workbench-stage-'))\r\n  const moved = []\r\n  const installed = []\r\n  const changedConfigs = []\r\n  try {\r\n    if (action === 'install') {\r\n      await mkdir(join(stage, 'app'))\r\n      for (const file of ['server.mjs', 'widget.html', 'team-cli.mjs']) await cp(join(repo, 'workbuddy', file), join(stage, 'app', file))\r\n      await cp(join(repo, 'agents', 'finance-workbench'), join(stage, 'skill'), { recursive: true })\r\n      await mkdir(dirname(appPath), { recursive: true })\r\n      await mkdir(dirname(skillPath), { recursive: true })\r\n    }\r\n    for (const [index, entry] of configs.entries()) {\r\n      await writeFile(join(stage, `config-${index}.json`), `${JSON.stringify(entry.config, null, 2)}\\n`, { mode: 0o600 })\r\n      if (entry.hasConfig) await writeFile(`${entry.configPath}.finance-workbench-${action}-backup-${stamp}`, entry.originalConfig, { mode: 0o600 })\r\n    }\r\n    for (const target of [appPath, skillPath]) {\r\n      if (await exists(target)) {\r\n        const backup = `${target}.${action === 'install' ? 'backup' : 'uninstalled'}-${stamp}`\r\n        await rename(target, backup)\r\n        moved.push([target, backup])\r\n      }\r\n    }\r\n    if (action === 'install') {\r\n      for (const [source, target] of [[join(stage, 'app'), appPath], [join(stage, 'skill'), skillPath]]) {\r\n        await rename(source, target)\r\n        installed.push(target)\r\n      }\r\n    }\r\n    // Refuse to overwrite another process's concurrent configuration edit.\r\n    for (const entry of configs) {\r\n      if (entry.hasConfig ? !(await readFile(entry.configPath)).equals(entry.originalConfig) : await exists(entry.configPath)) throw new Error('安装期间 MCP 配置已被其他程序修改，请稍后重试')\r\n    }\r\n    for (const [index, entry] of configs.entries()) {\r\n      if (action === 'install' || entry.hasConfig) {\r\n        await rename(join(stage, `config-${index}.json`), entry.configPath)\r\n        changedConfigs.push(entry)\r\n      }\r\n    }\r\n  } catch (error) {\r\n    for (const target of installed.reverse()) await rm(target, { recursive: true, force: true })\r\n    for (const [target, backup] of moved.reverse()) await rename(backup, target)\r\n    for (const entry of changedConfigs.reverse()) {\r\n      if (entry.hasConfig) await writeFile(entry.configPath lor: '#db2777',\r\n    inputs: ['考勤汇总、社保基数、个税扣除、银行代发名单', '可选：上期基数表、人员主数据、字段脱敏规则'],\r\n    outputs: ['薪酬社保核对.xlsx：名单差异、字段差异、基数变化、异常清单', '敏感数据处理说明.md：读取字段、脱敏与未使用字段'],\r\n    steps: ['确认最小必要字段和脱敏范围', '以工号核对四表人员名单', '检查姓名与基数变化', '输出异常清单并清理临时副本'],\r\n    checklist: ['仅使用完成核对所必需的人员字段', '工号唯一性和重复工号已检查', '四表人数与差异人数可勾稽', '基数变化的前期、当期和变化率公式正确', '未把名单核对扩展为未经授权的工资计算'],\r\n    prompt: '在最小必要原则下读取考勤、社保、个税和银行代发表，优先只使用员工工号、姓名、状态及核对所需字段；身份证号、银行卡号等字段默认不展示。检查每张表的工号唯一性，以员工工号为主键做全外连接，生成“名单差异”“姓名/状态差异”“社保基数变化”“重复与异常”工作表。名单差异注明缺失在哪些来源；姓名不一致同时保留各来源原值；社保基数变化显示前期、当期、差额和变化率，并处理前期为零或缺失的情况。不要执行工资核算、付款或外发。临时输出不得包含无关敏感字段，并在处理说明中列出实际读取字段。'\r\n  },\r\n]\r\n\r\nconst TYPE_LABELS = { all: '全部', document: '文档', sheet: '表格', slides: '演示', image: '图片', other: '其他' }\r\n\r\nfunction Icon({ name, size = 18 }) {\r\n  const paths = {\r\n    receipt: \u003c>\u003crect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/>\u003cpath d=\"M8 7h8M8 11h8M8 15h4\"/>\u003c/>,\r\n    balance: \u003c>\u003cpath d=\"M12 3v18M3 7l9-4 9 4M5 11v4c0 2.2 3.6 4 7 4s7-1.8 7-4v-4\"/>\u003c/>,\r\n    merge: \u003c>\u003cpath d=\"M8 3v6a4 4 0 0 0 8 0V3\"/>\u003cpath d=\"M4 7h4a4 4 0 0 1 0 8H4\"/>\u003cpath d=\"M20 7h-4a4 4 0 0 0 0 8h4\"/>\u003cpath d=\"M8 21v-6a4 4 0 0 1 8 0v6\"/>\u003c/>,\r\n    contract: \u003c>\u003crect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"2\"/>\u003cpath d=\"M8 7h8M8 11h8M8 15h5\"/>\u003c/>,\r\n    report: \u003c>\u003cpath d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/>\u003cpath d=\"M14 2v6h6M8 13h8M8 17h5\"/>\u003c/>,\r\n    automation: \u003c>\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/>\u003cpath d=\"M12 1v4M12 19v4M4.2 4.2l2.8 2.8M17 17l2.8 2.8M1 12h4M19 12h4M4.2 19.8l2.8-2.8M17 7l2.8-2.8\"/>\u003c/>,\r\n    remote: \u003c>\u003crect x=\"2\" y=\"3\" width=\"20\" height=\"14\" rx=\"2\"/>\u003cpath d=\"M8 21h8M12 17v4\"/>\u003c/>,\r\n    salary: \u003c>\u003cpath d=\"M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6\"/>\u003c/>,\r\n    workbench: \u003c>\u003cpath d=\"M4 5h16v11H4z\"/>\u003cpath d=\"M8 20h8M12 16v4M8 9h8M8 12h5\"/>\u003c/>,\r\n    upload: \u003c>\u003cpath d=\"M12 16V4M7 9l5-5 5 5\"/>\u003cpath d=\"M5 15v4h14v-4\"/>\u003c/>,\r\n    search: \u003c>\u003ccircle cx=\"11\" cy=\"11\" r=\"6\"/>\u003cpath d=\"m16 16 4 4\"/>\u003c/>,\r\n    refresh: \u003c>\u003cpath d=\"M20 7v5h-5\"/>\u003cpath d=\"M4 17v-5h5\"/>\u003cpath d=\"M18 9a7 7 0 0 0-12-2L4 9M6 15a7 7 0 0 0 12 2l2-2\"/>\u003c/>,\r\n    download: \u003c>\u003cpath d=\"M12 4v11M7 11l5 5 5-5\"/>\u003cpath d=\"M5 20h14\"/>\u003c/>,\r\n    link: \u003c>\u003cpath d=\"M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1\"/>\u003cpath d=\"M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1\"/>\u003c/>,\r\n    file: \u003c>\u003cpath d=\"M6 3h8l4 4v14H6z\"/>\u003cpath d=\"M14 3v5h5\"/>\u003c/>,\r\n    folder: \u003c>\u003cpath d=\"M3 6h7l2 2h9v11H3z\"/>\u003cpath d=\"M3 10h18\"/>\u003c/>,\r\n    pin: \u003c>\u003cpath d=\"M7 4h10l-1 5 3 3H5l3-3z\"/>\u003cpath d=\"M12 12v8\"/>\u003c/>,\r\n    backup: \u003c>\u003cpath d=\"M4 7h16v13H4zM8 3h8v4\"/>\u003cpath d=\"M8 12h8M8 16h5\"/>\u003c/>,\r\n    trash: \u003c>\u003cpath d=\"M5 7h14M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6\"/>\u003c/>,\r\n    close: \u003cpath d=\"m6 6 12 12M18 6 6 18\"/>,\r\n    chevron: \u003cpath d=\"m8 10 4 4 4-4\"/>,\r\n    check: \u003cpath d=\"M5 12l5 5L19 7\"/>,\r\n    shield: \u003c>\u003cpath d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/>\u003c/>,\r\n    warning: \u003c>\u003cpath d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/>\u003cpath d=\"M12 9v4M12 17h.01\"/>\u003c/>,\r\n    info: \u003c>\u003ccircle cx=\"12\" cy=\"12\" r=\"10\"/>\u003cpath d=\"M12 16v-4M12 8h.01\"/>\u003c/>,\r\n    clock: \u003c>\u003ccircle cx=\"12\" cy=\"12\" r=\"10\"/>\u003cpath d=\"M12 6v6l4 2\"/>\u003c/>,\r\n    arrow: \u003c>\u003cpath d=\"M5 12h14M12 5l7 7-7 7\"/>\u003c/>,\r\n    star: \u003cpath d=\"M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z\"/>,\r\n    workflow: \u003c>\u003ccircle cx=\"5\" cy=\"6\" r=\"2\"/>\u003ccircle cx=\"19\" cy=\"6\" r=\"2\"/>\u003ccircle cx=\"19\" cy=\"18\" r=\"2\"/>\u003ccircle cx=\"5\" cy=\"18\" r=\"2\"/>\u003cpath d=\"M7 6h10M19 8v8M17 18H7M5 16V8\"/>\u003c/>,\r\n  }\r\n  return \u003csvg aria-hidden viewBox=\"0 0 24 24\" width={size} height={size} fill=\"none\" stroke=\"currentColor\" strokeWidth=\"1.8\" strokeLinecap=\"round\" strokeLinejoin=\"round\">{paths[name] || paths.file}\u003c/svg>\r\n}\r\n\r\nfunction UploadMenu({ onFile, onFolder, label = '上传文件或文件夹', disabled = false, compact = false }) {\r\n  const host = useRef(null)\r\n  const [open, setOpen] = useState(false)\r\n  useEffect(() => {\r\n    if (!open) return undefined\r\n    const close = event => { if (!host.current?.contains(event.target)) setOpen(false) }\r\n    document.addEventListener('pointerdown', close)\r\n    return () => document.removeEventListener('pointerdown', close)\r\n  }, [open])\r\n  const choose = action => { setOpen(false); action() }\r\n  return \u003cspan ref={host} className={`dfinance_uploadMenu ${compact ? 'is-compact' : ''}`}>\r\n    \u003cbutton className=\"dfinance_uploadTrigger\" type=\"button\" disabled={disabled} aria-haspopup=\"menu\" aria-expanded={open} onClick={() => setOpen(value => !value)}>\u003cIcon name=\"upload\" size={compact ? 16 : 18}/>\u003cspan>{label}\u003c/span>\u003cIcon name=\"chevron\" size={14}/>\u003c/button>\r\n    {open && \u003cspan className=\"dfinance_uploadPopover\" role=\"menu\">\u003cbutton type=\"button\" role=\"menuitem\" onClick={() => choose(onFile)}>\u003cIcon name=\"file\" size={17}/>\u003cspan>\u003cstrong>选择文件\u003c/strong>\u003csmall>可一次选择多个文件\u003c/small>\u003c/span>\u003c/button>\u003cbutton type=\"button\" role=\"menuitem\" onClick={() => choose(onFolder)}>\u003cIcon name=\"folder\" size={17}/>\u003cspan>\u003cstrong>选择文件夹\u003c/strong>\u003csmall>保留内部目录层级\u003c/small>\u003c/span>\u003c/button>\u003c/span>}\r\n  \u003c/span>\r\n}\r\n\r\nfunction unwrap(result, action) {\r\n  if (!result?.ok) throw new Error(result?.error?.message || `${action}失败`)\r\n  return result.value\r\n}\r\n\r\nfunction bytesToBase64(buffer) {\r\n  const bytes = new Uint8Array(buffer)\r\n  let binary = ''\r\n  for (let offset = 0; offset \u003c bytes.length; offset += 0x8000) binary += String.fromCharCode(...bytes.subarray(offset, offset + 0x8000))\r\n  return btoa(binary)\r\n}\r\n\r\nfunction base64ToBytes(text) {\r\n  const binary = atob(text)\r\n  const bytes = new Uint8Array(binary.length)\r\n  for (let index = 0; index \u003c binary.length; index += 1) bytes[index] = binary.charCodeAt(index)\r\n  return bytes\r\n}\r\n\r\nfunction uploadPath(file) {\r\n  return file.webkitRelativePath || file.name\r\n}\r\n\r\nfunction validateUploadSelection(files) {\r\n  if (!files.length) throw new Error('没有选择可上传的文件；空文件夹无法上传')\r\n  if (files.length > MAX_BATCH_FILES) throw new Error(`一次最多上传 ${MAX_BATCH_FILES} 个文件`)\r\n  const total = files.reduce((sum, file) => sum + file.size, 0)\r\n  if (total > MAX_BATCH_BYTES) throw new Error('一次上传总容量不能超过 500 MB')\r\n  return total\r\n}\r\n\r\nfunction uploadReferences(uploaded, files) {\r\n  const folderMode = files.some(file => Boolean(file.webkitRelativePath))\r\n  if (!folderMode) return uploaded.map(item => item.relative)\r\n  return [...new Set(uploaded.map(item => item.relative.split('/').slice(0, 2).join('/')))]\r\n}\r\n\r\nasync function uploadOne(remote, sessionId, file, onProgress) {\r\n  const relativePath = file.webkitRelativePath || undefined\r\n  const begin = unwrap(await remote.beginUpload(sessionId, { name: file.name, relativePath, size: file.size }), '开始上传')\r\n  let offset = 0\r\n  while (offset \u003c file.size) {\r\n    const data = bytesToBase64(await file.slice(offset, Math.min(offset + begin.chunkBytes, file.size)).arrayBuffer())\r\n    offset = unwrap(await remote.uploadChunk(sessionId, { uploadId: begin.uploadId, offset, data }), '上传分块').received\r\n    onProgress?.(offset / Math.max(1, file.size))\r\n  }\r\n  return unwrap(await remote.finishUpload(sessionId, { uploadId: begin.uploadId }), '完成上传')\r\n}\r\n\r\nasync function downloadOne(remote, sessionId, relative) {\r\n  let offset = 0\r\n  let name = relative.split('/').pop() || 'download'\r\n  const chunks = []\r\n  for (;;) {\r\n    const part = unwrap(await remote.downloadChunk(sessionId, { relative, offset, length: CHUNK_BYTES }), '下载文件')\r\n    name = part.name\r\n    chunks.push(base64ToBytes(part.data))\r\n    offset = part.nextOffset\r\n    if (part.eof) break\r\n  }\r\n  saveBlob(new Blob(chunks, { type: 'application/octet-stream' }), name)\r\n}\r\n\r\nfunction saveBlob(blob, name) {\r\n  const url = URL.createObjectURL(blob)\r\n  const anchor = document.createElement('a')\r\n  anchor.href = url\r\n  anchor.download = name\r\n  document.body.appendChild(anchor)\r\n  anchor.click()\r\n  anchor.remove()\r\n  setTimeout(() => URL.revokeObjectURL(url), 5000)\r\n}\r\n\r\nfunction formatSize(bytes) {\r\n  if (bytes \u003c 1024) return `${bytes} B`\r\n  if (bytes \u003c 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`\r\n  if (bytes \u003c 1024 * 1024 * 1024) return `${(bytes / 1024 / 1024).toFixed(1)} MB`\r\n  return `${(bytes / 1024 / 1024 / 1024).toFixed(1)} GB`\r\n}\r\n\r\nfunction formatDate(value) {\r\n  return new Intl.DateTimeFormat('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).format(new Date(value))\r\n}\r\n\r\nfunction SessionBridge({ sessionId, input, inputActions, controller }) {\r\n  useEffect(() => {\r\n    const bridge = { sessionId, input, inputActions }\r\n    controller.setBridge(bridge)\r\n    return () => controller.clearBridge(bridge)\r\n  }, [controller, sessionId, input, inputActions])\r\n  return null\r\n}\r\n\r\nfunction FinancePanel({ sessionId, input, inputActions, remote, onClose, isOpen }) {\r\n  const picker = useRef(null)\r\n  const folderPicker = useRef(null)\r\n  const [files, setFiles] = useState([])\r\n  const [workspace, setWorkspace] = useState({ eligible: false, name: '当前工作区', path: '', canUpload: true, canDownload: true, reason: '' })\r\n  const [status, setStatus] = useState('正在读取资料…')\r\n  const [launching, setLaunching] = useState(false)\r\n\r\n  useEffect(() => { setLaunching(false) }, [sessionId])\r\n\r\n  const refresh = async () => {\r\n    try {\r\n      setStatus('正在读取资料…')\r\n      const info = unwrap(await remote().workspaceInfo(sessionId), '读取工作区信息')\r\n      setWorkspace(info)\r\n      const value = unwrap(await remote().listFiles(sessionId), '读取文件列表')\r\n      setFiles(value)\r\n      setStatus(value.length ? `已找到 ${value.length} 个可用文件` : '还没有上传财务资料')\r\n    } catch (error) { setStatus(error instanceof Error ? error.message : String(error)) }\r\n  }\r\n  useEffect(() => { if (isOpen) void refresh() }, [sessionId, isOpen])\r\n  useEffect(() => {\r\n    const escape = event => { if (event.key === 'Escape') onClose() }\r\n    document.addEventListener('keydown', escape)\r\n    return () => { document.removeEventListener('keydown', escape) }\r\n  }, [onClose])\r\n\r\n  const appendDraft = text => {\r\n    const current = input?.draft?.trimEnd() || ''\r\n    inputActions.setDraft(`${current}${current ? '\\n\\n' : ''}${text}`)\r\n  }\r\n  const uploadFiles = async selected => {\r\n    try {\r\n      validateUploadSelection(selected)\r\n      for (const [index, file] of selected.entries()) {\r\n        const label = uploadPath(file)\r\n        setStatus(`上传 ${index + 1}/${selected.length} · ${label}`)\r\n        await uploadOne(remote(), sessionId, file, ratio => setStatus(`上传 ${index + 1}/${selected.length} · ${Math.round(ratio * 100)}%`))\r\n      }\r\n      await refresh()\r\n      setStatus(`已上传 ${selected.length} 个文件`)\r\n    } catch (error) { setStatus(error instanceof Error ? error.message : String(error)) }\r\n  }\r\n  const openWorkspace = async () => {\r\n    try {\r\n      unwrap(await remote().revealWorkspace(sessionId), '打开当前工作区')\r\n      setStatus('已在 Finder 打开')\r\n    } catch (error) { setStatus(error instanceof Error ? error.message : String(error)) }\r\n  }\r\n  const launchScenario = async scenario => {\r\n    if (launching) return\r\n    try {\r\n      setLaunching(true)\r\n      setStatus('正在准备内置工作流…')\r\n      const workflow = unwrap(await remote().prepareTask(sessionId, {\r\n        id: scenario.id,\r\n        title: scenario.title,\r\n        content: composeFinanceTask(scenario),\r\n      }), '准备内置工作流')\r\n      const matched = matchScenarioFiles(files, scenario).map(file => file.relative)\r\n      const launch = composeFinanceLaunch(scenario, workflow.relative, matched)\r\n      inputActions.setDraft(mergeFinanceLaunchDraft(input?.draft, launch))\r\n      onClose()\r\n    } catch (error) {\r\n      setStatus(error instanceof Error ? error.message : String(error))\r\n    } finally {\r\n      setLaunching(false)\r\n    }\r\n  }\r\n  const referenceFile = file => { appendDraft(`@${file.relative}`); setStatus(`已引用 ${file.name}`) }\r\n  const downloadFile = async file => { try { setStatus(`正在下载 ${file.name}…`); await downloadOne(remote(), sessionId, file.relative); setStatus(`已开始下载 ${file.name}`) } catch (error) { setStatus(error instanceof Error ? error.message : String(error)) } }\r\n\r\n  return \u003c>\r\n    \u003cFinanceDashboard sessionId={sessionId} files={files} workspace={workspace} status={status} onStatus={setStatus} onRefresh={() => void refresh()} onOpenWorkspace={() => void openWorkspace()} onChooseFiles={() => picker.current?.click()} onChooseFolder={() => folderPicker.current?.click()} onUploadFiles={selected => void uploadFiles(selected)} onReferenceFile={referenceFile} onDownloadFile={file => void downloadFile(file)} onLaunchWorkflow={scenario => void launchScenario(scenario)} launching={launching} onClose={onClose}/>\r\n    \u003cinput ref={picker} type=\"file\" multiple hidden onChange={event => { const selected = [...(event.target.files || [])]; event.target.value = ''; void uploadFiles(selected) }}/>\r\n    \u003cinput ref={folderPicker} type=\"file\" multiple webkitdirectory=\"\" directory=\"\" hidden onChange={event => { const selected = [...(event.target.files || [])]; event.target.value = ''; void uploadFiles(selected) }}/>\r\n  \u003c/>\r\n}\r\n\r\nfunction createFinanceController() {\r\n  let snapshot = { open: new URLSearchParams(window.location.search).get('workbench') === 'finance', bridge: undefined }\r\n  const listeners = new Set()\r\n  const publish = next => { snapshot = next; for (const listener of listeners) listener() }\r\n  return {\r\n    getSnapshot: () => snapshot,\r\n    subscribe: listener => { listeners.add(listener); return () => listeners.delete(listener) },\r\n    setBridge: bridge => publish({ ...snapshot, bridge }),\r\n    clearBridge: bridge => { if (snapshot.bridge === bridge) publish({ ...snapshot, bridge: undefined }) },\r\n    toggle: () => publish({ ...snapshot, open: !snapshot.open }),\r\n    close: () => { if (snapshot.open) publish({ ...snapshot, open: false }) },\r\n  }\r\n}\r\n\r\nfunction FinanceSurface({ controller, remote }) {\r\n  const snapshot = useSyncExternalStore(controller.subscribe, controller.getSnapshot, controller.getSnapshot)\r\n  if (!snapshot.bridge) return \u003cdiv className=\"dfinance_unavailable\">\u003cIcon name=\"workbench\" size={30}/>\u003ch2>财务工作台\u003c/h2>\u003cp>请先打开一个会话或新会话，再使用财务工作台。\u003c/p>\u003cbutton type=\"button\" onClick={controller.close}>返回对话\u003c/button>\u003c/div>\r\n  return \u003cFinancePanel {...snapshot.bridge} remote={remote} onClose={controller.close} isOpen={snapshot.open}/>\r\n}\r\n\r\nfunction sidebarRoot() {\r\n  const column = document.querySelector('[data-pane=\"sidebar\"], [class*=\"sidebarCol\"]')\r\n  if (!column) return undefined\r\n  return column.querySelector('[class*=\"logoRow\"]')?.parentElement || column.firstElementChild || undefined\r\n}\r\n\r\nfunction newSessionBase(root) {\r\n  const button = root.querySelector('button[class*=\"newSession\"]')\r\n  if (button) return button.closest('[class*=\"logoRow\"]') || button\r\n  return [...root.children].find(child => child.tagName === 'BUTTON')\r\n}\r\n\r\nfunction mountSidebarEntry(controller) {\r\n  const entry = document.createElement('button')\r\n  entry.type = 'button'\r\n  entry.dataset.dshFinanceEntry = ''\r\n  entry.className = 'dfinance_sidebarEntry'\r\n  entry.setAttribute('aria-label', '财务工作台')\r\n  entry.innerHTML = '\u003cspan class=\"dfinance_sidebarIcon\">\u003csvg viewBox=\"0 0 16 16\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003crect x=\"2\" y=\"2.5\" width=\"12\" height=\"9\" rx=\"1.5\"/>\u003cpath d=\"M5 14h6M8 11.5V14M5 6h6M5 8.5h4\"/>\u003c/svg>\u003c/span>\u003cspan class=\"dfinance_sidebarLabel\">财务工作台\u003c/span>'\r\n  entry.addEventListener('click', controller.toggle)\r\n  const place = () => {\r\n    const root = sidebarRoot()\r\n    if (!root) return\r\n    const taskboard = root.querySelector(':scope > [data-dsh-taskboard-entry]')\r\n    const ssh = root.querySelector(':scope > [data-dsh-ssh-entry]')\r\n    const teacher = root.querySelector(':scope > [data-dsh-teacher-entry]')\r\n    const base = newSessionBase(root)\r\n    if (teacher) {\r\n      if (teacher.nextElementSibling !== entry) teacher.after(entry)\r\n    } else if (taskboard) {\r\n      if (taskboard.nextElementSibling !== entry) taskboard.after(entry)\r\n    } else if (ssh) {\r\n      if (entry.nextElementSibling !== ssh || entry.parentElement !== root) root.insertBefore(entry, ssh)\r\n    } else if (base && (entry.parentElement !== root || base.nextElementSibling !== entry)) {\r\n      base.after(entry)\r\n    }\r\n  }\r\n  const observer = new MutationObserver(place)\r\n  observer.observe(document.body, { childList: true, subtree: true })\r\n  const sync = () => { if (controller.getSnapshot().open) entry.dataset.active = 'true'; else delete entry.dataset.active }\r\n  const unsubscribe = controller.subscribe(sync)\r\n  place(); sync()\r\n  return () => { observer.disconnect(); unsubscribe(); entry.remove() }\r\n}\r\n\r\nfunction mountEmbeddedView(controller, remote) {\r\n  let container\r\n  let root\r\n  let suppressPanelEvent = false\r\n  const ensure = () => {\r\n    if (container?.isConnected) return\r\n    const column = document.querySelector('[data-pane=\"conversation\"], [class*=\"centerCol\"]')\r\n    if (!column) return\r\n    container = document.createElement('div')\r\n    container.dataset.dshFinanceView = ''\r\n    column.appendChild(container)\r\n    root = createRoot(container)\r\n    root.render(\u003cFinanceSurface controller={controller} remote={remote}/>)\r\n  }\r\n  const observer = new MutationObserver(ensure)\r\n  observer.observe(document.body, { childList: true, subtree: true })\r\n  const sync = () => {\r\n    ensure()\r\n    if (controller.getSnapshot().open) {\r\n      suppressPanelEvent = true\r\n      document.documentElement.removeAttribute('data-dsh-taskboard-active')\r\n      document.documentElement.removeAttribute('data-dsh-ssh-active')\r\n      document.documentElement.removeAttribute('data-dsh-teacher-active')\r\n      document.documentElement.removeAttribute('data-dsh-skill-explorer-active')\r\n      document.dispatchEvent(new CustomEvent('dsh-panel-activate', { detail: 'ssh' }))\r\n      document.dispatchEvent(new CustomEvent('dsh-panel-activate', { detail: 'taskboard' }))\r\n      document.dispatchEvent(new CustomEvent('dsh-panel-activate', { detail: 'teacher' }))\r\n      document.dispatchEvent(new CustomEvent('dsh-panel-activate', { detail: 'skill-explorer' }))\r\n      suppressPanelEvent = false\r\n      document.documentElement.setAttribute('data-dsh-finance-active', '')\r\n      document.dispatchEvent(new CustomEvent('dsh-panel-activate', { detail: 'finance' }))\r\n    } else document.documentElement.removeAttribute('data-dsh-finance-active')\r\n  }\r\n  const onOtherPanel = event => { if (!suppressPanelEvent && event.detail !== 'finance') controller.close() }\r\n  const onSidebarConversation = event => {\r\n    if (!controller.getSnapshot().open) return\r\n    if (event.target?.closest?.('[class*=\"sessionRow\"], [class*=\"projectRow\"], [class*=\"newSession\"], [class*=\"searchResultRow\"]')) controller.close()\r\n  }\r\n  document.addEventListener('dsh-panel-activate', onOtherPanel)\r\n  document.addEventListener('click', onSidebarConversation, true)\r\n  const unsubscribe = controller.subscribe(sync)\r\n  ensure(); sync()\r\n  return () => {\r\n    observer.disconnect(); unsubscribe()\r\n    document.removeEventListener('dsh-panel-activate', onOtherPanel)\r\n    document.removeEventListener('click', onSidebarConversation, true)\r\n    document.documentElement.removeAttribute('data-dsh-finance-active')\r\n    root?.unmount(); container?.remove()\r\n  }\r\n}\r\n\r\nfunction adoptStyles() {\r\n  if (document.querySelector('style[data-dsh-finance-workbench]')) return\r\n  const style = document.createElement('style')\r\n  style.dataset.dshFinanceWorkbench = '1'\r\n  style.textContent = `\r\n.dfinance_inlineUploads{display:inline-flex;align-items:center;gap:3px}.dfinance_inlineUpload{border:0;border-radius:9px;background:var(--dsw-alias-interactive-bg-hover);color:var(--dsw-alias-label-secondary);cursor:pointer;padding:6px 10px;font:600 12px/1.2 var(--dsw-font-family);display:inline-flex;align-items:center;gap:6px}.dfinance_inlineUpload:hover{color:var(--dsw-alias-label-primary)}.dfinance_inlineUpload.is-folder{padding-left:8px;padding-right:8px}.dfinance_inlineUpload:disabled{opacity:.62;cursor:wait}\r\n.dfinance_dock{position:fixed;z-index:1000002;left:16px;top:130px;width:158px;min-height:44px;border:1px solid #ffffff6b;border-radius:14px;background:linear-gradient(135deg,#059669,#10b981);color:white;box-shadow:0 10px 28px #0596694a;display:flex;align-items:center;gap:9px;padding:7px eFiles) throw new Error('dsh-finance-workbench: remote namespace not mounted')\r\n    return () => { financeFiles = undefined; void dispose() }\r\n  }, 'dsh-finance-workbench: remote')\r\n  const remote = () => {\r\n    if (!financeFiles) throw new Error('财务文件中心尚未准备好，请稍后再试')\r\n    return financeFiles\r\n  }\r\n  ctx.effect(() => {\r\n    const disposeEntry = mountSidebarEntry(controller)\r\n    const disposeView = mountEmbeddedView(controller, remote)\r\n    return () => { disposeView(); disposeEntry() }\r\n  }, 'dsh-finance-workbench: embedded surfaces')\r\n  ctx.slots.inject('conversation.input.left', () => ctx.slots.register({\r\n    name: 'conversation.input.left', id: 'finance-tools', order: 13,\r\n    inject: () => ({ remote, controller }),\r\n  }, SessionBridge))\r\n}\r\n\n~~~~~~\n\n## src/clipboard.js\n\nSHA-256: 2cdd00be529b2e9430c553ff77ee8dc4b7cc65fd7474c6ca5a587c71b8d5c213\n\n~~~~~~text\nexport async function copyText(value) {\r\n  try {\r\n    if (navigator.clipboard?.writeText) {\r\n      await navigator.clipboard.writeText(value)\r\n      return\r\n    }\r\n  } catch {}\r\n  const textarea = document.createElement('textarea')\r\n  textarea.value = value\r\n  textarea.style.position = 'fixed'\r\n  textarea.style.opacity = '0'\r\n  document.body.appendChild(textarea)\r\n  try {\r\n    textarea.select()\r\n    if (!document.execCommand('copy')) throw new Error('剪贴板不可用，请手动复制')\r\n  } finally {\r\n    textarea.remove()\r\n  }\r\n}\r\n\n~~~~~~\n\n## src/contract.js\n\nSHA-256: 0e5546d912158a80f68a701d24363c917128b6187c7fcdd3b6a7269d4bec6b28\n\n~~~~~~text\nimport { z } from 'zod'\r\n\r\nconst sessionIdSchema = z.string().min(1)\r\nconst relativeSchema = z.string().min(1).max(2000)\r\nconst fileInfoSchema = z.object({\r\n  relative: relativeSchema,\r\n  name: z.string().min(1),\r\n  size: z.number().nonnegative(),\r\n  modifiedAt: z.number().nonnegative(),\r\n}).readonly()\r\n\r\nconst beginRequestSchema = z.object({\r\n  name: z.string().min(1).max(255),\r\n  relativePath: z.string().min(1).max(2000).optional(),\r\n  size: z.number().int().nonnegative().max(50 * 1024 * 1024),\r\n}).readonly()\r\nconst beginResultSchema = z.object({\r\n  uploadId: z.string().min(8).max(100),\r\n  relative: relativeSchema,\r\n  chunkBytes: z.number().int().positive(),\r\n}).readonly()\r\nconst chunkRequestSchema = z.object({\r\n  uploadId: z.string().min(8).max(100),\r\n  offset: z.number().int().nonnegative(),\r\n  data: z.string().max(800000),\r\n}).readonly()\r\nconst chunkResultSchema = z.object({ received: z.number().int().nonnegative() }).readonly()\r\nconst finishRequestSchema = z.object({ uploadId: z.string().min(8).max(100) }).readonly()\r\nconst listResultSchema = z.array(fileInfoSchema)\r\nconst downloadRequestSchema = z.object({\r\n  relative: relativeSchema,\r\n  offset: z.number().int().nonnegative(),\r\n  length: z.number().int().positive().max(512 * 1024),\r\n}).readonly()\r\nconst downloadResultSchema = z.object({\r\n  name: z.string().min(1),\r\n  data: z.string(),\r\n  total: z.number().int().nonnegative(),\r\n  nextOffset: z.number().int().nonnegative(),\r\n  eof: z.boolean(),\r\n}).readonly()\r\nconst workspaceInfoSchema = z.object({\r\n  eligible: z.boolean(),\r\n  name: z.string().min(1),\r\n  path: z.string().min(1),\r\n  canUpload: z.literal(true),\r\n  canDownload: z.literal(true),\r\n  reason: z.string(),\r\n}).readonly()\r\nconst revealWorkspaceResultSchema = z.object({\r\n  opened: z.literal(true),\r\n  path: z.string().min(1),\r\n}).readonly()\r\nconst prepareTaskRequestSchema = z.object({\r\n  id: z.string().regex(/^[a-z0-9-]+$/).max(64),\r\n  title: z.string().min(1).max(120),\r\n  content: z.string().min(1).max(30000),\r\n}).readonly()\r\nconst prepareTaskResultSchema = z.object({\r\n  relative: relativeSchema,\r\n  updatedAt: z.number().nonnegative(),\r\n}).readonly()\r\n\r\nfunction agentParameter() {\r\n  return {\r\n    name: 'agent',\r\n    wire: 'agentId',\r\n    source: 'lookup',\r\n    lookup: 'agent',\r\n    codec: {\r\n      mode: 'strict',\r\n      typeSymbol: '@deepseek-ai/dsh-session/types#SessionId',\r\n      schema: sessionIdSchema,\r\n    },\r\n  }\r\n}\r\n\r\nfunction jsonParameter(name, schema, typeSymbol) {\r\n  return {\r\n    name,\r\n    wire: name,\r\n    source: 'json',\r\n    codec: { mode: 'strict', typeSymbol, schema },\r\n  }\r\n}\r\n\r\nfunction descriptor(method, requestSchema, resultSchema, resultSymbol) {\r\n  const parameters = [agentParameter()]\r\n  if (requestSchema) parameters.push(jsonParameter('request', requestSchema, `dsh-finance-workbench#${method}Request`))\r\n  return {\r\n    id: `dsh-finance-workbench#financeFiles/${method}`,\r\n    service: 'financeFiles',\r\n    namespace: 'financeFiles',\r\n    method,\r\n    invocation: { kind: 'direct' },\r\n    parameters,\r\n    result: { mode: 'strict', typeSymbol: resultSymbol, schema: resultSchema },\r\n  }\r\n}\r\n\r\nexport const FINANCE_FILE_INVOCATIONS = [\r\n  descriptor('beginUpload', beginRequestSchema, beginResultSchema, 'dsh-finance-workbench#BeginUploadResult'),\r\n  descriptor('uploadChunk', chunkRequestSchema, chunkResultSchema, 'dsh-finance-workbench#UploadChunkResult'),\r\n  descriptor('finishUpload', finishRequestSchema, fileInfoSchema, 'dsh-finance-workbench#FileInfo'),\r\n  descriptor('listFiles', null, listResultSchema, 'dsh-finance-workbench#FileInfo[]'),\r\n  descriptor('workspaceInfo', null, workspaceInfoSchema, 'dsh-finance-workbench#WorkspaceInfo'),\r\n  descriptor('revealWorkspace', null, revealWorkspaceResultSchema, 'dsh-finance-workbench#RevealWorkspaceResult'),\r\n  descriptor('prepareTask', prepareTaskRequestSchema, prepareTaskResultSchema, 'dsh-finance-workbench#PrepareTaskResult'),\r\n  descriptor('downloadChunk', downloadRequestSchema, downloadResultSchema, 'dsh-finance-workbench#DownloadChunkResult'),\r\n]\r\n\r\nexport const TYPERT_REMOTE = {\r\n  package: 'dsh-finance-workbench',\r\n  descriptors: FINANCE_FILE_INVOCATIONS,\r\n}\r\n\n~~~~~~\n\n## src/finance-dashboard-helpers.js\n\nSHA-256: 5e83646555f00988c21e3831ffb6710baf811e61588270c9698e26e6904179ae\n\n~~~~~~text\nexport function localDateKey(date = new Date()) {\r\n  const year = date.getFullYear()\r\n  const month = String(date.getMonth() + 1).padStart(2, '0')\r\n  const day = String(date.getDate()).padStart(2, '0')\r\n  return `${year}-${month}-${day}`\r\n}\r\n\r\nexport function isValidDateKey(value) {\r\n  if (typeof value !== 'string' || !/^\\d{4}-\\d{2}-\\d{2}$/.test(value)) return false\r\n  const [year, month, day] = value.split('-').map(Number)\r\n  if (year \u003c 1 || month \u003c 1 || month > 12 || day \u003c 1 || day > 31) return false\r\n  const date = new Date(0)\r\n  date.setFullYear(year, month - 1, day)\r\n  return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day\r\n}\r\n\r\nexport function isValidPeriod(value) {\r\n  return typeof value === 'string' && /^\\d{4}-(0[1-9]|1[0-2])$/.test(value) && Number(value.slice(0, 4)) > 0\r\n}\r\n\r\nexport function shiftDate(value, days) {\r\n  const date = new Date(`${value}T12:00:00`)\r\n  date.setDate(date.getDate() + days)\r\n  return localDateKey(date)\r\n}\r\n\r\nexport function greetingFor(date = new Date()) {\r\n  const hour = date.getHours()\r\n  if (hour \u003c 6) return '夜深了'\r\n  if (hour \u003c 11) return '早上好'\r\n  if (hour \u003c 14) return '中午好'\r\n  if (hour \u003c 18) return '下午好'\r\n  return '晚上好'\r\n}\r\n\r\nexport function normalizeTodo(item, fallbackDate = localDateKey()) {\r\n  return {\r\n    id: String(item?.id || `todo-${Date.now().toString(36)}`),\r\n    text: String(item?.text || '').trim(),\r\n    category: String(item?.category || '通用'),\r\n    due: isValidDateKey(item?.due) ? item.due : fallbackDate,\r\n    priority: ['高', '中', '低'].includes(item?.priority) ? item.priority : '中',\r\n    done: Boolean(item?.done),\r\n  }\r\n}\r\n\r\nexport function closeProgress(tasks) {\r\n  const rows = Array.isArray(tasks) ? tasks : []\r\n  if (!rows.length) return { done: 0, total: 0, percent: 0 }\r\n  const done = rows.filter(item => item.done).length\r\n  return { done, total: rows.length, percent: Math.round(done / rows.length * 100) }\r\n}\r\n\r\nexport function dueLabel(value, today = localDateKey()) {\r\n  if (value === today) return '今天'\r\n  if (value === shiftDate(today, 1)) return '明天'\r\n  const distance = Math.round((new Date(`${value}T12:00:00`) - new Date(`${today}T12:00:00`)) / 86400000)\r\n  if (distance \u003c 0) return `逾期 ${Math.abs(distance)} 天`\r\n  return `${Number(value.slice(5, 7))}月${Number(value.slice(8, 10))}日`\r\n}\r\n\r\nexport function buildFinanceBackup(state) {\r\n  return {\r\n    product: 'dsh-finance-workbench',\r\n    version: 2,\r\n    exportedAt: new Date().toISOString(),\r\n    profile: state.profile,\r\n    todos: state.todos,\r\n    closeTasks: state.closeTasks,\r\n    favorites: state.favorites,\r\n    fieldDictionary: state.fieldDictionary,\r\n    settings: state.settings,\r\n    snapshots: Array.isArray(state.snapshots) ? state.snapshots : [],\r\n    auditLog: Array.isArray(state.auditLog) ? state.auditLog : [],\r\n    exceptions: Array.isArray(state.exceptions) ? state.exceptions : [],\r\n    theme: String(state.theme || 'indigo'),\r\n    pinnedFiles: Array.isArray(state.pinnedFiles) ? state.pinnedFiles : [],\r\n    recentWorkflows: Array.isArray(state.recentWorkflows) ? state.recentWorkflows : [],\r\n  }\r\n}\r\n\r\nexport function parseFinanceBackup(value) {\r\n  if (typeof value === 'string' && value.length > 5 * 1024 * 1024) throw new Error('备份超过 5 MB，请拆分或整理后重试')\r\n  const data = typeof value === 'string' ? JSON.parse(value) : value\r\n  if (!data || data.product !== 'dsh-finance-workbench' || Number(data.version) !== 2) throw new Error('不是有效的财务工作台 v2 备份')\r\n  if (!Array.isArray(data.todos) || !Array.isArray(data.closeTasks) || !Array.isArray(data.favorites) || !Array.isArray(data.fieldDictionary)) throw new Error('财务工作台备份内容不完整')\r\n  validateFinanceState(data)\r\n  return data\r\n}\r\n\r\nfunction record(value, label) {\r\n  if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error(`备份中的${label}格式无效`)\r\n}\r\n\r\nfunction textField(row, key, label, max = 2000, required = false) {\r\n  const value = row[key]\r\n  if (value === undefined && !required) return\r\n  if (typeof value !== 'string' || value.length > max || (required && !value.trim())) throw new Error(`备份中的${label}格式无效`)\r\n}\r\n\r\nfunction collection(data, key, label, validate, optional = false) {\r\n  if (data[key] === undefined && optional) return\r\n  if (!Array.isArray(data[key]) || data[key].length > 10000) throw new Error(`备份中的${label}格式无效或条目过多`)\r\n  const ids = new Set()\r\n  for (const row of data[key]) {\r\n    record(row, label)\r\n    textField(row, 'id', `${label}标识`, 200, true)\r\n    if (ids.has(row.id)) throw new Error(`备份中的${label}包含重复标识`)\r\n    ids.add(row.id)\r\n    validate(row)\r\n  }\r\n}\r\n\r\nfunction stringList(data, key, label, optional = false) {\r\n  if (data[key] === undefined && optional) return\r\n  if (!Array.isArray(data[key]) || data[key].length > 10000 || data[key].some(item => typeof item !== 'string' || item.length > 1200)) throw new Error(`备份中的${label}格式无效`)\r\n}\r\n\r\nfunction amountField(row, key, label, empty = false) {\r\n  const value = row[key]\r\n  if (value === undefined || (empty && value === '')) return\r\n  if (typeof value !== 'number' || !Number.isFinite(value) || value \u003c 0 || !Number.isSafeInteger(Math.round(value * 100))) throw new Error(`备份中的${label}金额无效`)\r\n}\r\n\r\nexport function validateFinanceState(data) {\r\n  for (const key of ['profile', 'settings']) if (data[key] !== undefined) record(data[key], key === 'profile' ? '主体设置' : '阈值设置')\r\n  for (const key of ['name', 'entity', 'role']) textField(data.profile || {}, key, '主体设置')\r\n  if (data.profile?.period !== undefined && !isValidPeriod(data.profile.period)) throw new Error('备份中的主体期间无效')\r\n  for (const key of ['largeAmount', 'dateTolerance', 'varianceRate']) amountField(data.settings || {}, key, '阈值设置')\r\n  if (data.settings?.dateTolerance !== undefined && (!Number.isInteger(data.settings.dateTolerance) || data.settings.dateTolerance > 31)) throw new Error('备份中的日期容差无效')\r\n  collection(data, 'todos', '待办', row => {\r\n    textField(row, 'text', '待办内容', 2000, true)\r\n    textField(row, 'category', '待办分类')\r\n    if (!isValidDateKey(row.due) || typeof row.done !== 'boolean' || !['高', '中', '低'].includes(row.priority)) throw new Error('备份中的待办日期或状态无效')\r\n  })\r\n  collection(data, 'closeTasks', '月结任务', row => {\r\n    for (const key of ['title', 'owner', 'evidence']) textField(row, key, '月结任务', 2000, key === 'title')\r\n    if (typeof row.done !== 'boolean') throw new Error('备份中的月结状态无效')\r\n  })\r\n  collection(data, 'fieldDictionary', '字段字典', row => {\r\n    for (const key of ['name', 'type', 'rule']) textField(row, key, '字段字典', 5000, true)\r\n  })\r\n  stringList(data, 'favorites', '工作流收藏')\r\n  stringList(data, 'pinnedFiles', '资料置顶', true)\r\n  stringList(data, 'recentWorkflows', '最近工作流', true)\r\n  collection(data, 'exceptions', '异常台账', row => {\r\n    for (const key of ['title', 'category', 'owner', 'source', 'evidence']) textField(row, key, '异常台账', 2000, key === 'title')\r\n    amountField(row, 'amount', '异常台账')\r\n    if (!isValidDateKey(row.due) || !['高', '中', '低'].includes(row.severity) || !EXCEPTION_STATUSES.includes(row.status)) throw new Error('备份中的异常日期或状态无效')\r\n    if (row.status === '已关闭' && !canCloseFinanceException(row)) throw new Error('备份中存在没有处置证据的已关闭异常')\r\n    for (const key of ['createdAt', 'updatedAt']) if (row[key] !== undefined && (typeof row[key] !== 'string' || !Number.isFinite(Date.parse(row[key])))) throw new Error('备份中的异常时间无效')\r\n  }, true)\r\n  collection(data, 'auditLog', '审计日志', row => {\r\n    for (const key of ['type', 'action', 'detail']) textField(row, key, '审计日志')\r\n    if (typeof row.at !== 'string' || !Number.isFinite(Date.parse(row.at))) throw new Error('备份中的日志时间无效')\r\n  }, true)\r\n  if (data.snapshots !== undefined) {\r\n    if (!Array.isArray(data.snapshots) || data.snapshots.length > 10000) throw new Error('备份中的经营快照格式无效')\r\n    const periods = new Set()\r\n    for (const row of data.snapshots) {\r\n      record(row, '经营快照')\r\n      if (!isValidPeriod(row.period) || periods.has(row.period)) throw new Error('备份中的经营期间无效或重复')\r\n      periods.add(row.period)\r\n      for (const key of ['income', 'expense', 'cash', 'receivable', 'payable', 'budget']) amountField(row, key, '经营快照', true)\r\n      textField(row, 'note', '经营快照备注')\r\n    }\r\n  }\r\n  if (data.theme !== undefined && !['indigo', 'jade', 'sand', 'night'].includes(data.theme)) throw new Error('备份中的主题无效')\r\n  return data\r\n}\r\n\r\nexport const EXCEPTION_STATUSES = ['未处理', '处理中', '待业务确认', '已关闭']\r\n\r\nexport function normalizeFinanceException(item, fallbackDate = localDateKey()) {\r\n  const amount = Number(item?.amount)\r\n  const now = new Date().toISOString()\r\n  return {\r\n    id: String(item?.id || `exception-${Date.now().toString(36)}`),\r\n    title: String(item?.title || '').trim().slice(0, 120),\r\n    category: String(item?.category || '通用').trim().slice(0, 30),\r\n    severity: ['高', '中', '低'].includes(item?.severity) ? item.severity : '中',\r\n    amount: Number.isFinite(amount) && amount >= 0 ? Math.round((amount + Number.EPSILON) * 100) / 100 : 0,\r\n    owner: String(item?.owner || '待明确').trim().slice(0, 40) || '待明确',\r\n    due: isValidDateKey(item?.due) ? item.due : fallbackDate,\r\n    status: item?.status === '已关闭' && !canCloseFinanceException(item) ? '未处理' : EXCEPTION_STATUSES.includes(item?.status) ? item.status : '未处理',\r\n    source: String(item?.source || '').trim().slice(0, 180),\r\n    evidence: String(item?.evidence || '').trim().slice(0, 300),\r\n    createdAt: String(item?.createdAt || now),\r\n    updatedAt: String(item?.updatedAt || item?.createdAt || now),\r\n  }\r\n}\r\n\r\nexport function financeExceptionRisk(item, settings = {}, today = localDateKey()) {\r\n  const row = normalizeFinanceException(item, today)\r\n  if (row.status === '已关闭') return 0\r\n  let score = { 高: 60, 中: 35, 低: 15 }[row.severity]\r\n  if (row.due \u003c today) score += 25\r\n  if (Number(settings.largeAmount) > 0 && row.amount >= Number(settings.largeAmount)) score += 15\r\n  if (row.status === '待业务确认') score += 5\r\n  return Math.min(100, score)\r\n}\r\n\r\nexport function summarizeFinanceExceptions(items, settings = {}, today = localDateKey()) {\r\n  const rows = (Array.isArray(items) ? items : []).map(item => normalizeFinanceException(item, today))\r\n  const open = rows.filter(item => item.status !== '已关闭')\r\n  return {\r\n    open: open.length,\r\n    high: open.filter(item => financeExceptionRisk(item, settings, today) >= 60).length,\r\n    overdue: open.filter(item => item.due \u003c today).length,\r\n    waiting: open.filter(item => item.status === '待业务确认').length,\r\n    amount: open.reduce((sum, item) => sum + Math.round(item.amount * 100), 0) / 100,\r\n    closed: rows.length - open.length,\r\n  }\r\n}\r\n\r\nexport function canCloseFinanceException(item) {\r\n  return String(item?.evidence || '').trim().length >= 4\r\n}\r\n\r\nexport function financeExceptionsToCsv(items) {\r\n  const quote = value => {\r\n    const text = String(value ?? '')\r\n    const safe = typeof value === 'string' && /^(\\s*[=+\\-@]|[\\t\\r\\n])/.test(text) ? `'${text}` : text\r\n    return `\"${safe.replaceAll('\"', '\"\"')}\"`\r\n  }\r\n  const header = ['异常事项', '业务模块', '风险等级', '金额影响', '责任人', '截止日期', '状态', '来源依据', '处置证据']\r\n  const rows = (Array.isArray(items) ? items : []).map(item => {\r\n    const row = normalizeFinanceException(item)\r\n    return [row.title, row.category, row.severity, row.amount, row.owner, row.due, row.status, row.source, row.evidence]\r\n  })\r\n  return `\\uFEFF${[header, ...rows].map(row => row.map(quote).join(',')).join('\\r\\n')}`\r\n}\r\n\r\nexport function emptyFinanceSnapshot(period = localDateKey().slice(0, 7)) {\r\n  return { period, income: '', expense: '', cash: '', receivable: '', payable: '', budget: '', note: '' }\r\n}\r\n\r\nexport function snapshotProfit(snapshot) {\r\n  const income = Number(snapshot?.income)\r\n  const expense = Number(snapshot?.expense)\r\n  if (snapshot?.income === '' || snapshot?.expense === '' || !Number.isFinite(income) || !Number.isFinite(expense)) return null\r\n  return (Math.round(income * 100) - Math.round(expense * 100)) / 100\r\n}\r\n\r\n// A comparison of manually entered totals, not an accounting budget ledger.\r\nexport function snapshotBudgetDifference(snapshot) {\r\n  if (snapshot?.expense === '' || snapshot?.expense == null || snapshot?.budget === '' || snapshot?.budget == null) return null\r\n  const expense = Number(snapshot.expense), budget = Number(snapshot.budget)\r\n  if (!Number.isFinite(expense) || !Number.isFinite(budget)) return null\r\n  return (Math.round(expense * 100) - Math.round(budget * 100)) / 100\r\n}\r\n\r\nexport function normalizeFinanceSnapshot(snapshot, fallbackPeriod = localDateKey().slice(0, 7)) {\r\n  const result = emptyFinanceSnapshot(isValidPeriod(snapshot?.period) ? snapshot.period : fallbackPeriod)\r\n  for (const key of ['income', 'expense', 'cash', 'receivable', 'payable', 'budget']) {\r\n    if (snapshot?.[key] === '' || snapshot?.[key] === null || snapshot?.[key] === undefined) continue\r\n    const value = Number(snapshot[key])\r\n    result[key] = Number.isFinite(value) && value >= 0 ? Math.round((value + Number.EPSILON) * 100) / 100 : ''\r\n  }\r\n  result.note = String(snapshot?.note || '').trim().slice(0, 300)\r\n  return result\r\n}\r\n\r\nexport function workflowsForView(workflows, view) {\r\n  const rules = {\r\n    reconcile: item => ['data', 'reconcile', 'expense'].includes(item.group),\r\n    tax: item => ['tax', 'expense'].includes(item.group),\r\n    settlement: item => item.group === 'settlement' || ['order-cash-invoice', 'con
