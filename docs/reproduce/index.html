ackage-lock.json、build.mjs、cordis.patch.yml、src/、scripts/ 和 test/；以实际源码为准，不凭印象猜测接口。\n\n## 3. 同样的外观与行为\n\n保持源码的布局、模块顺序、中文文案、字体、间距、颜色、主题、图标、响应式断点和交互。保留资料上传、索引、搜索、筛选、引用、下载、置顶，任务创建、编辑、状态、备份恢复及所有源码已有功能。\n\n工作流必须使用原 task-prompt.js 的组合器，保持角色、材料要求、完整执行规则、模块指令与验收清单。共 25 个工作流，逐个核对，不删减为摘要。\n\n复用原宿主协议、客户端注入和服务端注册，不虚构 RPC。按锁文件安装依赖；不要批量升级或强制替换宿主内部协议包。界面依赖宿主时，明确宿主要求，不把独立 HTML 预览当作真实安装成功。\n\n## 4. 运行与实现\n\nNode.js >=20；执行 npm ci，然后 npm run verify:release。优先原样构建；确需适配环境时只做最小变更，逐项记录原因、差异和回滚步骤。\n\n安装按仓库说明和已有安装脚本执行；先备份已有插件与配置，保留用户数据。涉及退出或重启宿主时先提醒用户保存并取得确认。\n\n## 5. 保护数据\n\n演示仅使用合成数据；原始业务资料只读，输出另存，禁止写入仓库、日志或公开页面。不得自动付款、入账、纳税申报或替用户作重大专业判断；这些操作必须人工复核确认。\n\n## 6. 验收\n\n逐项运行测试与安全扫描，核对 manifest.json 的路径和 SHA-256。实际打开宿主页面，检查桌面和 390px 窄屏、主题切换、资料与任务交互、全部工作流提示词复制；确认浏览器无目标功能控制台错误。\n\n实际触发至少一次工作流，确认发送到 AI 的正文与组合器结果一致。无宿主时记录为待验收，不声称端到端成功。\n\n交付可运行源码、构建产物、中文安装/使用指南、测试结果、实际截图、已知限制、恢复方式；列明任何与基准的差异。\n\n## 7. 精确复刻的边界\n\n同一份源码和锁文件是复刻基准；单靠自然语言无法保证任何 AI 都生成像素级相同界面。应保留源码而非让 AI 自由重写；宿主版本、系统字体和窗口尺寸可能影响最终显示。","context":"# 源码上下文包\n\n按相对路径恢复 UTF-8 文件；manifest.json 用于完整性核对。此包含构建、源码、脚本和测试，不含依赖目录、运行资料或凭据。\n\n## .codebuddy-plugin/plugin.json\n\nSHA-256: cbc150c9cb80f9bc04c388488fe258b8a78fc37ad54cd796daa0f5d9713a380e\n\n~~~~~~text\n{\n  \"name\": \"workbuddy-finance-workbench\",\n  \"version\": \"2.7.1\",\n  \"description\": \"ZY 财务工作台：zy6666688 个人维护版：20 个模块、异常责任闭环、月结控制、本机备份和 25 个 AI 工作流。\",\n  \"author\": {\n    \"name\": \"zy6666688\"\n  },\n  \"homepage\": \"https://github.com/zy6666688/workbuddy-finance-workbench\",\n  \"repository\": \"https://github.com/zy6666688/workbuddy-finance-workbench\",\n  \"license\": \"MIT\",\n  \"keywords\": [\n    \"workbuddy\",\n    \"finance\",\n    \"accounting\",\n    \"mcp-app\",\n    \"workflow\"\n  ],\n  \"category\": \"productivity\",\n  \"skills\": [\n    \"./agents/finance-workbench\"\n  ],\n  \"mcpServers\": \"./.mcp.json\"\n}\n\n~~~~~~\n\n## .github/ISSUE_TEMPLATE/bug_report.yml\n\nSHA-256: 21c36678a668db58b9c382b4d320f0913e97b4038b1d79b6e8d4d46b8ee95bf2\n\n~~~~~~text\nname: 问题反馈\r\ndescription: 报告可以复现的问题，请勿上传真实财务资料或密钥\r\ntitle: \"[Bug] \"\r\nlabels: [bug]\r\nbody:\r\n  - type: markdown\r\n    attributes:\r\n      value: 请先确认示例中不含真实公司、客户、个人、Token 或 API Key。\r\n  - type: dropdown\r\n    id: environment\r\n    attributes:\r\n      label: 使用环境\r\n      options:\r\n        - DeepSeek Harness 图形工作台\r\n        - WorkBuddy Skill\r\n        - Codex Skill\r\n        - Claude Skill\r\n        - 其他 Agent\r\n    validations:\r\n      required: true\r\n  - type: textarea\r\n    id: steps\r\n    attributes:\r\n      label: 复现步骤\r\n      placeholder: 请使用虚构文件名和虚构数据描述\r\n    validations:\r\n      required: true\r\n  - type: textarea\r\n    id: expected\r\n    attributes:\r\n      label: 预期结果与实际结果\r\n    validations:\r\n      required: true\r\n  - type: input\r\n    id: version\r\n    attributes:\r\n      label: 版本\r\n      placeholder: v2.0.0\r\n    validations:\r\n      required: true\r\n\n~~~~~~\n\n## .github/ISSUE_TEMPLATE/feature_request.yml\n\nSHA-256: 7801c261b73af4731a2ea6ab212332bdc2ebdafc8ab885ece9b57910d57eb8ad\n\n~~~~~~text\nname: 功能建议\r\ndescription: 建议新的财务场景或体验改进\r\ntitle: \"[Feature] \"\r\nlabels: [enhancement]\r\nbody:\r\n  - type: textarea\r\n    id: problem\r\n    attributes:\r\n      label: 要解决的问题\r\n    validations:\r\n      required: true\r\n  - type: textarea\r\n    id: workflow\r\n    attributes:\r\n      label: 建议的输入、规则、输出和人工复核点\r\n    validations:\r\n      required: true\r\n\n~~~~~~\n\n## .github/workflows/ci.yml\n\nSHA-256: d3f6358fc1716dfe4c8cce3a9a14b20c32fa6e6b814bb56cda7791f67e42d39f\n\n~~~~~~text\nname: CI\r\n\r\non:\r\n  push:\r\n  pull_request:\r\n\r\npermissions:\r\n  contents: read\r\n\r\njobs:\r\n  verify:\r\n    runs-on: ubuntu-latest\r\n    strategy:\r\n      fail-fast: false\r\n      matrix:\r\n        node: [20, 22, 24]\r\n    steps:\r\n      - uses: actions/checkout@v7.0.1\r\n      - uses: actions/setup-node@v7.1.0\r\n        with:\r\n          node-version: ${{ matrix.node }}\r\n          cache: npm\r\n      - run: npm ci\r\n      - run: npm run verify:release\r\n      - run: npm run audit:deps\r\n\r\n  windows:\r\n    runs-on: windows-latest\r\n    steps:\r\n      - uses: actions/checkout@v7.0.1\r\n      - uses: actions/setup-node@v7.1.0\r\n        with:\r\n          node-version: 24\r\n          cache: npm\r\n      - run: npm ci\r\n      - run: npm run check\r\n      - run: npm run audit:deps\r\n\n~~~~~~\n\n## .github/workflows/team.yml\n\nSHA-256: ba11f7bea963fad6ee39c32413607d3c074dc1e533ef15591879a2f97f786ead\n\n~~~~~~text\nname: Team workbench\non: [push, pull_request]\npermissions:\n  contents: read\njobs:\n  acceptance:\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    defaults:\n      run:\n        working-directory: team\n    steps:\n      - uses: actions/checkout@v7.0.1\n      - uses: actions/setup-node@v7.1.0\n        with:\n          node-version: 24\n          cache: npm\n          cache-dependency-path: team/package-lock.json\n      - run: npm ci\n      - run: npm run typecheck && npm test && npm run build && npm audit --omit=dev\n      - run: node ops/setup.mjs\n      - run: docker compose build\n      - run: docker compose -p zy-finance-test -f compose.yaml -f compose.test.yaml up -d db migrate app worker gateway\n      - run: docker compose -p zy-finance-test -f compose.yaml -f compose.test.yaml run --rm acceptance\n      - run: docker compose -p zy-finance-test -f compose.yaml -f compose.test.yaml run --rm acceptance node test/collection-lifecycle.mjs\n      - run: node ops/test-worker.mjs\n      - run: node ops/test-recovery.mjs\n\n~~~~~~\n\n## .gitignore\n\nSHA-256: afe72bf33f41ad5979aad4274502e3c6d08b7ef0dc4811d9c674383f5ae249ca\n\n~~~~~~text\nnode_modules/\r\n.DS_Store\r\n.playwright-cli/\r\noutput/\r\nrelease/\r\nrelease.backup-*/\r\n*.log\r\n*.tmp\r\n*.bak\r\n.env\r\n.env.*\r\n!.env.example\r\n\n~~~~~~\n\n## .mcp.json\n\nSHA-256: ed9c036e150c9b7e2f0590f2e46d42f9f6b308019436eecd7c560c0dc43ba2c6\n\n~~~~~~text\n{\r\n  \"mcpServers\": {\r\n    \"finance-workbench\": {\r\n      \"command\": \"node\",\r\n      \"args\": [\r\n        \"${CODEBUDDY_PLUGIN_ROOT}/workbuddy/server.mjs\"\r\n      ]\r\n    }\r\n  }\r\n}\r\n\n~~~~~~\n\n## AGENTS.md\n\nSHA-256: b10cdfa1766fc373b6e9eb8becab067a7ce2d5066b679af84a54efe569e3d0fe\n\n~~~~~~text\n# AI Agent 开发说明\r\n\r\n本仓库同时提供 WorkBuddy MCP App、DeepSeek Harness UI 插件和通用财务 Agent Skill。\r\n\r\n## 修改原则\r\n\r\n- 不得降低付款、入账、纳税申报和重大判断的人工复核要求。\r\n- 不得把真实财务数据、凭据、本机路径或个人身份信息写入仓库。\r\n- `src/finance-data.js` 是工作流主数据源；修改后运行 `npm run catalog`。\r\n- 安装脚本必须先备份已有目标，不得静默覆盖或删除用户资料。\r\n- 保留资料库的上传、搜索、筛选、引用、下载和置顶能力。\r\n\r\n## 完成前检查\r\n\r\n```bash\r\nnpm ci\r\nnpm run verify:release\r\n```\r\n\r\n若修改界面，还要在桌面和 390px 窄屏下进行真实浏览器验证，并确认控制台没有目标功能错误。\r\n\n~~~~~~\n\n## CHANGELOG.md\n\nSHA-256: f8ac54401f0bc0ae14752cb2539b3e2b1e6a842e8c633d04b12279d58425d55e\n\n~~~~~~text\n# 2.7.1 · ZY 个人维护版（2026-10-26）\r\n\r\n- 工作台显示名称调整为 ZY 财务工作台；仓库、下载与安装入口指向 zy6666688 的分支。\r\n- 删除 README 底部微信推广与二维码图片，保留 MIT 许可与上游署名。\r\n- 新增中文使用说明书和测试报告。\r\n- 修复 WorkBuddy 构建漏打包任务填写区和工作流筛选样式的问题，使窄屏表单正常单列显示。\r\n- 更新锁文件中的兼容依赖，修复依赖审计发现的问题。\r\n\r\n# 更新记录\r\n\r\n## 2.7.0 - 2026-10-08\r\n\r\n- 修复依赖更新后复刻清单过期导致的 CI 失败；构建后自动生成源码上下文与校验清单。\r\n- 更新 MCP SDK、Zod 和相关传递依赖；官方 npm 审计报告 0 个漏洞项。\r\n- 上传与工作流写入拒绝符号链接目录，校验分块编码、偏移、工作区归属和下载参数；保留同名并发上传保护。\r\n- 备份增加资料置顶与最近工作流；逐项检查日期、金额、标识、日志和异常关闭证据，兼容旧 v2 备份。\r\n- 恢复前保留完整副本，存储写入失败时回滚；新增“下载恢复前副本”和本机保存失败提示。\r\n- 修复金额显示舍去分位和浮点合计误差；CSV 导出防止文本被解释为公式。\r\n- Shell / PowerShell 共用安装逻辑，先校验、暂存再切换，失败恢复旧目录；保留其他 MCP 配置及原财务环境设置。\r\n- 修复 WorkBuddy 指令发送或复制失败时的提示，明确文件索引与附件的关系。\r\n- 版本号统一来自 package.json；补齐 npm 包的卸载脚本、安装辅助文件与指南。\r\n- 新增 `npm run preview`；CI 覆盖 Node.js 20 / 22 / 24 与 Windows PowerShell。\r\n\r\n## 2.6.0 - 2026-09-09\r\n\r\n- 同步本地工作台源码，补充任务要求填写、最近使用和收藏筛选。\r\n- 增加 25 套工作流的离线复制页面、源码上下文包和 SHA-256 清单。\r\n\r\n## 2.5.0 - 2026-08-24\r\n\r\n- 25 个工作流统一编号为 01–25，保留 23–25 的高级场景属性。\r\n- 新增 25 份独立 Markdown 提示词和索引，可从 GitHub 直接查看、复制和二次使用。\r\n- 工作流详情新增新手三步开始、最少资料、一句话发起、完整提示词预览和一键复制。\r\n- 提示词新增可留空的“新手填写区”，缺失资料合并成一次询问，并用财务人员熟悉的语言说明。\r\n- 补充提示词完整性、编号、MCP 能力与公开发布文件测试。\r\n\r\n## 2.4.0 - 2026-08-22\r\n\r\n- 新增 WorkBuddy 原生 MCP App：可在对话中打开完整交互式财务工作台，不再只提供 Skill。\r\n- 新增 macOS 双击安装、Shell/PowerShell 安装和可恢复卸载；安装前备份旧应用、Skill 与 MCP 配置。\r\n- WorkBuddy Widget 完全本地打包并压缩到 256 KB 预取限制内，不依赖 CDN。\r\n- 新增 MCP 协议级自动化测试，校验工具发现、UI 资源读取、Widget MIME、模块数与工作流数。\r\n- 重做 README：明确三种运行方式，提供横向实机截图、首屏安装入口、能力差异与新手操作说明。\r\n- 修正“WorkBuddy 支持”表述：区分完整 MCP App、DeepSeek Harness 原生插件和通用 Agent Skill。\r\n\r\n## 2.3.0 - 2026-08-22\r\n\r\n- 新增异常控制台，统一管理风险等级、金额影响、责任人、截止日、来源依据和处置证据。\r\n- 新增可解释风险评分、高关注与逾期汇总、CSV 导出和一键转待办；没有处置证据的异常不能关闭。\r\n- 为 15 个业务模块补充财务复核断言，覆盖发生、完整性、存在、准确性、截止、计价、权利义务等关键关注点。\r\n- 首页升级为 4 段“今日财务节奏”，优先显示异常、待办、月结证据和经营数据完整度。\r\n- 整体放大导航、正文、表单、按钮和关键数字，并复核 390px 手机与桌面布局，减少长期使用的视觉负担。\r\n- 异常台账纳入本机 JSON 备份、恢复和审计留痕；自动化测试增至 27 项。\r\n\r\n## 2.2.0 - 2026-08-22\r\n\r\n- 重构为现代雾光工作台视觉：半透明侧栏、聚焦型首页、克制阴影与更清晰的信息层级。\r\n- 新增雾光靛蓝、松石墨绿、暖砂棕金、夜航深色 4 套主题，支持顶部快速切换、本机持久化和备份恢复。\r\n- 首页新增“今日财务节奏”，集中提示高优先级待办、月结证据进度和经营数据完整度。\r\n- 为 15 个业务模块补充责任岗位、建议频率和新手起步指引，并修正应收、应付模块待办分类口径。\r\n- 完成桌面、手机、4 套主题、15 个模块和浏览器控制台回归；更新全部脱敏图文资料与发布包。\r\n\r\n## 2.1.0 - 2026-08-22\r\n\r\n- 按真实财务岗位扩展为 19 个模块，并按“经营与往来、核算与合规、报告与决策、治理与系统”分组。\r\n- 新增经营快照、利润自动计算、近 6 期收支趋势和可点击财务全流程。\r\n- 为 15 个业务模块补充标准处理链路、关键控制、固定交付物、模块待办和推荐 AI 工作流。\r\n- 新增本机审计日志，记录待办、月结、收藏、工作流、资料置顶、备份与字段规则变更。\r\n- 独立数据备份页面，并将经营快照和审计日志纳入向后兼容的 v2 JSON 备份。\r\n- 重构分组侧栏与顶部快捷入口，完善桌面、窄窗口和手机布局。\r\n- 更新脱敏图文说明、发布材料和自动化测试；保留原资料库与 25 个 AI 工作流。\r\n\r\n## 2.0.0 - 2026-08-21\r\n\r\n- 重构为专业财务控制工作台，提供 11 个功能模块。\r\n- 落地 22 个标准场景和 3 个专业扩展场景。\r\n- 新增月结证据清单、字段字典、业务阈值和本机 JSON 备份。\r\n- 保留资料上传、搜索、筛选、引用、下载和置顶能力。\r\n- 新增响应式桌面/手机布局。\r\n- 新增 WorkBuddy、Codex、Claude Code 和通用 Agent Skill。\r\n- 新增一键安装、可恢复卸载、CI、脱敏扫描和发布验证。\r\n\r\n## 1.2.1\r\n\r\n- 初始财务工作台，包含 8 个核心场景和资料库能力。\r\n\n~~~~~~\n\n## CONTRIBUTING.md\n\nSHA-256: 7b5894eb59b918d252d691eefa7a735bc334d3e47c465778071865a17c3a954a\n\n~~~~~~text\n# 参与贡献\r\n\r\n欢迎提交财务场景、界面、测试和文档改进。\r\n\r\n1. Fork 仓库并新建分支。\r\n2. 只使用虚构、脱敏的示例数据。\r\n3. 修改工作流后运行 `npm run catalog` 同步 Agent 目录。\r\n4. 运行 `npm run verify:release`。\r\n5. 在 Pull Request 中说明适用岗位、输入、规则、输出和人工复核点。\r\n\r\n新增工作流至少需要 4 条规则、7 个步骤、2 个交付物和 4 项验收检查。请勿提交真实客户、单位或个人数据。\r\n\n~~~~~~\n\n## HANDOVER.md\n\nSHA-256: a32d612eadc7a0a8c31bbd7f8a036fdfad99306dbb3ad39cd6d16738d44df648\n\n~~~~~~text\n# 无测试，仅接手：附件分页与 WorkBuddy 成果归属\n\n本分支保存当前开发状态，供后续人员接手。最初上传时未重新运行测试；后续已补充侧边栏及一条团队版浏览器交付流程的专项验收，但尚未完成全部发布验收，也没有更新正式环境。\n\n后续补充：侧边栏图标更新已完成独立浏览器检查，具体范围见下文；这不改变本分支其他功能仍需验收的状态。\n\n## 本次改动目的\n\n原有资料列表在附件较多时存在截断和跨页操作不便的问题；多个 WorkBuddy 任务并行时，也需要明确每份成果属于哪个任务、哪个版本，避免同名文件混用或沿用旧审批。本分支同时处理服务端、数据库、团队页面及个人版资料库，保留原有工作流和个人版本地数据能力。\n\n## 一、附件资料库与分页\n\n- 团队版公司资料库和月度工作单新增统一的服务端分页查询，默认每页 50 份，最多 100 份。搜索、统计、类型与类别筛选、排序针对授权范围内的完整文件集合，而不是只对当前页生效。\n- 支持按文件名或类别搜索，筛选业务用途、文件类型、类别、最新版本和置顶状态，以及按时间、名称或大小排序；排序使用文件编号保证相同条件下顺序稳定。搜索中的 `%`、`_` 按普通文字处理。\n- 置顶按个人账号保存，先在完整结果中排序再分页；附件或置顶发生变化后，旧分页请求会提示刷新，避免继续翻页时遗漏或重复。\n- 任务输入、成果回传、人工成果送审及交付证据等选择器改为按文件编号记录选择，可跨页保留、逐项移除或清空，单次最多 100 份。切换公司、期间或工作单时清空旧选择。\n- 文件详情按编号重新核对权限和版本；已选文件不会因翻页被替换成同名新版本。工作流资料建议从完整授权范围查找，不局限于第一页。\n- 工作单提供轻量详情读取，新页面不再依赖一次加载全部附件；旧文件数组接口暂时保留兼容。\n- 原个人版继续使用本地文件和本机数据，资料库由原先截断列表改为本地分页；列表上方和下方均可翻页、输入页码跳转，保留原版布局、主题及上传、搜索、引用、下载和置顶入口。\n\n## 二、WorkBuddy 任务与成果\n\n- 一项任务可以有多份成果；每个成果文件版本只能归属一个任务，任务成果在对应任务中上传时确定归属，不能在回传时冒充其他任务的成果。\n- 人工成果单独标记，由经办人员明确选择送审；人工文件不会自动冒充 WorkBuddy 回传，未选择的内部草稿也不会自动进入交付。\n- 两个并行任务可以各自上传同名成果，版本按工作单、用途、来源和任务分别判断，任务 B 上传成果不会使任务 A 的回传失效。\n- 拆分输入变更与交付变更：原始输入变化会使相关任务失效，处理时需要修订或取消；普通成果上传不会让其他并行任务的输入失效。\n- 已回传任务不能直接覆盖原回执。需要更正时可填写原因创建修订任务，保留旧执行和成果；也可填写原因取消任务，取消记录保留且不能继续回传。\n- 任务包继续采用下载后由员工交给 WorkBuddy 处理，再上传成果、读取或粘贴回传清单的显式交接方式。下载任务包或复制提示词不代表处理完成，也没有新增自动回调。\n\n## 三、送审、交付与历史记录\n\n- 送审前检查任务是否已回传或明确取消、成果是否有效、历史归属是否解决、校验说明及复核人员资格；人工成果必须显式勾选。\n- 送审和交付包使用固定文件版本及来源快照，不受当前列表分页影响。成果集合变化会使原审批失效，需要重新送审和独立复核。\n- 已归档批次、原审批和交付记录保留；退回或归档重开后按新交付轮次处理，并保留旧记录。\n- 历史未归档成果只有在旧记录明确且唯一引用文件时才自动建立归属；无法确定的文件进入待确认清单，由负责人或经办填写理由，选择任务归属、人工成果或排除送审，不按文件名或时间猜测。\n- 已归档历史不因本次迁移重新编排。未归档历史如果需要变更成果集合或解决归属冲突，可能需要重新送审。\n\n## 四、接口、数据库与权限\n\n- 新增公司和工作单文件分页入口、按编号解析已选文件入口，以及完整资料范围内的工作流输入建议。分页版本变化时会要求重新刷新。\n- 新增任务专属成果上传、任务修订和取消、历史成果归属确认等接口；服务端验证账号、公司、工作单、任务和文件之间的归属关系。\n- 新增数据库迁移 `team/migrations/010_result_ownership.sql` 和 `011_file_paging.sql`，分别用于成果归属与任务版本关系、附件查询索引。升级前应备份数据库和私有附件，避免直接降级数据库作为默认回滚方式。\n- 保留个人版与团队版的不同数据边界：个人版本地运行；团队版业务数据以服务端为准，按授权公司和期间访问。\n\n## 侧边栏图标更新\n\n- 个人版及团队入口统一使用线条图标，按各功能入口区分图形；保留侧边栏原有宽度、分组和导航功能。\n- 选中、悬停及键盘焦点状态使用现有主题色；图标作为装饰元素隐藏于辅助技术，按钮保留文字名称和当前页面标记。\n- 在独立 Docker 测试环境启动完整团队版，使用虚构账号检查桌面、四套主题和 390 像素页面。月度交付、客户公司、审核中心、资料导入、后台任务、账号设置、团队成员、运行与备份及预算管理的导航跳转与当前页面标记正确；窄屏菜单打开和选择后关闭正常，页面宽度无横向溢出。\n- 原版构建及 `verify:release` 检查通过。侧边栏验收时，完整团队版浏览器控制台记录了登录前会话检查返回 401 和 favicon 请求返回 404，未观察到侧边栏功能错误。附件上传与回传已在后续专项流程中另行检查，见下文。\n\n## 五、接手状态与验收边界\n\n- 本次上传未重新运行测试，也未部署正式环境。此前团队版、原版、容量、接口和恢复检查曾产生测试结果，详见 [附件分页与成果归属验收记录](team/docs/ATTACHMENT-OWNERSHIP-ACCEPTANCE.md)；该文档部分状态是当时记录，接手时应重新核实。\n- 已在独立 Docker 测试环境使用虚构客户，通过浏览器完成建档、分工、批量上传、关联资料、下载任务包、上传并回传两份成果、独立复核、下载交付包、登记交付证据及归档；刷新后确认归档状态。任务包输入与交付包成果的摘要与原文件一致。WorkBuddy 外部处理使用虚构成果模拟，未验证实际 AI 输出质量。\n- 本次浏览器演练覆盖一家公司、一个月和一个任务，不代表并行任务、退回重开、浏览器重试、权限隔离或大批量文件场景均已在浏览器通过；这些场景仍需按发布验收要求补充。\n- 接手后建议先核对数据库迁移和备份恢复，再用虚构客户及两个独立员工账号，完整检查跨页选文件、两个并行任务、成果回传、退回修订、独立复核、交付、归档及重开。\n- 还需在目标环境检查权限撤销、历史归属、分页变化、重复提交和多用户并发；完成浏览器、自动化、恢复与持续集成验收后，再考虑更新正式部署。\n\n操作步骤见 [团队版操作手册](team/docs/USER_GUIDE.md) 和 [资料收集与 WorkBuddy 交接](team/docs/COLLECTION_WORKBUDDY_TEAM.md)。\r\n\n~~~~~~\n\n## LICENSE\n\nSHA-256: 109706a22980f1411c87fa4bc5a3b76830b42facd7ed0058f9116dce95f33026\n\n~~~~~~text\nMIT License\r\n\r\nCopyright (c) 2026 WorkBuddy Finance Workbench contributors\r\n\r\nPermission is hereby granted, free of charge, to any person obtaining a copy\r\nof this software and associated documentation files (the \"Software\"), to deal\r\nin the Software without restriction, including without limitation the rights\r\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\r\ncopies of the Software, and to permit persons to whom the Software is\r\nfurnished to do so, subject to the following conditions:\r\n\r\nThe above copyright notice and this permission notice shall be included in all\r\ncopies or sub 工作模块、25 个统一编号的 AI 工作流、25 份可查看与复制的完整提示词、异常责任闭环、月结证据控制、经营快照、资料索引和本机备份。\n\n## 先选对安装方式\n\n| 使用环境 | 得到什么 | 推荐入口 |\n|---|---|---|\n| **WorkBuddy** | 完整图形工作台 + 25 个工作流 + Skill | [一键安装完整应用](docs/INSTALL_WORKBUDDY.md) |\n| **DeepSeek Harness** | 左侧导航中的原生完整工作台 | [安装 DSH 插件](docs/INSTALL_DSH.md) |\n| **Codex / Claude Code / 其他 Agent** | 财务规则、工作流与验收清单；不含图形界面 | [安装通用 Skill](docs/INSTALL_AGENT.md) |\n\n> 三种方式共用同一套财务口径和工作流。图形界面的承载方式不同：WorkBuddy 使用 MCP App Widget，DeepSeek Harness 使用原生 UI 插件，其他 Agent 使用 Markdown/JSON Skill。\n\n## 下载安装\n\n### macOS：WorkBuddy 完整版\n\n1. 下载 [个人版源码 ZIP](https://github.com/zy6666688/workbuddy-finance-workbench/archive/refs/heads/main.zip)。\n2. 解压并进入 `workbuddy-finance-workbench-main` 文件夹，双击 **`安装 WorkBuddy 财务工作台.command`**。\n3. 保存 WorkBuddy 中正在编辑的内容，完全退出后重新打开。\n4. 在 WorkBuddy 输入：**`打开财务工作台`**。\n\n安装器会先备份已有 Skill 与 `.mcp.json`，只新增 `finance-workbench` 配置项；不会读取财务文件、API Key，也不会强制重启 WorkBuddy。首次安装前需要 [Node.js 20+](https://nodejs.org/zh-cn/download)。\n\n### Windows：WorkBuddy 完整版\n\n下载 [个人版源码 ZIP](https://github.com/zy6666688/workbuddy-finance-workbench/archive/refs/heads/main.zip)，解压后进入 `workbuddy-finance-workbench-main` 文件夹，在该目录中打开 PowerShell：\n\n```powershell\npowershell -ExecutionPolicy Bypass -File .\\scripts\\install-workbuddy-app.ps1\n```\n\n### 从源码安装\n\n```bash\ngit clone https://github.com/zy6666688/workbuddy-finance-workbench.git\ncd workbuddy-finance-workbench\n./scripts/install-workbuddy-app.sh\n```\n\n完整安装、更新、卸载和排障步骤见 [WorkBuddy 新手安装指南](docs/INSTALL_WORKBUDDY.md)。\n\n## 25 份可直接复制的提示词\n\n25 个工作流已统一编号为 01–25，每个都有独立提示词，不需要先学习“提示词工程”：\n\n- 在 WorkBuddy / DeepSeek Harness 工作台中：打开“工作流”，选择场景，可查看或复制完整提示词。\n- 在 Codex、Claude Code 或其他 AI 工具中：打开 [25 份提示词目录](agents/finance-workbench/references/prompts/README.md)，复制对应文件的全部内容。\n- 不清楚主体、期间或口径时可留空；AI 会先识别现有文件，再一次列出真正必需的缺项。\n\n每份提示词都包含：新手填写区、所需资料、字段与口径预览、小样本试跑、异常边界、固定输出、金额/行数校验、人工复核和完成回报。\n\n## 不是一张看板，而是一套财务闭环\n\n| 工作层级 | 模块 | 解决的问题 |\n|---|---|---|\n| 经营与往来 | 收入、应收、应付、报销、资金、预算 | 业务确认、账龄、付款排期、13 周资金预测与预算偏差 |\n| 核算与合规 | 资产、税务、发票、工资、对账、成本 | 台账勾稽、期间截止、重复识别、证据链与分摊复核 |\n| 报告与决策 | 报表、分析、投资 | 报表勾稽、差异归因、管理摘要、情景测算与投后跟踪 |\n| 治理与系统 | 异常、审计、备份、设置 | 责任到人、期限跟踪、处置证据、本机留痕与口径治理 |\n\n每个业务模块都给出责任岗位、建议频率、第一步、关键控制、固定交付物和推荐工作流。每个 AI 工作流都包含输入、字段口径、处理规则、7 步执行路径、交付成果、验收清单和人工复核点。\n\n\u003ctable>\n  \u003ctr>\n    \u003ctd width=\"50%\">\u003cimg src=\"docs/images/exception-control.png\" alt=\"异常控制台\">\u003cbr>\u003csub>\u003cb>异常控制台\u003c/b>：风险、金额、责任人、期限、来源与处置证据\u003c/sub>\u003c/td>\n    \u003ctd width=\"50%\">\u003cimg src=\"docs/images/theme-night.png\" alt=\"深色主题\">\u003cbr>\u003csub>\u003cb>4 套专业主题\u003c/b>：雾光靛蓝、松石墨绿、暖砂棕金、夜航深色\u003c/sub>\u003c/td>\n  \u003c/tr>\n\u003c/table>\n\n### 财务控制不是“发现异常”就结束\n\n异常控制台会按风险等级、金额影响和逾期状态排序。没有处置证据的事项不能关闭；任何异常都可以转成待办或导出 CSV。经营快照、待办、月结、异常、收藏、资料置顶、最近工作流、字段字典和审计日志可以整体导出为 JSON 备份。恢复时逐项校验，自动保留恢复前副本；本机保存失败时显示备份提示。\n\n### 新手第一次使用\n\n1. 在“系统设置”选择主题，填写主体、期间和重要性阈值。\n2. 在“财务总览”录入本期汇总数，先看经营快照与今日节奏。\n3. 用仓库中的[虚构演示数据](examples/demo/README.md)打开一个工作流试跑。\n4. 先确认字段映射、口径、异常规则和预期输出，再处理 20–50 行样本。\n5. 人工复核后再处理全量；取得底稿、凭证号或业务确认后关闭异常。\n\n## WorkBuddy 完整版如何工作\n\n安装包同时部署两部分：\n\n- `MCP App`：在 WorkBuddy 对话中打开全屏交互工作台；工作流按钮会把结构化任务填入输入框，发送前由你核对附件。\n- `finance-workbench Skill`：为 WorkBuddy 提供财务规则、执行边界和 25 个标准场景。\n\nWidget 资源完全本地打包，不依赖 CDN。MCP App 采用 WorkBuddy 官方的 `text/html;profile=mcp-app` 资源协议；终端型客户端会自然降级为文字结果。\n\n## 数据与专业边界\n\n- 仓库只包含虚构演示数据，不包含真实发票、流水、身份信息、密码、Cookie、Token 或 API Key。\n- 经营快照、待办、异常、字段字典和设置默认保存在当前应用的浏览器本机存储中。\n- Widget 中选择文件只建立当前会话索引；执行工作流前仍需在 WorkBuddy 输入框确认并添加原始附件。\n- JSON 备份不包含原始财务文件；更新与卸载脚本保留带时间戳的配置副本。\n- AI/OCR 结果不能直接替代入账、付款、纳税申报、薪资发放或重大专业判断的人工复核。\n\n详见 [安全政策](SECURITY.md)。\n\n## 项目结构\n\n```text\nworkbuddy/                  已构建的 WorkBuddy MCP App\nagents/finance-workbench/   通用财务 Agent Skill\nsrc/                        WorkBuddy / DSH 共用界面与业务源码\nscripts/                    安装、卸载、构建、脱敏与发布验证\ndocs/                       图文安装、排障与版本说明\nexamples/demo/              完全虚构的练习数据\ntest/                       单元、协议与发布完整性测试\n```\n\n## 开发与验证\n\n要求 Node.js 20+：\n\n```bash\nnpm ci\nnpm run verify:release\nnpm run audit:deps\n```\n\n仅查看界面可执行 `npm run preview`，然后打开 [本机预览](http://127.0.0.1:4173)。预览可管理本机台账、备份与提示词；运行 AI 工作流需将指令粘贴到 AI 对话并添加附件。\n\n发布校验覆盖：20 个导航模块、25 个工作流、异常关闭门槛、目录穿越防护、备份格式、WorkBuddy MCP 协议、256 KB Widget 上限、隔离目录安装/卸载、公开文件脱敏扫描、生产构建和 npm 发布清单。\n\n## 文档\n\n- [ZY 财务工作台使用说明书（从安装到第一次预算分析）](docs/USER_GUIDE.md)\n- [个人版 2.7.1 测试报告](docs/TEST_REPORT_2.7.1.md)\n\n- [WorkBuddy 完整应用安装](docs/INSTALL_WORKBUDDY.md)\n- [DeepSeek Harness 完整界面安装](docs/INSTALL_DSH.md)\n- [Codex / Claude / 通用 Agent Skill](docs/INSTALL_AGENT.md)\n- [常见问题与排障](docs/TROUBLESHOOTING.md)\n- [更新记录](CHANGELOG.md)\n- [参与贡献](CONTRIBUTING.md)\n\n## 开源许可\n\n代码采用 [MIT License](LICENSE)。欢迎提交 Issue 和 Pull Request；财务处理结果请由具备权限和专业判断能力的人员复核。\n\n## 维护与来源\n\n本分支由 [zy6666688](https://github.com/zy6666688) 维护，基于 [feng-liu-1994/workbuddy-finance-workbench](https://github.com/feng-liu-1994/workbuddy-finance-workbench) 二次修改。保留 MIT 许可证及原项目贡献者版权。个人版主要调整品牌、文档和依赖；原始功能设计与历史更新记录保留。\n\n~~~~~~\n\n## SECURITY.md\n\nSHA-256: 46be567b1dec7a66730dcb0b7504ebc71748b53d514b4fd23f333647b6dce5d3\n\n~~~~~~text\n# 安全政策\r\n\r\n## 不要提交的内容\r\n\r\n- 真实银行流水、发票、工资、合同、客户或供应商资料。\r\n- 姓名、身份证号、手机号、银行卡号、税号和家庭信息。\r\n- API Key、Token、Cookie、Session、密码、私钥和 `.env` 文件。\r\n- 含真实会话列表、用户名、本机目录或业务数据的截图。\r\n\r\n## 使用边界\r\n\r\n本项目用于整理、核对、汇总、异常提示和初稿生成，不替代会计、税务、审计或法律专业判断。付款、入账、申报、会计政策和重大估计必须由有权限的人员确认。\r\n\r\n处理真实资料前请先备份，优先使用副本和脱敏样本。不要把敏感资料上传到未经组织授权的模型或第三方服务。\r\n\r\n## 报告安全问题\r\n\r\n请通过 GitHub 仓库的 Security 页面私下报告，不要在公开 Issue 中粘贴密钥或真实财务数据。\r\n\n~~~~~~\n\n## agents/finance-workbench/SKILL.md\n\nSHA-256: be4afb7a3c3bd72cde025d1ef6a835f4245f8abbe47b1453d1f84e9f7e35cd87\n\n~~~~~~text\n---\r\nname: finance-workbench\r\ndescription: 面向财务人员的受控自动化工作流。用于收入、应收应付、报销、资金预算、资产、税务发票、工资、对账、成本、报表分析、投资、月结、审计与财务归档；要求字段口径、异常清单、结果校验、人工复核和处理留痕。\r\nlicense: MIT\r\nmetadata:\r\n  version: \"2.7.1\"\r\n  repository: \"https://github.com/zy6666688/workbuddy-finance-workbench\"\r\n---\r\n\r\n# Finance Workbench Skill\r\n\r\n## 何时使用\r\n\r\n用户要求处理财务表格、票据、对账、往来、资金、预算、经营分析、月结检查或财务归档时使用。仅讨论一般财务知识、且不涉及文件或流程执行时，可以直接回答。\r\n\r\n## 开始前必须完成\r\n\r\n1. 阅读 `references/safety.md`。\r\n2. 从 `references/workflows.json` 选择最匹配的工作流；不确定时先列出 2–3 个候选及差异。\r\n3. 明确主体、期间、币种、单位、数据版本和输出目录。\r\n4. 盘点输入文件，不修改原件。\r\n\r\n## 标准执行闭环\r\n\r\n1. **选场景**：范围缩小到一张表、一次核对或一个固定输出。\r\n2. **备样本**：保留正常、缺失、重复、异常和特殊业务样本。\r\n3. **定字段**：写清主键、字段类型、单位、口径、来源和必填项。\r\n4. **写规则**：把经验改成可判断的条件，并区分确定、疑似和无法判断。\r\n5. **先方案**：先给字段映射、公式、异常边界、拟输出和保存位置。\r\n6. **小样本**：先跑 20–50 行，与人工结果逐条核对。\r\n7. **补边界**：记录误判、漏项、权限限制和复杂关系。\r\n8. **固化 SOP**：固定目录、命名、复核人、频率和日志。\r\n\r\n## 执行要求\r\n\r\n- 优先读取用户明确引用的文件，再读取任务目录内相关资料。\r\n- 金额精确到分；日期统一为 `YYYY-MM-DD`；百分比保留两位小数。\r\n- 每条结果保留源文件、工作表和原始行号，无法追溯时说明原因。\r\n- 只处理副本；输出到单独目录；不覆盖、移动或删除原件。\r\n- 疑似匹配只能列为候选，不得强行核销。\r\n- 输出主结果、异常明细、行数/金额校验、处理日志和未完成项。\r\n- 资料不足时集中询问一次必需缺项，不要反复零散追问。\r\n\r\n## 团队版一句话任务\r\n\r\n用户说“处理某客户某月资料，并告诉我进度”时，通过团队 MCP 完成下列步骤，不让用户手工拼接工具参数：\r\n\r\n1. 查询当前身份、客户、期间、工作单、标准工作流和输入附件。遇到同名客户、缺期间或目的不明时集中澄清；只选择用户任务范围内的最新资料。工作单必须已进入经办处理阶段。\r\n2. 先用 `team_workflow` 读取 `recommendedExecutionMode`、`inputContract`、`scope` 和 `manual`。25 个目录工作流均有程序内入口，但只有明确的机械规则和草稿准备已封装；不得把合同解释、制度适用判断或调度启用说成自动完成。\r\n3. 两项账务计算沿用 `team_accounting_template`；其余工作流用 `team_workflow_template` 下载专用 XLSX。WorkBuddy 将原始资料映射到明确字段，保留来源，不猜税率、折旧政策、预算口径和缺失数值。模板的 `parameters` 要逐项按依据填写；金额、币种、日期和编号不得混用。优先用 `team_start_prepared_workflow` 一次上传整理主表、固定依据并安排本地执行，记录 `workflow.runId`，不要再次创建同一任务。已有标准输入时用 `team_start_workflow`，执行方式按推荐值选择 `embedded_accounting` 或 `embedded_rules`。原始图片/OCR、未映射复杂文件仍可用 `workbuddy` 处理方式。保存新输入会使旧任务失效，先保留需要的旧成果；失效任务不得默认为已完成。\r\n4. 使用 `team_workflow_status` 按 runId 查询；可在当前会话有限次数查询（例如间隔 2、5、10 秒，最多 6 次），未就绪时回报任务编号和下一步。停止会话后不能承诺仍在运行模型或自动通知；下次凭任务编号恢复查询。\r\n5. `ready` 仅表示任务包就绪，下载后按原工作流处理；`calculated` 只说明规则处理/草稿生成完毕。先用 `team_calculation(section=summary)` 读摘要，再分页读完 `section=issues`；规则工作流用 `section=rows` 读取明细，账务计算可用 `section=trial` 读试算。保留计算值及源行依据，不凭模型重算覆盖确定性结果。需要完整文件时下载 package.id 对应包。\r\n6. WorkBuddy 文件处理任务按原上传/回传工具提交；内嵌计算使用 `team_return_calculation` 提交 jobId、当前 runVersion 和经办说明，由服务器一次归集计算原件与说明。不再把计算文件重复上传到普通回传入口。保留相同 jobId 和说明重试。`returned_with_issues` 表示已回传但异常未解决，不能送审；`returned` 仍待网页送审与独立复核，零差异不代表资料完整或已入账。\r\n7. `failed` 时读取错误，以 `team_retry_job` 重试原后台任务，不重复新建。`stale` 时刷新工作单，按最新输入用 `team_revise_workflow` 修订（整理主表发生替换且存在多份 XLSX 时明确 preparedWorkbookId），保留原 key 重试；修订会自动沿用执行方式重新排队。`cancelled`、`blocked` 时停止沿用旧资料。`review` 等待独立复核，`delivery` 等待实际交付证据，`archived` 已归档。\r\n\r\n## 开票申请\r\n\r\n先调用 `team_invoicing_capabilities` 核实连接状态。对接尚未完成时，只能从当前工作单的真实业务原件准备申请。查询 `team_invoice_requests` 后按唯一业务编号调用 `team_prepare_invoice`，再用 `team_invoice_request` 查看缺项。源资料、销方、购方、商品、税号、税率、分类编码和金额必须有依据；不清楚的字段留空，汇总一次缺项。对已有申请用 `team_revise_invoice` 修改并记录原因；历史可用 `team_invoice_revisions` 分页读取。已核验申请修改后重新待核验。`ready` 是内部申请已核验，`issued=false` 表示本工作台未执行开具；未选择渠道不阻止本地申请管理。白居E仅是竞品调研对象，不是默认接入厂商。实际开票必须接入经核验的官方渠道，不能抓取内部接口、绕过认证或自动代替人工核验。此工具不提供确认、开具或红冲动作。\r\n\r\n## 代账逐户授权、批量申请与结果回录\r\n\r\n这些入口只调用本工作台，不连接外部开票平台。先读 `team_invoicing_capabilities`，功能未部署或接口不存在时明确报告，不使用旧工具假装完成。\r\n\r\n1. 按用户明确的客户、期间和业务范围查询工作单、固定客户档案及 `team_invoice_authorizations`，逐户核对主体、有效期、操作范围和版本。`effective` 只表示本地凭证经人工核验且有效，不表示税务平台授权成功。没有凭证不得假定已授权，不询问或保存税务密码。\r\n2. 用户提供实际委托凭证时，用 `team_upload_invoice_evidence(purpose=authorization)` 上传授权交接目录里的 PDF/图片原件，随后 `team_prepare_invoice_authorization` 保存草稿。另一名人员在网页核验后才能使用；不可代替该确认。授权范围只支持准备申请、回录结果，不能扩大为实际开具。\r\n3. 批量申请先查询已有业务编号；刷新工作单版本。使用 `team_prepare_invoice_batch` 一次提交最多 50 项，每项带工作单、原始资料、授权 id/版本和不同的 itemKey、key。批次 key 与原参数保持稳定，超时原样重试或查询，不换 key 重建；返回批次编号。prepared 是草稿保存成功，仍须读取缺项和核验状态。只补办 blocked 项，不能重做成功项。单张仍用原申请/修订工具。\r\n4. `team_invoice_batch` 跟踪逐户当前阶段，`team_invoice_request` 查看具体缺项。区分待授权、待补件、申请待核验、回录待核验及回录已核验；不可将不可见客户当作已完成。批次准备在调用内完成，没有后台自动开具或会话外持续通知。\r\n5. 已有真实开票结果时，先 `team_invoice_results` 查询防重；`team_upload_invoice_evidence(purpose=receipt)` 上传实际回执，再用 `team_prepare_invoice_result` 保存草稿。成功数据必须读取实际回执，与原申请逐项核对，不能拿预期字段冒充实际号码、日期、身份和金额。失败/结果不明时票号、开票日期和金额留空，保留说明与凭证。结果不明禁止重复开票，先由实际办理渠道查清，再补录结果。\r\n6. 回录须独立人员网页核验；驳回后另存修正草稿，保留历史。`recordedIssued=true` 仅表示已有成功回执被人工核验，`taxAuthorityVerified=false` 表示未在线查验。工作台不自动开具、验真、红冲、部分开票或入账。报告批次编号、各户状态、凭证归属和下一步人工事项。\r\n\r\n## 批次续办和回录后的账务准备\r\n\r\n用户说“把这批剩下的接着办”时，先用 `team_invoice_batch_actions` 读取逐项待办、最新尝试、申请和草稿版本，只选择用户明确范围内的项目。不得把缺少访问权限的项目报告为完成。\r\n\r\n读取每项 `feedback` 汇总缺项，按 `nextStep` 报告下一步与对应工作单。`requiresHumanReview=true` 时提供待核验的申请／回录／草稿编号，交由独立人员在工作台处理；不调用自动通过。人工完成后再次查询同批 actions，继续具备依据的明确选中项。续办回执中的 `progressQuery` 指向当前进度查询，原回执不代表最新状态。\r\n\r\n恢复失败项时先读取 `resume`：`canPrefill=true` 可沿用上次 changes/context/reason，只向用户确认缺项或变化部分，不能让用户从头再报已有资料。补件后重新读取 expected；`canPrefill=false` 表示申请或草稿已更换版本，旧输入仅供对照，先核对最新记录。账务驳回沿用当前 context 按 review_reason 修订；回录驳回用 `team_invoice_results` 读取原 payload、evidence、授权和核验意见，仅更正有依据的内容，再以新 key 保存回录草稿。原样超时重试沿用旧 key；已明确驳回后另存修正草稿才用新 key。这些操作不重新开票、不代替人工复核。\r\n\r\n- `team_continue_invoice_batch` 一次提交最多 50 项：`repair` 修订已有缺项申请；`retry` 补办原未保存项；`ledger` 登记已核验成功回执；`accounting` 登记台账并准备记账草稿。每项携带 actions 返回的 `expected.attemptId`、工作单版本，以及操作需要的申请/草稿版本。保留批次 key 和原内容重试；网络结果不明时先查回执或原样重试，不换 key 盲目重建。修正业务失败后先刷新再用新 key。\r\n- 读取 `team_invoice_continuation` 的每项 outcome 和 issues。completed 只表示该操作执行完毕；可能仍有 blocked 账务草稿。申请保存失败与实际开票失败不同，后者只核实原渠道并继续回录，不能自动重新申请或开具。\r\n- 检查回执的 `scopeComplete`、`visibleItems` 和 `totalItems`。权限变化导致 `scopeComplete=false` 时，只报告可见结果与“部分项目当前无权访问”，不能推断整批完成，也不能为不可见项目新建申请。\r\n- 账务先用 `team_invoice_accounting_context` 读取客户本期科目表、档案及现有凭证。用 `team_invoice_accounting_rules` / `team_invoice_accounting_rule` 查明确业务类型的规则；没有科目或规则不能编造。根据用户确认口径可用 `team_prepare_invoice_accounting_rule` / `team_revise_invoice_accounting_rule` 保存规则草稿，等待网页另一名人员核验。\r\n- 实际成功回执经独立核验后，用 `team_register_invoice_ledger` 或批次 ledger/accounting 入口登记唯一台账。缺项、失败、不明或待核验回录不能进入记账准备。`team_invoice_ledger` / `team_invoice_ledger_entry` 查询台账及草稿版本。\r\n- `team_prepare_invoice_accounting` / `team_revise_invoice_accounting` 仅准备草稿。明确处理日期、CNY 口径、普通蓝字销项业务、是否已入账、确认依据和附件对应关系。不得仅凭开票确认收入。new_entry 必须读取并绑定实际 `ruleId` 和 `ruleVersion`，确认适用条件；规则版本变化后重新核实，不沿用旧的 conditionsConfirmed。已入账使用 link_existing 关联本期原凭证；hold 保留不确定事项。跨期、外币、合并/拆分及复杂调整转人工处理。\r\n- `team_invoice_accounting_draft` 查询分录、缺项、依据变化和独立复核状态。补件后修订成新版本；已核验历史成果不重复生成。stale 表示当前依据已有变化，历史核验不能当作按新依据又核验了一次。\r\n- 独立复核后通过 `team_download_invoice_accounting` 下载 XLSX/JSON 至授权目录。`posted=false`，不改现有核对底稿、不写正式账套、不自动导入其他软件。报告每户当前状态、续办编号、草稿编号、成果位置及待人工事项。\r\n- 下载回执只有 `state=downloaded` 才表示文件已保存；使用返回的草稿编号、格式、`absolutePath` 和摘要交接。文件已存在时核实原下载或换输出文件名，不覆盖；不将交接成果重新上传成原始资料。\r\n- 工具错误返回 `outcomeUnknown=true` 时，提交结果仍不明。先查原任务；重试必须保留原 key 和全部参数，不凭超时报告失败或新建另一份任务。内嵌计算／WorkBuddy 成果回传后读取返回的 `progress.state/nextAction`，区分有异常、待送审、待独立复核和已归档。\r\n\r\n## 人工复核要求\r\n\r\n付款、入账、纳税申报、违规认定、会计政策和重大估计必须由授权人员最终确认。OCR、模型推断和异常标记不能直接作为正式结论。\r\n\r\n## 完成回报\r\n\r\n按 `templates/task-brief.md` 的结构报告：实际读取文件、实际生成文件、关键合计、勾稽结果、异常/待复核项、未完成事项及原因。不要只给操作建议。\r\n\r\n## 工作流目录\r\n\r\n`references/workflows.json` 是机器可读的完整目录，`references/workflows.md` 是便于人工查看的版本，`references/prompts/` 包含 01–25 号工作流各自独立、可直接复制的完整提示词。这些文件由仓库脚本生成，不要手工制造与目录不一致的编号。\r\n\n~~~~~~\n\n## agents/finance-workbench/references/prompts/01-excel-cleaning.md\n\nSHA-256: bd43580682aa6c0b1441615f4b4d1c714dd16234a95ec0dc4548f544532e8299\n\n~~~~~~text\n# 01 · Excel 原始数据自动清洗\n\n适用岗位：财务会计 / 核算岗\n\n新手起步：先准备“原始明细表”和“字段标准表”；资料不全也可以先打开流程，让 AI 一次列出缺项。\n\n复制以下全部内容到 AI 对话中：\n\n```text\n【财务任务包】Excel 原始数据自动清洗\n\n你是用户的财务执行助理。你要在当前工作区内完成真实文件处理，而不是只给方法说明。\n通用口径：金额精确到分；日期统一为 YYYY-MM-DD；百分比保留两位小数；所有计算必须可追溯到源文件、源工作表和源行；无法确认的内容标注“需人工复核”，禁止猜测。OCR 结果不得直接作为入账或付款依据。\n\n【新手填写区（不清楚可留空）】\n- 处理主体：\n- 处理期间：\n- 已上传资料：\n- 特别口径或阈值：\n- 希望交付时间：\n留空的内容先尝试从当前对话和文件中识别；仍影响处理时，把所有必需缺项合并成一次询问，并用财务人员熟悉的语言说明如何准备。\n\n【所需资料】\n- 原始明细表\n- 字段标准表\n- 部门/客户名称映射表\n- 异常判断规则\n\n【交付成果】\n- 标准数据表\n- 异常数据表\n- 主结果表\n- 异常明细表\n- 金额/行数校验表\n- 处理日志与规则版本\n\n【执行闭环】\n1. 自动选材：先理解当前对话中的目标、期间、主体和口径；优先读取已引用文件，再扫描“财务资料”及当前工作区中与任务名称、文件名和内容相关的资料。忽略无关文件，不要求用户重复描述已有信息。若资料不足，只集中询问一次完成任务所必需的缺项。\n2. 执行预览：先给出字段映射、统一口径、异常规则、计算公式、拟生成文件及保存路径；涉及口径判断时等待我确认。\n3. 文件处理：确认后只处理副本；输出到当前工作区“输出/财务工作台”子目录；绝不覆盖、移动或删除原件。\n4. 质量复核：完成总笔数、金额合计、勾稽关系、重复值、缺失值和异常值检查，并执行专项核查清单。\n5. 交付归档：保留原始输入、执行输出、复核说明和异常明细；在回复中给出实际生成文件的相对路径。\n\n【模块执行指令】\n处理目标：输出字段统一、格式规范、异常单列的标准数据表。\n关键规则：保留原始表，不覆盖源文件；日期统一为 YYYY-MM-DD；金额列转为数值并标记空值或文本；名称只按映射表替换，无法匹配进入异常表。\n执行步骤：1. 准备20-50行脱敏样表；2. 列出必须保留字段和标准字段名；3. 确认日期、金额和名称规则；4. 读取原表、映射表和规则；5. 先输出清洗预览；6. 核对行数、金额与异常数；7. 固定输入目录、输出命名和复核人。\n先输出字段映射、处理方案、异常边界和验收方法，经确认后从20-50行脱敏样本试跑；不得覆盖源文件，不得把异常标记直接解释为违规或会计结论。\n\n【专项核查清单】\n- [ ] 原表保留\n- [ ] 行数可追溯\n- [ ] 金额合计一致\n- [ ] 异常单独输出\n\n【完成回报】\n不要只回复操作建议。完成后汇报：实际读取的文件、实际生成的文件、关键合计与勾稽结果、异常/待复核项、未完成事项及原因。\n```\n\n~~~~~~\n\n## agents/finance-workbench/references/prompts/02-excel-merge.md\n\nSHA-256: 9f6757a0e003093e7121127492238042937a58b1ea26d1b54f15f84ed0873794\n\n~~~~~~text\n# 02 · 多张 Excel 批量合并\n\n适用岗位：财务会计 / 财务主管\n\n新手起步：先准备“各部门 Excel”和“标准字段模板”；资料不全也可以先打开流程，让 AI 一次列出缺项。\n\n复制以下全部内容到 AI 对话中：\n\n```text\n【财务任务包】多张 Excel 批量合并\n\n你是用户的财务执行助理。你要在当前工作区内完成真实文件处理，而不是只给方法说明。\n通用口径：金额精确到分；日期统一为 YYYY-MM-DD；百分比保留两位小数；所有计算必须可追溯到源文件、源工作表和源行；无法确认的内容标注“需人工复核”，禁止猜测。OCR 结果不得直接作为入账或付款依据。\n\n【新手填写区（不清楚可留空）】\n- 处理主体：\n- 处理期间：\n- 已上传资料：\n- 特别口径或阈值：\n- 希望交付时间：\n留空的内容先尝试从当前对话和文件中识别；仍影响处理时，把所有必需缺项合并成一次询问，并用财务人员熟悉的语言说明如何准备。\n\n【所需资料】\n- 各部门 Excel\n- 标准字段模板\n- 文件命名规则\n- 部门清单\n\n【交付成果】\n- 合并明细表\n- 重复数据表\n- 缺失字段清单\n- 主结果表\n- 异常明细表\n- 金额/行数校验表\n- 处理日志与规则版本\n\n【执行闭环】\n1. 自动选材：先理解当前对话中的目标、期间、主体和口径；优先读取已引用文件，再扫描“财务资料”及当前工作区中与任务名称、文件名和内容相关的资料。忽略无关文件，不要求用户重复描述已有信息。若资料不足，只集中询问一次完成任务所必需的缺项。\n2. 执行预览：先给出字段映射、统一口径、异常规则、计算公式、拟生成文件及保存路径；涉及口径判断时等待我确认。\n3. 文件处理：确认后只处理副本；输出到当前工作区“输出/财务工作台”子目录；绝不覆盖、移动或删除原件。\n4. 质量复核：完成总笔数、金额合计、勾稽关系、重复值、缺失值和异常值检查，并执行专项核查清单。\n5. 交付归档：保留原始输入、执行输出、复核说明和异常明细；在回复中给出实际生成文件的相对路径。\n\n【模块执行指令】\n处理目标：批量合并为统一明细表，并输出来源、缺失字段和重复记录。\n关键规则：每条数据保留来源文件和来源部门；字段缺失不强行补值；重复判断使用业务唯一键；合并前后统计文件数、行数和金额。\n执行步骤：1. 建立本期统一输入目录；2. 准备标准字段模板；3. 确认业务唯一键；4. 生成字段差异清单；5. 确认映射后合并并查重；6. 核对部门数、文件数、行数和金额；7. 输出合并表、重复表、缺字段表和日志。\n先输出字段映射、处理方案、异常边界和验收方法，经确认后从20-50行脱敏样本试跑；不得覆盖源文件，不得把异常标记直接解释为违规或会计结论。\n\n【专项核查清单】\n- [ ] 文件未遗漏\n- [ ] 字段未错位\n- [ ] 重复有依据\n- [ ] 合计可核对\n\n【完成回报】\n不要只回复操作建议。完成后汇报：实际读取的文件、实际生成的文件、关键合计与勾稽结果、异常/待复核项、未完成事项及原因。\n```\n\n~~~~~~\n\n## agents/finance-workbench/references/prompts/03-expense-summary.md\n\nSHA-256: f8cd91c5df67393245b2937f24c435a75d5587f157ac968dca93b n- [ ] 权限不扩大\n- [ ] 对外回复已复核\n\n【完成回报】\n不要只回复操作建议。完成后汇报：实际读取的文件、实际生成的文件、关键合计与勾稽结果、异常/待复核项、未完成事项及原因。\n```\n\n~~~~~~\n\n## agents/finance-workbench/references/prompts/README.md\n\nSHA-256: f9476333f837ec0a58cede2f63abbda334101e4e682aea401f95761623408bba\n\n~~~~~~text\n# 25 个财务工作流提示词\n\n每份提示词都可直接复制到 WorkBuddy、Codex、Claude Code 或其他支持文件处理的 AI 工具。新手填写区不清楚的项可留空，AI 会先识别现有资料并一次列出必需缺项。\n\n- [01 · Excel 原始数据自动清洗](01-excel-cleaning.md) — 输出字段统一、格式规范、异常单列的标准数据表。\n- [02 · 多张 Excel 批量合并](02-excel-merge.md) — 批量合并为统一明细表，并输出来源、缺失字段和重复记录。\n- [03 · 费用报销自动汇总](03-expense-summary.md) — 生成部门、项目、费用类型汇总及异常报销清单。\n- [04 · 重复报销与异常费用检查](04-expense-duplicate-check.md) — 按多条件识别完全重复和疑似重复，形成分级复核清单。\n- [05 · 银行流水与账务明细核对](05-bank-reconcile.md) — 生成已匹配、疑似匹配、未匹配和差异原因清单。\n- [06 · 订单、回款、发票三表核对](06-order-cash-invoice.md) — 形成订单-回款-发票三方勾稽表及差异跟进清单。\n- [07 · 应收账款账龄分析](07-ar-aging.md) — 生成客户账龄分布、逾期金额、重点风险和催收建议。\n- [08 · 应付账款到期与付款排期](08-ap-schedule.md) — 生成到期付款计划、资料缺失清单和资金压力提醒。\n- [09 · 发票台账自动整理](09-invoice-ledger.md) — 识别票面信息并生成标准发票台账、缺失字段和疑似重复清单。\n- [10 · 发票与付款记录匹配](10-invoice-payment-match.md) — 形成发票-付款对应关系及未付款、超付款和待确认清单。\n- [11 · 进项与销项发票月度核对](11-vat-monthly-check.md) — 形成进销项汇总、税率分布、异常状态和申报前待确认事项。\n- [12 · 固定资产台账更新与折旧检查](12-fixed-assets.md) — 更新固定资产台账并输出新增、变动、折旧和异常清单。\n- [13 · 库存进销存差异检查](13-inventory-check.md) — 生成数量、金额、负库存、异常出入库和待查原因清单。\n- [14 · 工资、社保、个税三表核对](14-payroll-check.md) — 生成员工级差异表及新增、离职、基数和金额异常清单。\n- [15 · 月末结账资料完整性检查](15-month-close-completeness.md) — 生成月结任务完成表、缺失资料、异常差异和责任人清单。\n- [16 · 月度经营报表自动生成](16-monthly-management-report.md) — 生成标准经营报表、同比环比分析和异常变化说明。\n- [17 · 预算执行与偏差分析](17-budget-variance.md) — 生成预算达成、超支、节余、趋势和纠偏行动表。\n- [18 · 部门费用与降本分析](18-cost-reduction.md) — 生成费用结构、增长贡献、异常项目和可验证的降本清单。\n- [19 · 现金流与资金预测](19-cashflow-forecast.md) — 生成滚动现金流预测、资金缺口和关键假设提醒。\n- [20 · 老板汇报表与管理摘要](20-management-summary.md) — 把经营数据整理成结论、风险、原因和需要决策的事项。\n- [21 · 全表异常数据自动检查](21-full-table-anomaly.md) — 形成通用异常检查报告，帮助财务优先复核高风险记录。\n- [22 · 凭证附件与财务文件归档](22-voucher-archive.md) — 按统一规则整理目录、命名清单和缺失附件报告。\n- [23 · 合同付款条款提取](23-contract-terms.md) — 定位条款原文，形成合同主表、付款计划与到期风险清单。\n- [24 · 周期任务与本地自动化](24-local-automation.md) — 把月结、付款到期和周报做成可试运行、可追溯的本地任务。\n- [25 · 财务制度知识库与受控协同](25-policy-knowledge.md) — 整理制度证据库，生成有出处的问答与权限清晰的协同流程。\n\n~~~~~~\n\n## agents/finance-workbench/references/safety.md\n\nSHA-256: 5775186edd42b91af3d0403e3762d2e67e4d8b3bf6e6acc26e70c3531013d7e3\n\n~~~~~~text\n# 财务自动化安全边界\r\n\r\n## 数据处理\r\n\r\n- 先确认用户对资料具有合法授权。\r\n- 能脱敏就不使用真实姓名、证件号、银行卡号、税号或联系方式。\r\n- 不把真实财务资料发送到未获组织批准的第三方服务。\r\n- 源文件只读，处理副本，输出到新目录。\r\n- 所有合并、匹配和计算结果保留来源信息。\r\n\r\n## 不能自动作出的决定\r\n\r\n- 是否付款、付款账户和付款日期。\r\n- 是否入账、使用哪个会计科目或是否调整凭证。\r\n- 是否申报、如何进行税务处理或是否存在税务违规。\r\n- 是否认定舞弊、违规、责任或处罚。\r\n- 会计政策、重大估计和影响报表的最终判断。\r\n\r\n## 输出措辞\r\n\r\n把结果区分为“数据事实”“规则命中”“疑似异常”“需人工确认”。不得把规则命中直接写成违规结论。\r\n\r\n## 失败处理\r\n\r\n如果字段缺失、文件损坏、口径冲突或权限不足，停止受影响步骤，保留已完成结果，列出缺项和恢复办法。不要猜测缺失数据。\r\n\n~~~~~~\n\n## agents/finance-workbench/references/workflows.json\n\nSHA-256: 9b402b665e2d2207170e9ae5b1bb9f7daa7bf6e7d10de79c2c04439552e91ae5\n\n~~~~~~text\n{\n  \"product\": \"workbuddy-finance-workbench\",\n  \"version\": 2,\n  \"productVersion\": \"2.7.1\",\n  \"generatedAt\": \"2026-10-26\",\n  \"sopSteps\": [\n    {\n      \"number\": \"01\",\n      \"title\": \"选场景\",\n      \"note\": \"范围小到一张表或一个固定输出\"\n    },\n    {\n      \"number\": \"02\",\n      \"title\": \"备样本\",\n      \"note\": \"保留正常、缺失、重复、异常与特殊业务\"\n    },\n    {\n      \"number\": \"03\",\n      \"title\": \"定字段\",\n      \"note\": \"写清主键、类型、单位、口径与来源\"\n    },\n    {\n      \"number\": \"04\",\n      \"title\": \"写规则\",\n      \"note\": \"把经验改写成可判断的明确条件\"\n    },\n    {\n      \"number\": \"05\",\n      \"title\": \"先方案\",\n      \"note\": \"先看字段映射、异常边界与拟输出\"\n    },\n    {\n      \"number\": \"06\",\n      \"title\": \"小样本\",\n      \"note\": \"先跑20-50行并与人工结果逐条核对\"\n    },\n    {\n      \"number\": \"07\",\n      \"title\": \"补边界\",\n      \"note\": \"记录误判、漏项、权限与复杂关系\"\n    },\n    {\n      \"number\": \"08\",\n      \"title\": \"固化 SOP\",\n      \"note\": \"固定目录、命名、复核人、频率与日志\"\n    }\n 用制度版本和条款\",\n        \"过期冲突制度不作确定回答\",\n        \"关键写入和发送动作二次确认\",\n        \"敏感文件不经未授权渠道外发\"\n      ],\n      \"steps\": [\n        \"盘点制度版本和范围\",\n        \"切分条款并建立出处\",\n        \"标记过期与冲突\",\n        \"生成可追溯问答\",\n        \"列出依据不足问题\",\n        \"设计只读优先协同流程\",\n        \"输出权限边界和审计要求\"\n      ],\n      \"outputs\": [\n        \"财务制度索引\",\n        \"问答库与协同 SOP\",\n        \"主结果表\",\n        \"异常明细表\",\n        \"金额/行数校验表\",\n        \"处理日志与规则版本\"\n      ],\n      \"checklist\": [\n        \"答案有出处\",\n        \"冲突制度已标记\",\n        \"权限不扩大\",\n        \"对外回复已复核\"\n      ],\n      \"fileKinds\": [\n        \"sheet\",\n        \"document\"\n      ],\n      \"minimumInputs\": [\n        \"现行财务制度\",\n        \"历史 FAQ\"\n      ],\n      \"beginnerTip\": \"先准备“现行财务制度”和“历史 FAQ”；资料不全也可以先打开流程，让 AI 一次列出缺项。\",\n      \"sampleRequest\": \"请帮我用“财务制度知识库与受控协同”处理本期资料。先检查文件和字段是否齐全，再给出处理预览；我确认后再处理小样本。\",\n      \"prompt\": \"处理目标：整理制度证据库，生成有出处的问答与权限清晰的协同流程。\\n关键规则：每条回答引用制度版本和条款；过期冲突制度不作确定回答；关键写入和发送动作二次确认；敏感文件不经未授权渠道外发。\\n执行步骤：1. 盘点制度版本和范围；2. 切分条款并建立出处；3. 标记过期与冲突；4. 生成可追溯问答；5. 列出依据不足问题；6. 设计只读优先协同流程；7. 输出权限边界和审计要求。\\n先输出字段映射、处理方案、异常边界和验收方法，经确认后从20-50行脱敏样本试跑；不得覆盖源文件，不得把异常标记直接解释为违规或会计结论。\"\n    }\n  ]\n}\n\n~~~~~~\n\n## agents/finance-workbench/references/workflows.md\n\nSHA-256: 199907e0cd43d12217c7c3c1c15189c46e6ccfbd17210cc249b78ea46f12b14c\n\n~~~~~~text\n# 财务工作流目录\n\n共 25 个工作流。主数据源为 `src/finance-data.js`。\n\n## 01 · Excel 原始数据自动清洗\n\n- 适用岗位：财务会计 / 核算岗\n- 目标：输出字段统一、格式规范、异常单列的标准数据表。\n- 输入：原始明细表；字段标准表；部门/客户名称映射表；异常判断规则\n- 新手最少先准备：原始明细表；字段标准表\n- 关键规则：保留原始表，不覆盖源文件；日期统一为 YYYY-MM-DD；金额列转为数值并标记空值或文本；名称只按映射表替换，无法匹配进入异常表\n- 输出：标准数据表；异常数据表；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：原表保留；行数可追溯；金额合计一致；异常单独输出\n- [查看并复制完整提示词](prompts/01-excel-cleaning.md)\n\n## 02 · 多张 Excel 批量合并\n\n- 适用岗位：财务会计 / 财务主管\n- 目标：批量合并为统一明细表，并输出来源、缺失字段和重复记录。\n- 输入：各部门 Excel；标准字段模板；文件命名规则；部门清单\n- 新手最少先准备：各部门 Excel；标准字段模板\n- 关键规则：每条数据保留来源文件和来源部门；字段缺失不强行补值；重复判断使用业务唯一键；合并前后统计文件数、行数和金额\n- 输出：合并明细表；重复数据表；缺失字段清单；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：文件未遗漏；字段未错位；重复有依据；合计可核对\n- [查看并复制完整提示词](prompts/02-excel-merge.md)\n\n## 03 · 费用报销自动汇总\n\n- 适用岗位：费用会计 / 财务主管\n- 目标：生成部门、项目、费用类型汇总及异常报销清单。\n- 输入：报销明细；部门表；费用科目表；审批与发票状态；预算标准\n- 新手最少先准备：报销明细；部门表\n- 关键规则：未审批通过不进入正式汇总；缺发票、金额为0、部门为空进入异常；费用类型按标准科目映射；大额或超预算单独标记\n- 输出：费用汇总表；异常报销清单；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：审批状态有效；发票异常识别；汇总金额一致；超预算有说明\n- [查看并复制完整提示词](prompts/03-expense-summary.md)\n\n## 04 · 重复报销与异常费用检查\n\n- 适用岗位：费用会计 / 内控岗\n- 目标：按多条件识别完全重复和疑似重复，形成分级复核清单。\n- 输入：报销明细；员工、日期、金额与商户字段；费用类型、发票号和备注\n- 新手最少先准备：报销明细；员工、日期、金额与商户字段\n- 关键规则：发票号相同列为高风险；员工+金额+相近日期列为疑似重复；同商户同日多笔大额单独检查；只标记风险，不直接判定违规\n- 输出：重复报销检查表；异常费用复核清单；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：风险分级；判断依据清楚；原始行可定位；人工最终确认\n- [查看并复制完整提示词](prompts/04-expense-duplicate-check.md)\n\n## 05 · 银行流水与账务明细核对\n\n- 适用岗位：出纳 / 总账会计\n- 目标：生成已匹配、疑似匹配、未匹配和差异原因清单。\n- 输入：银行流水；账务明细；账户、日期、金额和摘要字段；对方户名与凭证号\n- 新手最少先准备：银行流水；账务明细\n- 关键规则：先按账户和金额匹配；日期容差默认1-3天；手续费与合并收付款单独处理；疑似匹配保留双方原始行号\n- 输出：银行对账结果；未达账项清单；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：账户一致；金额方向正确；未达项完整；双方行号保留\n- [查看并复制完整提示词](prompts/05-bank-reconcile.md)\n\n## 06 · 订单、回款、发票三表核对\n\n- 适用岗位：应收会计 / 财务主管\n- 目标：形成订单-回款-发票三方勾稽表及差异跟进清单。\n- 输入：订单表；回款表；发票表；客户映射表；订单号或合同号\n- 新手最少先准备：订单表；回款表\n- 关键规则：优先订单号或合同号；名称匹配只作辅助；支持一对多和多对一；差异拆分为未回款、少回款、未开票和超开票\n- 输出：三方勾稽表；差异跟进清单；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：主键优先；复杂关系可见；累计金额正确；差异分类明确\n- [查看并复制完整提示词](prompts/06-order-cash-invoice.md)\n\n## 07 · 应收账款账龄分析\n\n- 适用岗位：应收会计 / 财务 BP\n- 目标：生成客户账龄分布、逾期金额、重点风险和催收建议。\n- 输入：应收明细；客户与到期日；未收金额；销售负责人；信用政策与历史回款\n- 新手最少先准备：应收明细；客户与到期日\n- 关键规则：账龄按到期日计算；区间固定并记录统计日；争议款与正常款分开；高金额+长账龄列为重点风险\n- 输出：应收账龄表；重点催收清单；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：统计日明确；到期日口径一致；争议款单列；催收有优先级\n- [查看并复制完整提示词](prompts/07-ar-aging.md)\n\n## 08 · 应付账款到期与付款排期\n\n- 适用岗位：应付会计 / 资金岗\n- 目标：生成到期付款计划、资料缺失清单和资金压力提醒。\n- 输入：应付明细；供应商与到期日；付款条件；合同、发票和审批；账户余额\n- 新手最少先准备：应付明细；供应商与到期日\n- 关键规则：资料不齐不进入可付款清单；重复发票或申请先冻结；按到期日、优先级和资金约束排序；逾期及大额付款单独提示\n- 输出：付款排期表；暂缓与资料缺失清单；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：资料齐全；重复已检查；资金约束已考虑；到期未遗漏\n- [查看并复制完整提示词](prompts/08-ap-schedule.md)\n\n## 09 · 发票台账自动整理\n\n- 适用岗位：税务岗 / 应付会计\n- 目标：识别票面信息并生成标准发票台账、缺失字段和疑似重复清单。\n- 输入：发票 PDF/图片/明细；供应商档案；合同或订单；报销与付款记录\n- 新手最少先准备：发票 PDF/图片/明细；供应商档案\n- 关键规则：发票代码+号码或电子票号为唯一键；不含税金额+税额=价税合计；税号与供应商档案核对；红字、作废和冲红单独标记\n- 输出：标准发票台账；异常发票清单；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：唯一键完整；税号匹配；金额关系正确；特殊发票单列\n- [查看并复制完整提示词](prompts/09-invoice-ledger.md)\n\n## 10 · 发票与付款记录匹配\n\n- 适用岗位：应付会计 / 税务岗\n- 目标：形成发票-付款对应关系及未付款、超付款和待确认清单。\n- 输入：发票台账；付款流水；供应商与合同号；金额、日期和摘要\n- 新手最少先准备：发票台账；付款流水\n- 关键规则：优先合同号和供应商；支持一对多与多对一；累计付款不超过可付款金额；无法唯一确定时只给候选\n- 输出：发票付款匹配表；未付款与超付款清单；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：复杂关系支持；不强行匹配；累计金额正确；依据可追溯\n- [查看并复制完整提示词](prompts/10-invoice-payment-match.md)\n\n## 11 · 进项与销项发票月度核对\n\n- 适用岗位：税务岗 / 财务主管\n- 目标：形成进销项汇总、税率分布、异常状态和申报前待确认事项。\n- 输入：进项发票；销项发票；认证/勾选状态；红字信息；税率和所属期\n- 新手最少先准备：进项发票；销项发票\n- 关键规则：开票期和所属期分别保留；红字与原票建立关联；异常税率和状态单列；申报数据必须由税务人员最终确认\n- 输出：进销项月度核对表；申报前检查清单；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：所属期明确；红字有关联；税率异常可见；人工最终确认\n- [查看并复制完整提示词](prompts/11-vat-monthly-check.md)\n\n## 12 · 固定资产台账更新与折旧检查\n\n- 适用岗位：资产会计 / 总账会计\n- 目标：更新固定资产台账并输出新增、变动、折旧和异常清单。\n- 输入：上期资产台账；采购与验收资料；部门变动与报废单；折旧政策；账务明细\n- 新手最少先准备：上期资产台账；采购与验收资料\n- 关键规则：资产编码唯一；新增必须有启用日和使用部门；折旧年限和残值率按政策表；报废与转移保留审批依据\n- 输出：更新资产台账；折旧检查表；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：资产编码唯一；变动有依据；折旧政策一致；账面差异可见\n- [查看并复制完整提示词](prompts/12-fixed-assets.md)\n\n## 13 · 库存进销存差异检查\n\n- 适用岗位：成本会计 / 财务主管\n- 目标：生成数量、金额、负库存、异常出入库和待查原因清单。\n- 输入：期初库存；入库与出库；系统期末库存；盘点表；成本单价与 SKU 映射\n- 新手最少先准备：期初库存；入库与出库\n- 关键规则：SKU 编码先统一；期初+入库-出库=理论期末；数量与金额分开核对；负库存、大额调整和异常单价优先检查\n- 输出：库存差异表；责任跟进清单；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：SKU统一；口径一致；数量金额分开；差异按影响排序\n- [查看并复制完整提示词](prompts/13-inventory-check.md)\n\n## 14 · 工资、社保、个税三表核对\n\n- 适用岗位：薪酬会计 / 财务主管\n- 目标：生成员工级差异表及新增、离职、基数和金额异常清单。\n- 输入：工资表；社保公积金表；个税数据；员工花名册；入离职和调薪记录\n- 新手最少先准备：工资表；社保公积金表\n- 关键规则：员工编号为主键；新增离职按生效日判断；实发金额核对扣款关系；敏感数据仅在授权环境处理\n- 输出：薪酬三表差异表；人员与基数异常清单；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：主键唯一；人员状态正确；金额关系核对；权限合规\n- [查看并复制完整提示词](prompts/14-payroll-check.md)\n\n## 15 · 月末结账资料完整性检查\n\n- 适用岗位：总账会计 / 财务主管\n- 目标：生成月结任务完成表、缺失资料、异常差异和责任人清单。\n- 输入：月结清单；各模块完成记录；对账结果；计提与摊销表；凭证状态与责任人\n- 新手最少先准备：月结清单；各模块完成记录\n- 关键规则：每项任务有完成证据；未完成不能只写进行中；差异必须有处理状态；关键任务缺失直接标高风险\n- 输出：月结完成看板；缺失资料与责任人清单；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：任务全覆盖；完成有证据；差异有状态；风险有责任人\n- [查看并复制完整提示词](prompts/15-month-close-completeness.md)\n\n## 16 · 月度经营报表自动生成\n\n- 适用岗位：财务 BP / 财务经理\n- 目标：生成标准经营报表、同比环比分析和异常变化说明。\n- 输入：收入、成本与费用数据；预算、上期与同期；部门、产品或渠道维度；指标口径字典\n- 新手最少先准备：收入、成本与费用数据；预算、上期与同期\n- 关键规则：指标口径固定并保留说明；本期、预算、上期和同期同表比较；异常阈值提前设定；先列事实再由业务确认原因\n- 输出：月度经营报表；异常变化说明；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：口径字典完整；多期可比；异常有阈值；原因经业务确认\n- [查看并复制完整提示词](prompts/16-monthly-management-report.md)\n\n## 17 · 预算执行与偏差分析\n\n- 适用岗位：财务 BP / 预算负责人\n- 目标：生成预算达成、超支、节余、趋势和纠偏行动表。\n- 输入：年度/月度预算；实际发生；部门、项目和费用科目；预算调整记录\n- 新手最少先准备：年度/月度预算；实际发生\n- 关键规则：预算版本必须明确；实际数按同一科目口径映射；调整前后分别保留；偏差同时看金额与比例\n- 输出：预算偏差分析表；纠偏行动表；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：预算版本明确；科目映射正确；金额比例都看；动作有责任人\n- [查看并复制完整提示词](prompts/17-budget-variance.md)\n\n## 18 · 部门费用与降本分析\n\n- 适用岗位：财务 BP / 财务经理\n- 目标：生成费用结构、增长贡献、异常项目和可验证的降本清单。\n- 输入：费用明细；部门、项目和供应商；费用类型；预算、上期与同期\n- 新手最少先准备：费用明细；部门、项目和供应商\n- 关键规则：统一费用分类；区分一次性与持续性费用；金额增长和增长贡献同时分析；降本建议考虑业务影响\n- 输出：部门费用分析表；降本验证清单；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：分类一致；一次性单列；增长贡献明确；不盲目压成本\n- [查看并复制完整提示词](prompts/18-cost-reduction.md)\n\n## 19 · 现金流与资金预测\n\n- 适用岗位：资金岗 / 财务经理\n- 目标：生成滚动现金流预测、资金缺口和关键假设提醒。\n- 输入：期初资金；预计回款；付款计划；工资税费；融资安排与历史兑现率\n- 新手最少先准备：期初资金；预计回款\n- 关键规则：预测周期固定，例如未来13周；确定性与不确定性收支分开；回款按历史兑现率调整；缺口日期和因素可追溯\n- 输出：13周现金流预测；资金缺口与行动清单；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：周期固定；假设透明；三种情景；每周滚动更新\n- [查看并复制完整提示词](prompts/19-cashflow-forecast.md)\n\n## 20 · 老板汇报表与管理摘要\n\n- 适用岗位：财务经理 / 财务 BP\n- 目标：把经营数据整理成结论、风险、原因和需要决策的事项。\n- 输入：经营报表；预算偏差；现金流与往来；重大事件；业务反馈\n- 新手最少先准备：经营报表；预算偏差\n- 关键规则：先结论后数据；一页只保留关键指标；事实、原因假设和建议分开；待决策问题单独列出\n- 输出：管理层一页摘要；汇报附件明细；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：先结论后数据；指标不堆砌；决策项清楚；数据有依据\n- [查看并复制完整提示词](prompts/20-management-summary.md)\n\n## 21 · 全表异常数据自动检查\n\n- 适用岗位：所有财务岗位\n- 目标：形成通用异常检查报告，帮助财务优先复核高风险记录。\n- 输入：待检查表；字段说明；正常范围；业务唯一键；历史或上期数据\n- 新手最少先准备：待检查表；字段说明\n- 关键规则：结构异常与业务异常分开；阈值必须由财务定义；异常只表示需要复核；所有异常保留原始行号和字段\n- 输出：全表异常检查报告；高风险复核清单；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：规则由财务定义；原始行可定位；按影响排序；不替代专业判断\n- [查看并复制完整提示词](prompts/21-full-table-anomaly.md)\n\n## 22 · 凭证附件与财务文件归档\n\n- 适用岗位：总账会计 / 财务档案岗\n- 目标：按统一规则整理目录、命名清单和缺失附件报告。\n- 输入：凭证清单；附件文件夹；合同号与对方名称；月份；附件要求表\n- 新手最少先准备：凭证清单；附件文件夹\n- 关键规则：只在副本目录试跑；命名包含期间+业务号+类型；附件要求按业务类型判断；无法关联的文件进入待确认目录\n- 输出：拟归档操作清单；缺失附件跟进表；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：先副本试跑；不删除原件；命名统一；缺失资料可跟进\n- [查看并复制完整提示词](prompts/22-voucher-archive.md)\n\n## 23 · 合同付款条款提取\n\n- 适用岗位：合同会计 / 资金岗\n- 目标：定位条款原文，形成合同主表、付款计划与到期风险清单。\n- 输入：合同 PDF/Word 与补充协议；已付款台账；验收节点与开票记录\n- 新手最少先准备：合同 PDF/Word 与补充协议；已付款台账\n- 关键规则：主合同和补充协议正确关联；关键字段保留页码或段落证据；条件式节点不臆造日期；模糊冲突条款由人工复核\n- 输出：合同付款台账；条款证据索引；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：补充协议关联正确；金额与比例可勾稽；条件节点未臆造；原文证据可定位\n- [查看并复制完整提示词](prompts/23-contract-terms.md)\n\n## 24 · 周期任务与本地自动化\n\n- 适用岗位：财务主管 / 流程负责人\n- 目标：把月结、付款到期和周报做成可试运行、可追溯的本地任务。\n- 输入：月结清单与付款计划；任务频率和时区；提醒对象与异常阈值\n- 新手最少先准备：月结清单与付款计划；任务频率和时区\n- 关键规则：默认演练模式；只读、汇总、提醒或草稿生成；不自动付款审批或删除；数据源变化时安全停止\n- 输出：自动化配置表；试运行日志与结果；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：没有高风险自动动作；日志完整；缺失数据安全停止；正式启用前已试跑\n- [查看并复制完整提示词](prompts/24-local-automation.md)\n\n## 25 · 财务制度知识库与受控协同\n\n- 适用岗位：财务主管 / 内控岗\n- 目标：整理制度证据库，生成有出处的问答与权限清晰的协同流程。\n- 输入：现行财务制度；历史 FAQ；审批流程；岗位权限与协同渠道\n- 新手最少先准备：现行财务制度；历史 FAQ\n- 关键规则：每条回答引用制度版本和条款；过期冲突制度不作确定回答；关键写入和发送动作二次确认；敏感文件不经未授权渠道外发\n- 输出：财务制度索引；问答库与协同 SOP；主结果表；异常明细表；金额/行数校验表；处理日志与规则版本\n- 验收：答案有出处；冲突制度已标记；权限不扩大；对外回复已复核\n- [查看并复制完整提示词](prompts/25-policy-knowledge.md)\n\n~~~~~~\n\n## agents/finance-workbench/templates/task-brief.md\n\nSHA-256: 5ca3dceac008fa4e3d1bae43b809e0f14cbe07474a3cc85059c1dd038ba66202\n\n~~~~~~text\n# 财务任务完成报告\r\n\r\n## 任务范围\r\n\r\n- 主体：\r\n- 期间：\r\n- 币种 / 单位：\r\n- 使用工作流：\r\n\r\n## 实际读取文件\r\n\r\n- 文件名、版本、工作表、行数：\r\n\r\n## 实际生成文件\r\n\r\n- 相对路径与用途：\r\n\r\n## 关键校验\r\n\r\n- 输入总行数 / 有效行数：\r\n- 输入金额 / 输出金额：\r\n- 差额与原因：\r\n- 重复、缺失和异常数量：\r\n\r\n## 待人工复核\r\n\r\n- 项目、原因、建议复核人、所需证据：\r\n\r\n## 未完成事项\r\n\r\n- 事项、阻塞原因、恢复条件：\r\n\r\n## 处理留痕\r\n\r\n- 运行时间：\r\n- 规则版本：\r\n- 源文件是否保持不变：是 / 否（说明）\r\n\n~~~~~~\n\n## build.mjs\n\nSHA-256: 2c7ccb00d37082b09cef3e6614cbe98919c7cf7b3a9f70d92a0c49d469c8f23f\n\n~~~~~~text\nimport { createRequire } from 'node:module'\r\nimport { mkdir, readFile, writeFile } from 'node:fs/promises'\r\nimport { fileURLToPath } from 'node:url'\r\n\r\nconst root = new URL('.', import.meta.url)\r\nconst esbuild = await import('esbuild')\r\n\r\nawait mkdir(new URL('./lib/', root), { recursive: true })\r\nawait writeFile(new URL('./lib/index.js', root), await readFile(new URL('./src/index.js', root), 'utf8'))\r\nawait writeFile(new URL('./lib/contract.js', root), await readFile(new URL('./src/contract.js', root), 'utf8'))\r\n\r\nconst built = await esbuild.build({\r\n  entryPoints: [fileURLToPath(new URL('./src/client.jsx', root))],\r\n  bundle: true,\r\n  write: false,\r\n  platform: 'browser',\r\n  format: 'cjs',\r\n  target: ['chrome120'],\r\n  jsx: 'automatic',\r\n  external: ['react', 'react/*', 'react-dom', 'react-dom/*', '@deepseek-ai/*'],\r\n})\r\nconst code = new TextDecoder().decode(built.outputFiles[0].contents)\r\nconst wrapped = `window.__ModuleLoader__.load({ id: 'dsh-finance-workbench', factory: (require) => {\\nvar module = { exports: {} }; var exports = module.exports;\\n${code}\\nreturn module.exports;\\n} });\\n`\r\nawait writeFile(new URL('./lib/client.js', root), wrapped.replace(/[ \\t]+$/gm, ''))\r\nconsole.log('built dsh-finance-workbench')\r\n\n~~~~~~\n\n## cordis.patch.yml\n\nSHA-256: 47bad3d48ec9a0d76c26b0b85369c6929525399fd9d06bb88eb196a2b40dce04\n\n~~~~~~text\n- insert:\r\n    - id: finance-workbench\r\n      name: 'dsh-finance-workbench'\r\n\n~~~~~~\n\n## docs/AUDIT_2026-10-08.md\n\nSHA-256: ec281c4744d3338bba22f3da2d746d9983708a9ec141a0fa77873922826b2f5a\n\n~~~~~~text\n# 财务工作台全面检查与升级报告\r\n\r\n检查日期：2026-10-08。基线为 `main` 的 `c24d985`（v2.6.0），升级版本为 **v2.7.0**。升级前保留了完整 Git 历史备份；没有安装到现有宿主，也没有重启用户正在使用的应用。\r\n\r\n## 检查结论\r\n\r\n原有 20 个业务模块、25 个完整工作流及 WorkBuddy MCP App、DSH UI 插件、通用 Agent Skill 三种入口均保留。资料搜索、筛选、置顶、引用、下载及任务要求仍可使用。\r\n\r\n本次修复了 CI 复刻清单过期、安装失败破坏旧目录、备份字段遗漏、异常与日期校验不足、存储失败不提示、金额尾差、CSV 公式文本、目录符号链接越界和复制结果误报等问题。源码、构建产物、版本元数据、文档和安装包一起更新。\r\n\r\n## 发现与修复\r\n\r\n| 范围 | 原有问题 | 修复与证据 |\r\n|---|---|---|\r\n| 依赖 | 官方 npm 审计发现 5 个漏洞项，包含高危和严重项 | MCP SDK 更新至 1.32.1，更新 Zod 与相关传递依赖；同一官方源复审为 0 漏洞 |\r\n| CI | 依赖变化后源码 SHA-256 清单过时，使既有 CI 测试失败 | `check` 先构建并刷新复刻包，再逐项验证完整性；增加 Linux Node 20/22/24 和 Windows Node 24 检查 |\r\n| 版本 | 多处硬编码版本，容易出现宿主、Skill 与包版本不一致 | 版本从 `package.json` 同步生成，自动检查锁文件、插件、MCP App 和 Skill |\r\n| 文件写入 | 上传子目录、临时文件或工作流目录可能被符号链接指向工作区外 | 逐层检查普通目录、真实路径和临时文件；分块写入前复检；上传与工作流快照均有回归测试 |\r\n| 文件请求 | 非法分块与下载偏移需要在实际方法中再次校验 | 校验 Base64、长度、顺序、工作区归属和偏移；限制未完成上传数量；忙碌上传不被超时清理 |\r\n| 安装与卸载 | 旧实现可能在发现配置损坏之前替换已有应用 | Shell 与 PowerShell 共用先预检、暂存、独立备份、切换、失败回滚逻辑；保留其他 MCP 配置和用户自定义财务环境配置 |\r\n| JSON 备份 | 没有包含资料置顶和最近工作流；损坏条目可能导致界面出错 | 保留 v2 格式并补齐字段；校验日期、标识、状态、证据、金额与列表；旧备份缺可选字段时保留当前记录 |\r\n| 恢复过程 | 逐项写入失败可能留下一半恢复的数据 | 写入前保存恢复前副本；失败回滚已改字段；增加副本下载入口；权限持续拒绝导致回滚失败时明确告知 |\r\n| 本机存储 | 损坏数据及权限、容量错误被忽略；快速刷新可能丢主题 | 损坏原存储不被默认值覆盖；修改后立即保存；包括完全拒绝存储访问在内的故障显示备份提示 |\r\n| 异常闭环 | 已关闭异常删除证据后仍保持关闭 | 缺少处置证据时禁止关闭，删除证据后重新打开并记录操作 |\r\n| 金额和 CSV | 两位分值显示不稳定，浮点合计可能出现尾差，文本可能被表格当公式 | 金额按分处理、统一两位小数；公式样式文本加保护前缀 |\r\n| Widget | 复制失败仍可能报告成功，引用选择未进入实际指令 | 对发送和复制结果分别检查；引用子集与完整任务要求进入实际提示词；资料索引上限明确显示 |\r\n| 发布包 | npm 包缺配套卸载脚本与共用安装文件 | 补齐安装辅助文件、卸载脚本和文档；分别生成 macOS、Windows、Agent、npm 包及 SHA-256 清单 |\r\n\r\nMCP SDK 漏洞依据见 [GitHub 官方安全公告](https://github.com/advisories/GHSA-6qxp-vccf-f47h)。依赖更新保留 DSH 协议、MCP Apps 和 Preact 的现有兼容版本线，避免无证据切换宿主协议。\r\n\r\n## 验证记录\r\n\r\n- **54 项自动测试**：业务工具、上传防覆盖与越界、提示词、备份校验、损坏存储、拒绝存储、恢复回滚、安装器、复制、版本一致性、MCP stdio 和复刻包完整性。\r\n- `npm ci`、`npm run verify:release`、公开内容扫描、包内容检查和安装/卸载临时目录验收。\r\n- `npm run audit:deps` 使用官方 npm 源，结果为 **0 vulnerabilities**。原镜像审计接口不支持该请求，未将接口错误视为安全通过。\r\n- 桌面真实 Chromium：20 个模块可导航，25 个工作流可打开；25 份复制文本逐字等于源码组合器输出；填写的任务要求与引用资料进入启动指令。\r\n- 4 个主题切换后立即刷新，选择仍保留；合成收入 123.45、支出 23.40，利润显示 **100.05**。\r\n- 资料选择、搜索、置顶、引用、下载完成；下载内容与合成原文件完全一致。\r\n- 异常无证据不可关闭，补证后可关闭，删除证据后重新打开；CSV 可导出。\r\n- 备份包含置顶和最近记录；非法备份保留现状；有效备份恢复；恢复前副本可下载。\r\n- 模拟存储容量失败、损坏存储和两种复制方法同时失败，均显示实际失败提示。目标功能浏览器错误为 **0**。\r\n- **390px 窄屏**：页面、文档和内容宽度均为 390px，没有横向溢出。截图仅含合成数据。\r\n\r\nCI 配置已加入跨平台和 Node LTS 验证；GitHub 实际运行结果以升级 PR 的 Checks 为准。\r\n\r\n## 界面证据\r\n\r\n桌面：\r\n\r\n![v2.7.0 桌面工作台](images/v2.7.0-desktop.png)\r\n\r\n390px 窄屏：\r\n\r\n![v2.7.0 窄屏备份页面](images/v2.7.0-mobile.png)\r\n\r\n保存失败提示与导出入口：\r\n\r\n![v2.7.0 保存失败提示](images/v2.7.0-storage-warning.png)\r\n\r\n## 使用与恢复\r\n\r\n```bash\r\nnpm ci\r\nnpm run preview\r\n```\r\n\r\n在浏览器打开 `http://127.0.0.1:4173`。正式安装使用 [WorkBuddy 安装指南](INSTALL_WORKBUDDY.md)。旧版 JSON 备份仍使用 v2 格式，导入前先导出当前备份。\r\n\r\n安装器保留配置、应用和 Skill 的独立备份目录；不要在未核对之前清理这些副本。财务 JSON 备份包含设置与台账，不包含原始财务文件；原文件须另行保存。\r\n\r\n## 尚待宿主验收的部分\r\n\r\n独立 Widget 预览、MCP stdio 测试和临时目录安装已验证。真实 WorkBuddy / DSH 的插件加载、对话输入框填入、附件处理和 AI 实际执行仍需在对应宿主内验收，不能由独立预览替代。\r\n\r\nDSH 的旧 Shell 安装器针对现有 Web profile 布局；官方 Desktop 使用宿主管理入口。本次没有改动用户现有模型、登录状态、聊天记录、工作区或财务原件。\r\n\r\n代码提交与安装包生成不等于已合并 main 或正式发布 Release；下载页面在合并发布前仍以已发布版本为准。\r\n\n~~~~~~\n\n## docs/INSTALL_AGENT.md\n\nSHA-256: 85581517f4c6b67fe92e3ead232a7c1f0504dba892dc719faa304e1de4929dda\n\n~~~~~~text\n# AI Agent 安装指南\n\n本指南适用于 Codex、Claude Code 以及能够读取本地技能目录的其他智能体。它安装财务规则与 25 个工作流，**不安装图形界面**。WorkBuddy 用户请优先使用[完整可视化应用安装](INSTALL_WORKBUDDY.md)。\n\n## 安装前准备\n\n- 已安装 Git。\n- 能正常启动目标 AI Agent。\n- 先用演示数据试跑，不要直接拿真实银行流水测试。\n\n## WorkBuddy 只安装 Skill\n\n### macOS / Linux\n\n```bash\ngit clone https://github.com/zy6666688/workbuddy-finance-workbench.git\ncd workbuddy-finance-workbench\n./scripts/install-agent.sh workbuddy\n```\n\n脚本会安装到 `~/.workbuddy/skills/finance-workbench/`。如果已经存在旧版，会先移动到带时间戳的备份目录。此方式适合只需要工作流规则的用户；完整界面使用 [WorkBuddy MCP App 安装器](INSTALL_WORKBUDDY.md)。\n\n### Windows PowerShell\n\n```powershell\ngit clone https://github.com/zy6666688/workbuddy-finance-workbench.git\ncd workbuddy-finance-workbench\n.\\scripts\\install-agent.ps1 workbuddy\n```\n\n默认安装到 `$HOME\\.workbuddy\\skills\\finance-workbench`。\n\n### 验证\n\n重新打开 WorkBuddy，然后输入：\n\n```text\n请使用 finance-workbench，列出银行流水与账务明细核对所需的输入、规则、输出和人工复核点。暂时不要处理真实文件。\n```\n\n正确结果应包含字段统一、唯一匹配、疑似匹配、金额校验、异常清单和人工确认。\n\n## Codex 安装\n\n```bash\n./scripts/install-agent.sh codex\n```\n\n默认安装到 `${CODEX_HOME:-~/.codex}/skills/finance-workbench/`。重新启动 Codex 任务后，可以说：\n\n```text\n使用 finance-workbench 分析 examples/demo 下的虚构对账数据，先给执行预览，不要修改源文件。\n```\n\n## Claude Code 安装\n\n```bash\n./scripts/install-agent.sh claude\n```\n\n默认安装到 `${CLAUDE_HOME:-~/.claude}/skills/finance-workbench/`。\n\n## 自定义 Agent 目录\n\n```bash\n./scripts/install-agent.sh custom /你的/Agent/skills目录\n```\n\n如果智能体没有 Skill 目录，让它直接读取：\n\n```text\n请完整阅读 agents/finance-workbench/SKILL.md，按其中的安全边界和执行闭环完成任务。\n```\n\n## 手动安装\n\n把 `agents/finance-workbench` 整个目录复制到目标 Agent 的技能目录，文件夹名称保持为 `finance-workbench`。不要只复制 `SKILL.md`，因为工作流目录、规则和任务模板也需要一起保留。\n\n## 卸载与恢复\n\nmacOS / Linux：\n\n```bash\n./scripts/uninstall-agent.sh workbuddy\n```\n\n卸载脚本不会直接删除技能，而是把它移动到备份目录。若要恢复，把备份文件夹改回 `finance-workbench` 即可。\n\n## 能力差异\n\n| 能力 | WorkBuddy MCP App | DeepSeek Harness UI | AI Agent Skill |\n|---|---:|---:|---:|\n| 25 个工作流 | ✓ | ✓ | ✓ |\n| 规则、输出和验收清单 | ✓ | ✓ | ✓ |\n| 文件处理和结果生成 | 取决于 WorkBuddy 权限 | 取决于 DSH 权限 | 取决于 Agent 权限 |\n| 可视化首页与左侧导航 | ✓ | ✓ | — |\n| 资料库索引、引用和下载 | 当前 Widget 会话 | ✓ | 由 Agent 自身能力决定 |\n| 人工复核红线 | ✓ | ✓ | ✓ |\n\nAgent Skill 不会帮你配置模型账号，也不会读取 API Key。请在目标软件自己的设置页面中完成模型配置。\n\n~~~~~~\n\n## docs/INSTALL_DSH.md\n\nSHA-256: a1885fa1ecce5ab0ad42e18fb331665d9de78b5c0e711b1274d698ded68d8e8e\n\n~~~~~~text\n# DeepSeek Harness 完整工作台安装\n\n以下脚本适用于已有 `dsh.profile.bundles` 的 Web profile。Desktop 用户应通过当前宿主的插件管理入口安装，不要把 Web 配置或 node_modules 复制到 Desktop profile。该方式安装完整的可视化财务工作台。开始前请确认 DeepSeek Harness 已能正常打开。\n\n## 一键安装\n\n```bash\ngit clone https://github.com/zy6666688/workbuddy-finance-workbench.git\ncd workbuddy-finance-workbench\n./scripts/install-dsh.sh\n```\n\n安装脚本会：\n\n1. 检查 Node.js、npm、pnpm 和 DeepSeek Harness `web` profile。\n2. 运行自动化测试和生产构建。\n3. 备份 profile 的 `package.json`。\n4. 把当前仓库作为本地插件依赖加入 profile。\n5. 在 `dsh.profile.bundles` 中注册 `dsh-finance-workbench`。\n6. 执行 `pnpm install`。\n\n脚本不会删除已有插件，也不会自动清理财务资料。\n\n## 安装前预检\n\n只检查，不修改：\n\n```bash\n./scripts/install-dsh.sh --dry-run\n```\n\n指定其他 profile：\n\n```bash\n./scripts/install-dsh.sh --profile my-profile\n```\n\n## 让新插件生效\n\n若 DeepSeek Harness 正在运行，先保存当前会话，再按你原来的方式重启服务。打开页面后，左侧应出现“财务工作台”。\n\n> 安装脚本不会强制重启，避免中断正在进行的工作。\n\n## 验证清单\n\n- 页面能正常打开，浏览器控制台没有财务工作台相关错误。\n- 左侧出现“财务工作台”。\n- 顶部可以切换 4 套主题，刷新页面后仍保留选择。\n- 首页显示 25 个专业工作流。\n- 首页“今日财务节奏”能显示异常、待办、月结和经营数据完整度。\n- “异常控制台”可登记来源、金额、责任人和截止日；未填处置证据时不能关闭异常。\n- 业务模块能显示与场景对应的财务复核断言。\n- 待办可新增、完成和恢复。\n- 财务资料库可搜索、筛选、引用和下载。\n- 月结清单可勾选并计算完成度。\n- 设置可以导出 JSON 备份。\n- 390px 窄窗口下没有横向溢出。\n\n## 更新\n\n```bash\ncd workbuddy-finance-workbench\ngit pull --ff-only\nnpm ci\nnpm run check\n```\n\n然后保存工作并重启 DeepSeek Harness。\n\n## 恢复旧配置\n\n安装脚本会在 profile 目录生成类似文件：\n\n```text\npackage.json.finance-workbench-backup-20260821-120000\n```\n\n如需恢复，先停止 DeepSeek Harness，把备份文件复制回 `package.json`，再在该 profile 目录执行 `pnpm install`。恢复前请保留当前配置副本。\n\n## 从 GitHub Release 安装\n\n发布时会提供 `dsh-finance-workbench-2.7.0.tgz`。这是构建完成的 npm 安装包，适合不想在目标机器编译源码的用户。下载后可在 profile 目录安装：\n\n```bash\npnpm add /下载目录/dsh-finance-workbench-2.7.0.tgz\n```\n\n还需要确认 profile 的 `dsh.profile.bundles` 中包含 `dsh-finance-workbench`。新手建议优先使用一键安装脚本。\n\n~~~~~~\n\n## docs/INSTALL_WORKBUDDY.md\n\nSHA-256: b0302d1c3dd2ce8e79084a15046e17ad391250b3aafc64647f4b9c756095cb9a\n\n~~~~~~text\n# ZY 财务工作台安装指南\n\n本指南适用于 zy6666688 个人维护版。首次使用请同时阅读[使用说明书](USER_GUIDE.md)。\n\n本指南安装的是 **可在 WorkBuddy 内打开的完整图形工作台**，同时安装配套的 `finance-workbench` Skill。只想给其他 AI Agent 安装规则库，请看 [通用 Skill 安装](INSTALL_AGENT.md)。\n\n![安装完成后打开的财务工作台](images/readme-hero.png)\n\n## 你最终会得到什么\n\n| 内容 | 用途 | 默认位置 |\n|---|---|---|\n| WorkBuddy MCP App | 在对话中打开完整图形工作台 | `~/.workbuddy/apps/finance-workbench/` |\n| finance-workbench Skill | 让 AI 理解财务规则、输入输出和复核边界 | `~/.workbuddy/skills/finance-workbench/` |\n| MCP 配置项 | 告诉 WorkBuddy 如何启动图形应用 | `~/.workbuddy/.mcp.json` 中的 `finance-workbench` |\n\n安装过程只有四步：\n\n```mermaid\nflowchart LR\n  A[下载个人版源码 ZIP] --> B[运行安装器]\n  B --> C[保存并重开 WorkBuddy]\n  C --> D[输入“打开财务工作台”]\n```\n\n## 安装前准备\n\n- WorkBuddy 可以正常打开。\n- 安装 [Node.js 20 或更高版本](https://nodejs.org/zh-cn/download)，终端执行 `node --version` 能看到版本号。\n- 保存 WorkBuddy 中正在编辑但尚未发送的内容。\n\n### 不知道是否安装了 Node.js\n\nmacOS 打开“终端”，Windows 打开 PowerShell，输入：\n\n```text\nnode --version\n```\n\n- 看到 `v20.x.x`、`v22.x.x` 或更高版本：可以继续。\n- 提示找不到 `node`：打开 [Node.js 下载页](https://nodejs.org/zh-cn/download)，安装 LTS 版本后关闭并重新打开终端。\n- 看到 `v18.x.x` 或更低：升级 Node.js 后再安装。\n\n## macOS：双击安装\n\n1. 下载[个人版源码 ZIP](https://github.com/zy6666688/workbuddy-finance-workbench/archive/refs/heads/main.zip)。\n2. 解压并进入 `workbuddy-finance-workbench-main` 文件夹。\n3. 双击 `安装 WorkBuddy 财务工作台.command`。\n4. 看到“安装完成”后，完全退出 WorkBuddy，再重新打开。\n5. 输入 `打开财务工作台`。\n\n如果 macOS 第一次阻止打开脚本，请右键该文件，选择“打开”，再确认一次。\n\n安装窗口末尾应看到类似文字：\n\n```text\n安装完成。请先保存 WorkBuddy 中正在编辑的内容，然后完全退出并重新打开 WorkBuddy。\n重新打开后输入：打开财务工作台\n```\n\n看到这两行才表示文件与配置已经写入完成。不要在安装脚本仍运行时关闭窗口。\n\n## Windows：PowerShell 安装\n\n1. 下载[个人版源码 ZIP](https://github.com/zy6666688/workbuddy-finance-workbench/archive/refs/heads/main.zip)，解压并进入 `workbuddy-finance-workbench-main` 文件夹。\n2. 在解压目录空白处按住 Shift 并右键，选择“在此处打开 PowerShell”。\n3. 执行：\n\n```powershell\npowershell -ExecutionPolicy Bypass -File .\\scripts\\install-workbuddy-app.ps1\n```\n\n4. 完全退出并重新打开 WorkBuddy，输入 `打开财务工作台`。\n\n如果 PowerShell 提示脚本执行受到限制，请确认使用的是上面包含 `-ExecutionPolicy Bypass` 的完整命令；它只对本次命令生效，不会永久修改系统策略。\n\n## macOS / Linux：命令行安装\n\n```bash\ngit clone https://github.com/zy6666688/workbuddy-finance-workbench.git\ncd workbuddy-finance-workbench\n./scripts/install-workbuddy-app.sh\n```\n\n只做检查、不修改文件：\n\n```bash\n./scripts/install-workbuddy-app.sh --dry-run\n```\n\n## 安装器具体做了什么\n\n1. 检查 Node.js、安装包、MCP 配置结构和服务端语法；不完整或损坏时保留原安装。\n2. 在临时目录准备应用、Skill 和新配置。\n3. 备份旧目录和配置，再切换到新版本；备份名称带唯一后缀，连续更新不会覆盖旧副本。\n4. 只更新财务工作台的启动入口，保留其他 MCP 服务、顶层配置和财务工作台自定义环境项。\n5. 若切换中发生错误，恢复旧目录；若配置被其他程序同时修改，终止本次安装并保留该修改。\n\nShell 和 PowerShell 都调用随包提供的 `scripts/workbuddy-install.mjs`；请保留整个解压目录，不要只复制一个脚本。\n\n安装器不会读取财务资料或密钥，也不会删除其他 MCP 配置，更不会强制重启 WorkBuddy。\n\n### 为什么需要完全退出再打开\n\nWorkBuddy 通常在启动时读取 MCP 配置。只关闭当前对话或窗口可能不会重新加载服务。请先保存未发送内容，再从菜单完全退出应用，然后重新打开。安装器刻意不替你执行这一步，避免打断正在进行的工作。\n\n## 安装后验证\n\n在 WorkBuddy 输入：\n\n```text\n打开财务工作台\n```\n\n正确结果应同时满足：\n\n- 出现可操作的财务工作台，而不是只有一段文字说明。\n- 左侧可访问 20 个模块，顶部可进入待办、月结、资料库和工作流。\n- 可切换 4 套主题，正文和按钮字号清晰。\n- 点击工作流“带入对话，确认发送”后，结构化指令进入 WorkBuddy 输入框；发送前可以核对附件。\n\n### 推荐的第一次练习\n\n1. 先不要上传真实资料。\n2. 输入 `打开财务工作台`，进入“工作流”。\n3. 选择“银行流水与账务明细核对”。\n4. 查看输入材料、关键规则、7 步路径、固定输出包和验收清单。\n5. 点击“带入对话，确认发送”，确认 WorkBuddy 输入框出现结构化任务；此时仍由你决定是否发送。\n6. 需要练习文件时，使用仓库 `examples/demo/` 中的虚构数据。\n\n## 更新\n\n下载新版安装包后，重新运行安装脚本即可。旧应用、Skill 和 MCP 配置都会保留带时间戳的备份。\n\n更新后请重新打开 WorkBuddy，并核对源码 package.json 或发布包版本。台账与设置升级前建议先在“数据备份”导出 JSON。\n\n## 卸载\n\nmacOS 双击 `卸载 WorkBuddy 财务工作台.command`，或执行：\n\n```bash\n./scripts/uninstall-workbuddy-app.sh\n```\n\nWindows：\n\n```powershell\npowershell -ExecutionPolicy Bypass -File .\\scripts\\uninstall-workbuddy-app.ps1\n```\n\n卸载只移除 `.mcp.json` 中的 `finance-workbench` 项；应用和 Skill 会移动到 `.uninstalled-时间戳` 目录，方便恢复。\n\n### 恢复卸载前版本\n\n1. 完全退出 WorkBuddy。\n2. 在 `~/.workbuddy/` 中找到 `.mcp.json.finance-workbench-uninstall-backup-时间戳`。\n3. 先给当前 `.mcp.json` 再留一份副本，然后把备份复制回 `.mcp.json`。\n4. 把对应的 `finance-workbench.uninstalled-时间戳` 文件夹改名为 `finance-workbench`。\n5. 重新打开 WorkBuddy。\n\n不熟悉文件恢复时，建议保留这些备份并在 GitHub Issue 中附上**脱敏后的报错文字**；不要上传完整 `.mcp.json`，其中可能包含其他服务配置。\n\n## 常见问题\n\n### 输入“打开财务工作台”后只有文字\n\n先确认 WorkBuddy 已完全退出并重新打开，再检查 `~/.workbuddy/.mcp.json` 中是否有 `finance-workbench`。如果终端提示 Node.js 版本过低，请升级到 20+ 后重新安装。\n\nmacOS 可在 Finder 按 `Command + Shift + G`，输入 `~/.workbuddy/` 后回车。Windows 可在文件资源管理器地址栏输入 `%USERPROFILE%\\.workbuddy`。查看配置时只确认是否存在 `finance-workbench` 字样，不要把完整文件发到公开网络。\n\n### 双击 `.command` 后窗口立即关闭\n\n常见原因是 Node.js 未安装或安装包不完整。打开终端，进入解压目录后执行：\n\n```bash\n./scripts/install-workbuddy-app.sh --dry-run\n```\n\n预检会直接说明缺少的项目，并且不会修改配置。\n\n### 页面空白或提示资源加载失败\n\n重新下载个人版源码 ZIP并再安装一次。发布包内必须同时包含 `workbuddy/server.mjs` 和 `workbuddy/widget.html`；不要只复制 `.command` 文件。\n\n### 工作流按钮没有直接发送\n\n这是有意的人工确认步骤。按钮只把任务填入输入框，方便你核对任务范围、期间和附件后再发送。\n\n### 数据保存在哪里\n\n工作台台账与设置默认在 WorkBuddy Widget 的浏览器本机存储中。建议定期从“数据备份”导出 JSON；原始附件不写入该备份。\n\n## 寻求帮助时请提供什么\n\n- 操作系统和版本，例如 macOS 15 或 Windows 11。\n- WorkBuddy 版本。\n- `node --version` 输出。\n- 你执行到哪一步、屏幕上出现的完整错误文字。\n- 是否已经完全退出并重新打开 WorkBuddy。\n\n请先遮盖姓名、公司名、本机用户名、文件路径、Token、Cookie、银行账号和任何真实财务数据，再提交到 [GitHub Issues](https://github.com/zy6666688/workbuddy-finance-workbench/issues)。\n\n~~~~~~\n\n## docs/REPRODUCE.md\n\nSHA-256: 76c4966ec6d097518bb71851844ba6eee8406e4fdb87d6ab9c419f5d7bbb5fe9\n\n~~~~~~text\n# 财务工作台：源码与 AI 复刻指南\n\n## 先选一种方式\n\n1. **最推荐：源码 + 总提示词。** 用 GitHub 的 Code → Download ZIP 下载并解压整个仓库，把文件夹交给 Codex / Claude Code 等能读文件的 AI，再复制 [总提示词](reproduce/MASTER_PROMPT.md)。\n2. **一键复制。** 下载 [离线提示词中心](reproduce/index.html)：打开 GitHub 文件页，选择 Download raw file，保存为 index.html 后双击。页面提供总提示词、总提示词加全部源码、25 套完整工作流提示词的复制按钮和搜索。\n3. **AI 只支持附件。** 上传 [源码上下文](reproduce/source-context.md) 和 [完整性清单](reproduce/manifest.json)，再粘贴总提示词。文件较大，若超出上下文，请让 AI 分批读取本地目录，不要截断源码后要求精确复刻。\n\n财务仓库为公开开源项目。本次在原仓库上增量优化，保留既有安装方式、历史与通用 Agent Skill。\n\n## 一段可以直接复制给 AI 的启动指令\n\n```text\n请读取我提供的整个工作台仓库。\n先完整执行 docs/reproduce/MASTER_PROMPT.md，\n以 src/ 和 package-lock.json 为精确复刻基准。\n不要重新设计界面或省略任何模块。\n完成构建、测试、中文安装指南和桌面/窄屏实际验证；\n缺少宿主环境的验收项单独列出，保留我的原始文件与配置。\n```\n\n## 准备材料\n\n- 本仓库全部文件（不要只下载 README 或一张截图）。\n- Node.js 20 或以上，以及 npm。\n- DeepSeek Harness 或 WorkBuddy；选择对应安装文档，不要把通用 Skill 当作完整图形界面。\n- 合成或脱敏的验收样例；请勿把学生信息、真实票据、客户账目与登录凭据提交到仓库。\n- 若要与原界面严格对照，提供相同窗口尺寸、系统字体、主题和宿主版本。\n\n## 源码定位\n\n| 文件或目录 | 作用 |\n| --- | --- |\n| src/client.jsx | DSH 客户端入口、宿主集成、资料与工作流交互 |\n| src/finance-dashboard.jsx | 工作台布局、模块和界面行为 |\n| src/finance-data.js | 25 套工作流数据源 |\n| src/task-prompt.js | 完整提示词组合规则，不应手工缩写 |\n| src/workflow-tools.js | 任务信息、资料匹配等工作流辅助规则 |\n| src/index.js / src/contract.js | 后端注册与协议 |\n| build.mjs / cordis.patch.yml | 构建与 DSH 插件注册 |\n| package-lock.json | 依赖锁文件，复现时使用 npm ci |\n| test/ | 回归测试 |\n| scripts/generate-reproduction.mjs | 从实际源码生成本复刻包 |\n| src/workbuddy-widget.jsx / src/workbuddy-mcp-server.mjs | WorkBuddy 图形界面和 MCP 服务 |\n\n## 本地构建与文档更新\n\n```bash\ngit clone https://github.com/zy6666688/workbuddy-finance-workbench.git\ncd workbuddy-finance-workbench\nnpm ci\nnpm run verify:release\nnode scripts/generate-reproduction.mjs\n```\n\n完整提示词来自与界面相同的组合函数，因此角色、输入材料、执行约束、输出要求和验收标准保持一致。修改源码后重新运行生成器；manifest.json 的 SHA-256 校验的是 UTF-8 文件原文。生成物不包含 node_modules、宿主会话、真实业务资料或登录凭据。\n\n## 安装、使用与验收\n\n按 [DSH 安装指南](INSTALL_DSH.md)、[WorkBuddy 安装指南](INSTALL_WORKBUDDY.md) 或 [通用 Agent 安装指南](INSTALL_AGENT.md) 选择入口。\n\n1. 安装前备份原插件与配置；退出宿主前保存工作。\n2. 使用示例数据打开全部模块，检查主题、滚动、表单及 390px 窄屏布局。\n3. 创建并完成一条示例待办；检查刷新后的持久化。\n4. 上传一个合成文件，检查搜索、引用、下载及同名上传不覆盖。\n5. 对每个工作流检查完整提示词；至少实际触发一次 AI 任务。\n6. 验证备份与恢复。AI 只应生成待复核成果，付款、入账和申报仍由人确认。\n7. 报告已完成项、失败项、宿主依赖和可恢复步骤。\n\n## 常见问题\n\n**GitHub 页面里的复制按钮在哪里？** GitHub 预览不执行 HTML。先下载 index.html 再用浏览器打开；Markdown 提示词也可直接选中复制。\n\n**复制按钮没有成功？** 页面优先使用系统剪贴板，失败时尝试兼容方式；仍失败会显示可手动复制的文本框。仅在复制成功后提示“已复制”。\n\n**源码包太长？** 让能读本地文件的 AI 直接使用仓库；只复制总提示词即可。不要为了长度删掉源码文件。\n\n**能保证任意 AI 从一句话画出完全相同的界面吗？** 精确复刻依赖同一份源码和锁文件；自由重写不保证相同。保留原源码构建最可靠，宿主版本和系统字体仍可能造成显示差异。\n\n**与原先发布版有什么区别？** 本次同步本地 2.6.0 源码、任务工作流增强和并发同名上传保护，新增完整复刻包；README 中已有截图/旧 Release 不自动代表本次源码版本。获取本次内容请下载默认分支源码。\n\n~~~~~~\n\n## docs/TEST_REPORT_2.7.1.md\n\nSHA-256: 581096e999a779f112d240d0eeef9ada22bdf46ad32da77d746996cb8323b7d0\n\n~~~~~~text\n# ZY 财务工作台 2.7.1 测试报告\n\n测试日期：2026-10-26。环境：Windows、Node.js 24.19.0、Microsoft Edge。使用虚构数据。\n\n## 结论\n\n个人版的生产构建、54 项自动测试、MCP 协议调用、隔离目录安装/卸载与浏览器交互验证通过。依赖审计为 0 项已知漏洞。可以作为财务任务组织与 AI 工作流入口使用。\n\n**本次没有在真实 WorkBuddy 会话里完成“添加附件—模型分析—生成财务文件”的全链路验收，也没有验证 DeepSeek Harness 的真实宿主集成。** 这部分需要安装后按[使用说明书](USER_GUIDE.md)试跑。独立预览成功不代表 AI 已经完成预算计算。\n\n## 自动验证\n\n| 项目 | 实际结果 |\n|---|---|\n| `npm ci` | 依赖按锁文件安装成功 |\n| `npm run verify:release` | 通过，包含构建、目录生成、测试、安全扫描和发布清单检查 |\n| 自动测试 | 54 通过，0 失败，0 跳过 |\n| MCP 调用 | 可列举工具、读取 Widget、调用 `show_finance_workbench`；返回 20 模块、25 工作流、25 提示词 |\n| 安装/更新/卸载 | 隔离目录验证通过；保留其他 MCP 配置，覆盖失败和回滚场景；包含 Windows PowerShell 包装器测试 |\n| 备份和金额逻辑 | 备份往返、损坏数据拒绝、写入回滚、金额精度和异常关闭证据检查通过 |\n| Widget 大小 | 230,701 字节，小于 256 KiB 上限 |\n| 公开资料扫描 | 通过 |\n| `npm run audit:deps` | 0 项已知漏洞；审计结果仅代表测试时的依赖数据库 |\n\nWindows 完整发布校验通过 Git Bash 执行；本机 npm 只有 Windows 命令入口，因此验证时使用了临时 npm 启动桥接。该桥接不包含在项目或安装包中。普通用户运行 PowerShell 安装器即可。\n\n## 实际浏览器验证\n\n| 操作 | 观察到的结果 |\n|---|---|\n| 桌面首页 | 显示 ZY 财务工作台、版本 2.7.1，导航可操作 |\n| 经营快照 | 输入收入 100,000、支出 60,000，保存后利润为 40,000；重新加载后保留 |\n| 工作流搜索 | 25 个工作流中搜索“预算”返回 5 个相关场景，可打开 17 号预算执行与偏差分析 |\n| 任务发起 | 填写虚构主体和期间后点击带入对话；独立预览将 1,102 字符的任务指令复制到剪贴板，包含主体、预算场景和校验要求 |\n| 主题 | 夜航深色与雾光靛蓝切换成功 |\n| 390 × 844 窄屏 | 导航可关闭；预算任务表单按单列显示，页面宽度 390，无整页横向溢出 |\n| 浏览器日志 | 检查期间未捕获 warning/error |\n\n测试发现原 WorkBuddy 构建未包含 `WORKBENCH_POLISH_CSS`，导致任务表单和筛选按钮缺少样式。个人版已将样式拆成共享模块并同时打入 WorkBuddy 与 DSH 构建，修复后重新验证。\n\n### 桌面截图\n\n![桌面首页，金额为虚构测试数据](images/zy-desktop.png)\n\n### 窄屏截图\n\n![390 像素预算任务表单](images/zy-mobile.png)\n\n## 修改范围与保留事项\n\n- 首页标题、工作台标识、插件维护者、仓库和下载入口改为 zy6666688 个人版。\n- 删除 README 底部微信推广和二维码文件；历史提交仍由 Git 保存。\n- 新增中文使用说明书、测试报告；保留原 MIT 许可、上游来源和原始财务复核要求。\n- 内部应用标识、存储键和安装目录保持兼容，避免影响原有数据和配置。\n- 此次没有新增预算计算引擎；工作流计算与实际财务交付需要宿主 AI 执行并由人复核。\n\n~~~~~~\n\n## docs/TROUBLESHOOTING.md\n\nSHA-256: 838c46c4aa0cc326d74182ac6c6108282dcda5008a0c9fc0acb28e04fe6aea2b\n\n~~~~~~text\n# 常见问题与排障\r\n\r\n## WorkBuddy 没有识别技能\r\n\r\n1. 确认目录为 `~/.workbuddy/skills/finance-workbench/SKILL.md`。\r\n2. 确认复制的是整个目录，不只是一个文件。\r\n3. 完全退出并重新打开 WorkBuddy。\r\n4. 明确说“请使用 finance-workbench”。\r\n\r\n## DeepSeek Harness 没有出现入口\r\n\r\n```bash\r\ncd workbuddy-finance-workbench\r\nnpm run check\r\n./scripts/install-dsh.sh --dry-run\r\n```\r\n\r\n检查 profile 的 `package.json`：\r\n\r\n- `dependencies` 中有 `dsh-finance-workbench`。\r\n- `dsh.profile.bundles` 中有 `dsh-finance-workbench`。\r\n\r\n保存工作后再重启 DeepSeek Harness。\r\n\r\n## 页面显示旧版本\r\n\r\n重新执行 `npm run build`，再刷新页面。仍未更新时，保存当前工作后重启服务。\r\n\r\n## 文件无法上传\r\n\r\n- 检查文件格式是否受支持。\r\n- 检查工作区是否可写。\r\n- 避免文件名包含路径分隔符或 `..`。\r\n- 不要把密码保护或来源不明的文件直接交给 Agent。\r\n\r\n## JSON 备份无法恢复\r\n\r\n只接受本项目导出的 v2 JSON 备份，单份上限 5 MB。系统会逐项检查主体期间、待办日期、记录标识、金额、日志时间和异常处置证据。请按界面中的错误位置检查备份，原数据不会因为校验失败被替换。\r\n\r\n旧 v2 备份仍可导入；没有资料置顶或最近工作流字段时，保留当前对应记录。恢复前自动保留一份完整副本，可在“数据备份”中点击“下载恢复前副本”。\r\n\r\n## 出现“本机保存未完成”\r\n\r\n当前修改仍在界面内，刷新或退出可能丢失。立即点击“导出 JSON 备份”，检查浏览器 / Widget 是否允许本机存储，以及空间是否充足。数据无法读取时不会自动覆盖损坏的存储。\r\n\r\n## 工作流复制失败\r\n\r\n先点击“复制完整提示词”。若仍提示复制受限，展开提示词并手动全选复制。Widget 不会把发送和复制失败显示为成功。\r\n\r\n## 只想本机预览\r\n\r\n```bash\r\nnpm ci\r\nnpm run preview\r\n```\r\n\r\n打开 http://127.0.0.1:4173。财务台账和设置只保存在该预览来源的本机存储，工作流指令由你粘贴到 AI 对话执行。不同宿主 / 端口之间通过 JSON 备份迁移数据。\r\n\r\n## Agent 直接给结论，没有执行文件处理\r\n\r\n补充以下要求：\r\n\r\n```text\r\n先列执行预览与缺失资料；确认后处理副本；输出主结果、异常明细、金额校验和处理日志；所有无法确认的项目标注需人工复核。\r\n```\r\n\r\n## 安全提醒\r\n\r\n遇到付款、入账、申报、会计政策或重大估计问题时，不要要求 Agent 自动确认。真实凭据或财务资料不要贴到公开 Issue。\r\n\n~~~~~~\n\n## docs/USER_GUIDE.md\n\nSHA-256: 21ec2ea6b398e5a455d41594ad48f2750ba57f83449b13a481d588239f105359\n\n~~~~~~text\n# ZY 财务工作台使用说明书\n\n适用版本：2.7.1 · 维护者：zy6666688\n\n## 1. 先了解它能做什么\n\n这是一个财务工作台，包含 20 个业务模块、25 个 AI 工作流、资料索引、待办、异常管理和本机备份。工作台负责组织任务和复核要求；实际读取附件、分析财务数据、制作报表由 WorkBuddy 中的 AI 执行。\n\n**它还不是一套内置确定性预算计算引擎。** 工作流中的预算规则、金额核对和交付要求是给 AI 的指令，不代表程序已经完成计算。界面上的经营快照来自你手工录入的汇总数。需要自动填表、公式计算或凭证生成时，应在任务中明确要求 AI 提供实际文件、计算过程和校验结果。\n\n## 2. Windows 安装\n\n1. 确认 WorkBuddy 可以打开，安装 Node.js 20 或更高版本。\n2. 下载[本账号仓库的源码 ZIP](https://github.com/zy6666688/workbuddy-finance-workbench/archive/refs/heads/main.zip)。\n3. 解压并进入 `workbuddy-finance-workbench-main`，确认能看到 `scripts`、`workbuddy` 和 `agents` 文件夹。\n4. 在该文件夹打开 PowerShell，运行：\n\n```powershell\npowershell -ExecutionPolicy Bypass -File .\\scripts\\install-workbuddy-app.ps1\n```\n\n5. 看到“安装完成”后，保存正在编辑的内容，完全退出并重新打开 WorkBuddy。\n6. 输入：**打开财务工作台**。\n\n仓库包含预构建文件，普通安装不要求执行 npm 安装依赖。安装器会备份原有配置与同名应用，保留其他 MCP 服务。Mac、Linux、更新和卸载详见[安装指南](INSTALL_WORKBUDDY.md)。\n\n如果只是独立浏览界面，在源码目录执行 `npm ci`、`npm run preview`，打开终端提供的本机地址。独立预览不会连接 AI；工作流指令需要复制到 AI 对话执行。\n\n## 3. 第一次使用的顺序\n\n1. 打开“系统设置”，填写主体、期间和重要性阈值，选择主题。\n2. 在“财务总览”填写本期汇总指标。先用虚构数据熟悉界面。\n3. 在“资料库”选择文件，检查名称、分类、筛选和置顶。\n4. 在“工作流”选择相应业务，先看输入要求、执行步骤和验收清单。\n5. 点击“带入对话，确认发送”，检查主体、期间和任务要求，**在 WorkBuddy 对话中再次添加原始附件**，然后发送。\n6. 检查 AI 是否交付了真实文件、来源定位和校验记录，再进行业务复核。\n\n资料库选择文件只建立当前会话索引，不等于附件已发送给 AI，也不等于 Excel 已被解析。独立预览与 WorkBuddy 的本机存储互相独立。\n\n## 4. 用预算场景试跑一次\n\n进入预算模块或在“工作流”搜索“预算”，选择预算执行相关工作流。准备预算与实际明细，至少写清期间、部门/项目、科目和金额。若涉及销量、单价或产品结构，补充对应数量和单价字段；没有字段时不要要求 AI 凭空归因。\n\n可在 WorkBuddy 中使用下面这段话，并附上你准备的 Excel 或 CSV：\n\n> 请按财务工作台的预算分析工作流处理这些附件。先列出文件、工作表、字段映射和缺失信息，再用 20–50 行试跑。金额按人民币，列明单位和正负号约定。预算偏差先按“实际－预算”计算，收入与费用分别解释有利或不利；预算为零时差异率标为“不适用”。不要补造缺失数据。请交付预算对比表、计算公式或脚本、校验清单和异常明细，说明各项金额能否与原表汇总一致。待我复核样本后再处理全量。\n\n复核时至少检查：\n\n| 检查项 | 应看到的证据 |\n|---|---|\n| 范围一致 | 相同主体、期间、币种、单位、含税口径；排除预算和实际重复行 |\n| 金额一致 | 预算、实际、差额分别与来源汇总一致，注明舍入容差 |\n| 计算可重做 | 输出中的公式或脚本能用同一输入重复得到结果 |\n| 归因有依据 | 单价/数量等归因指向来源字段；缺失时明确无法归因 |\n| 异常可追踪 | 异常有来源行、责任人、处理期限和处置证据 |\n\n试跑可以使用仓库 `examples/demo/` 的虚构材料；先阅读其中的 README 确认文件适合所选场景。测试界面并不能证明你自己的预算口径正确。\n\n## 5. 日常操作与备份\n\n- **工作流**：搜索场景、查看完整提示词、收藏、带入对话。\n- **资料库**：选择文件、搜索、筛选、引用、下载和置顶；原始文件应另行妥善保存。\n- **待办/月结**：记录责任和期限，按实际完成情况更新状态。\n- **异常管理**：补齐来源、责任人和处置证据；不能只因为 AI 给出解释就关闭异常。\n- **数据备份**：定期导出 JSON。备份包含工作台台账与设置，不含原始附件。恢复前保留当前备份，确认导入文件来源。\n\n## 6. 常见问题\n\n| 情况 | 处理方式 |\n|---|---|\n| 只回复文字，未打开界面 | 确认安装完成并完全重开 WorkBuddy；检查 MCP 中是否有 `finance-workbench` |\n| 找不到 Node.js | 安装 Node.js 20+，重开 PowerShell 后运行 `node --version` |\n| 文件已选，但 AI 没有读取 | 在 WorkBuddy 输入框重新附上原文件；索引不等于上传 |\n| 预览点击后没有 AI 结果 | 独立预览只复制指令；需粘贴到有模型的 AI 对话 |\n| 更新后数据似乎消失 | 确认打开的是同一宿主/地址；不同浏览器存储不共享，用之前导出的 JSON 恢复 |\n| 页面空白 | 确认下载完整，存在 `workbuddy/server.mjs` 和 `workbuddy/widget.html`；按安装指南重新安装 |\n\n更多问题见[排障指南](TROUBLESHOOTING.md)。\n\n## 7. 测试范围、维护与来源\n\n个人版测试记录见[2.7.1 测试报告](TEST_REPORT_2.7.1.md)。本机界面、协议和隔离安装验证，与真实 WorkBuddy 会话中的 AI 附件分析是不同验收步骤；报告会分别标明。\n\n个人版仓库：[zy6666688/workbuddy-finance-workbench](https://github.com/zy6666688/workbuddy-finance-workbench)。基于 [feng-liu-1994 的原项目](https://github.com/feng-liu-1994/workbuddy-finance-workbench) 修改，遵循 [MIT 许可证](../LICENSE)。\n\n付款、入账、纳税申报、薪资发放和重大判断仍需人工复核。向公开仓库反馈问题时，只提供脱敏错误信息，不提交真实财务附件或访问凭据。\n\n~~~~~~\n\n## docs/releases/v2.0.0.md\n\nSHA-256: 928b54628c490337345924a8ba6d6ca58761eee8159810338b8c9605d56957f1\n\n~~~~~~text\n# WorkBuddy 财务工作台 v2.0.0\r\n\r\n首个完整开源版本，面向财务人员和 AI Agent。\r\n\r\n## 亮点\r\n\r\n- 11 个财务工作台模块，桌面与手机响应式适配。\r\n- 22 个标准财务自动化场景和 3 个专业扩展场景。\r\n- 工作流均包含输入、规则、7 步路径、输出、验收清单和人工复核边界。\r\n- 资料库支持上传、文件夹导入、搜索、筛选、置顶、引用和下载。\r\n- 月结证据清单、待办管理、字段字典、业务阈值和 JSON 备份。\r\n- WorkBuddy、Codex、Claude Code 和通用 AI Agent Skill。\r\n- macOS/Linux Shell、Windows PowerShell 和 DeepSeek Harness 安装脚本。\r\n- 22 项自动化测试、GitHub Actions、公开脱敏扫描和虚构演示数据。\r\n\r\n## 下载哪个文件\r\n\r\n- `finance-workbench-agent-v2.0.0.zip`：WorkBuddy 或其他 AI Agent 用户。\r\n- `dsh-finance-workbench-2.0.0.tgz`：DeepSeek Harness npm 插件包。\r\n- `SHA256SUMS.txt`：下载后校验文件完整性。\r\n- GitHub 自动生成的 Source code：开发者查看和二次开发。\r\n\r\n完整新手安装步骤见仓库 README。\r\n\r\n## 安全说明\r\n\r\n发布物仅含通用源码、虚构示例和脱敏截图，不包含真实财务资料、个人身份信息、本机路径、Token、Cookie、密码或 API Key。付款、入账、纳税申报和重大判断仍必须由授权人员复核。\r\n\n~~~~~~\n\n## docs/releases/v2.1.0.md\n\nSHA-256: 513f3d29d044cfd77b380d6252a3234e960d7c28f94ec70a962dc7097bbcc2ac\n\n~~~~~~text\n# WorkBuddy 财务工作台 v2.1.0\r\n\r\n这是一次面向真实财务工作的专业化升级。完整界面现已覆盖 19 个模块，并保留 v2.0.0 的资料库、待办、月结和 25 个 AI 工作流。\r\n\r\n## 本版亮点\r\n\r\n- 19 个模块：财务总览、收入、应收、应付、报销、资金、预算、资产、税务、发票、工资、对账、成本、报表、分析、投资、审计、备份和设置。\r\n- 经营快照：录入汇总数后自动计算利润并绘制近 6 期收支趋势。\r\n- 专业业务页：每个模块都有 4 步处理链路、至少 4 个关键控制、固定交付物和适用工作流。\r\n- 操作留痕：最近 200 条关键动作保存在本机，可单独导出。\r\n- 新手友好：分组侧栏、顶部高频入口、独立备份恢复说明，以及桌面和手机响应式布局。\r\n\r\n截图中的名称、金额和业务内容均为虚构演示数据。\r\n\r\n## 下载哪个文件\r\n\r\n- `finance-workbench-agent-v2.1.0.zip`：WorkBuddy、Codex、Claude Code 或其他支持 Skill 的 AI Agent。\r\n- `dsh-finance-workbench-2.1.0.tgz`：DeepSeek Harness 完整图形工作台。\r\n- `SHA256SUMS.txt`：下载后校验文件是否完整。\r\n\r\n## 安装\r\n\r\n- 完整界面：[DeepSeek Harness 安装指南](../INSTALL_DSH.md)\r\n- AI Agent：[WorkBuddy / Codex / Claude / 通用 Agent 安装指南](../INSTALL_AGENT.md)\r\n\r\n升级前建议先在“数据备份”导出 JSON。v2.1.0 继续识别 v2.0.0 的备份格式；旧备份中没有经营快照和审计日志时，会以空列表安全恢复。\r\n\n~~~~~~\n\n## docs/releases/v2.2.0.md\n\nSHA-256: b29f68ff59a8cac9d348a2343f249406f74b7e4b31a09b15d8fedc2e45b409a0\n\n~~~~~~text\n# WorkBuddy 财务工作台 v2.2.0\r\n\r\n这是一次以“更高级、更现代、更好用”为目标的界面与内容升级。新版吸收现代业务工作台的雾光层次、聚焦式标题和清晰导航，同时保持财务产品应有的克制、专业和信息密度。\r\n\r\n## 本版亮点\r\n\r\n- 4 套主题：雾光靛蓝、松石墨绿、暖砂棕金和夜航深色；支持快速切换、刷新保留和备份恢复。\r\n- 今日财务节奏：首页集中提示高优先级待办、月结证据进度和经营数据完整度。\r\n- 新手工作指引：15 个业务模块都补充责任岗位、建议频率和第一步操作，不必先理解整套系统。\r\n- 现代响应式界面：桌面、窄窗口和手机均保持清晰层级，无横向溢出。\r\n- 能力完整保留：资料上传、文件夹导入、拖放、搜索、筛选、置顶、引用、下载、待办、月结、审计和 25 个 AI 工作流均保留。\r\n\r\n截图中的名称、金额和业务内容均为虚构演示数据。\r\n\r\n## 下载哪个文件\r\n\r\n- `finance-workbench-agent-v2.2.0.zip`：WorkBuddy、Codex、Claude Code 或其他支持 Skill 的 AI Agent。\r\n- `dsh-finance-workbench-2.2.0.tgz`：DeepSeek Harness 完整图形工作台。\r\n- `SHA256SUMS.txt`：下载后校验文件是否完整。\r\n\r\n## 安装\r\n\r\n- 完整界面：[DeepSeek Harness 安装指南](../INSTALL_DSH.md)\r\n- AI Agent：[WorkBuddy / Codex / Claude / 通用 Agent 安装指南](../INSTALL_AGENT.md)\r\n\r\n升级前建议先在“数据备份”导出 JSON。v2.2.0 继续识别旧版 v2 备份；旧备份没有主题字段时会自动使用默认的“雾光靛蓝”。\r\n\n~~~~~~\n\n## docs/releases/v2.3.0.md\n\nSHA-256: ca949935e48fe50bbc46018ca961f82b44d80fd7d85c25acd67636ea0d215e6c\n\n~~~~~~text\n# WorkBuddy 财务工作台 v2.3.0\r\n\r\n这是一次以 FDE 财务治理视角完成的实用性升级：不仅发现异常，还要明确金额影响、责任人、截止时间、来源证据和关闭条件。同时整体放大字号与控件，减少财务人员长时间录入和复核时的视觉负担。\r\n\r\n## 本版亮点\r\n\r\n- **异常控制台**：跨对账、应收、应付、报销、税务和月结统一登记异常。\r\n- **有证据才能关闭**：风险事项必须填写底稿、凭证号、复核记录或业务确认结论后才能闭环。\r\n- **风险优先级**：结合风险等级、逾期、大额阈值和待业务确认状态计算可解释风险分数。\r\n- **财务复核断言**：15 个业务模块新增发生、完整性、存在、准确性、截止、计价和权利义务等复核关注点。\r\n- **更易读**：放大导航、正文、表单、按钮和关键数字，桌面与 390px 手机均完成回归。\r\n- **可带走**：异常台账随 JSON 备份导出，也可单独导出 UTF-8 CSV。\r\n- **完整保留**：资料上传、文件夹导入、拖放、搜索、筛选、置顶、引用、下载、待办、月结、审计和 25 个 AI 工作流均保留。\r\n\r\n截图中的主体、金额、责任岗位和业务事项均为虚构演示数据。\r\n\r\n## 下载哪个文件\r\n\r\n- `finance-workbench-agent-v2.3.0.zip`：WorkBuddy、Codex、Claude Code 或其他支持 Skill 的 AI Agent。\r\n- `dsh-finance-workbench-2.3.0.tgz`：DeepSeek Harness 完整图形工作台。\r\n- `SHA256SUMS.txt`：下载后校验文件是否完整。\r\n\r\n## 安装\r\n\r\n- 完整界面：[DeepSeek Harness 安装指南](../INSTALL_DSH.md)\r\n- AI Agent：[WorkBuddy / Codex / Claude / 通用 Agent 安装指南](../INSTALL_AGENT.md)\r\n\r\n升级前建议先在“数据备份”导出 JSON。v2.3.0 继续识别旧版 v2 备份；旧备份缺少异常台账时会自动初始化为空列表，不影响原有经营快照、待办、月结、收藏和设置。\r\n\n~~~~~~\n\n## docs/releases/v2.4.0.md\n\nSHA-256: ea11e800aaadf81ac63d598c07d1502623370bef08e9e80a9812830c0f617e7f\n\n~~~~~~text\n# v2.4.0 · WorkBuddy 完整可视化应用\r\n\r\n本版本把 WorkBuddy 支持从“仅安装 Skill”升级为可直接打开的完整 MCP App，并重做全部新手安装与项目首页说明。\r\n\r\n## 新增\r\n\r\n- WorkBuddy MCP App：20 个模块、25 个工作流、异常控制、月结、资料索引和本机备份。\r\n- `show_finance_workbench` 工具与 `text/html;profile=mcp-app` UI 资源。\r\n- macOS 双击安装包、Windows PowerShell 安装包、源码安装与可恢复卸载。\r\n- MCP 协议、Widget 体积、隔离安装、配置保留和公开发布完整性测试。\r\n\r\n## 安装\r\n\r\n- macOS 下载 `workbuddy-finance-workbench-macos.zip`，解压并双击安装文件。\r\n- Windows 下载 `workbuddy-finance-workbench-windows.zip`，执行包内 PowerShell 安装器。\r\n- DeepSeek Harness 用户继续使用 `dsh-finance-workbench-2.4.0.tgz` 或源码安装脚本。\r\n- 只需要规则库的 AI Agent 可使用 `finance-workbench-agent-v2.4.0.zip`。\r\n\r\n安装后保存当前内容，完全退出并重新打开 WorkBuddy，输入“打开财务工作台”。安装器不会主动重启应用。\r\n\n~~~~~~\n\n## docs/releases/v2.5.0.md\n\nSHA-256: 8fce8008ca3226aa56b805fa292ce99408d24506f1dcb1221c631f499b87990f\n\n~~~~~~text\n# v2.5.0 · 新手可见的 25 份提示词\r\n\r\n本版本把原本藏在数据源和运行时文件中的工作流提示词，变成财务人员可直接看懂、查看和复制的公开能力。\r\n\r\n## 主要升级\r\n\r\n- 25 个工作流统一编号 01–25，每个场景都有一份独立 Markdown 提示词。\r\n- 工作台详情页显示“最少先准备什么”、一句话发起和新手三步路径。\r\n- 完整提示词可展开预览、一键复制；剪贴板不可用时会下载文本文件。\r\n- 提示词允许新手对不清楚的主体、期间或口径留空，由 AI 先识别现有资料并一次列出必需缺项。\r\n\r\n## 保留能力\r\n\r\n资料上传、文件夹导入、拖放、搜索、筛选、置顶、引用、下载、异常闭环、待办、月结、审计日志、备份恢复和 4 套主题均保留。\r\n\n~~~~~~\n\n## docs/releases/v2.7.0.md\n\nSHA-256: 206bc1655fcb95d8e59361ff2fc7c012fb65d3a088b33043e68d2959d86292ee\n\n~~~~~~text\n# v2.7.0 · 安装与数据可靠性升级\r\n\r\n本次保留 20 个业务模块、25 个完整工作流，以及 WorkBuddy、DeepSeek Harness 和通用 Agent Skill 三种入口，重点修复升级、数据保存和文件读写中的实际问题。\r\n\r\n| 检查发现 | 升级后的行为 |\r\n|---|---|\r\n| 依赖更新后源码复刻清单过期，导致 CI 失败 | 每次检查先构建并重建复刻包，再验证所有源文件的 SHA-256 |\r\n| 依赖审计发现 5 个漏洞项 | 更新 MCP SDK、Zod 及相关传递依赖；官方 npm 审计为 0 |\r\n| 上传与工作流目录可能被符号链接引到工作区外 | 检查目录和临时文件，拒绝符号链接与越界写入 |\r\n| 安装器尚未验证配置便替换旧目录 | 先预检与暂存，备份后切换，遇到失败恢复旧目录 |\r\n| 备份遗漏置顶、最近工作流，内层损坏数据可能进入界面 | 补齐备份字段，逐项校验并保留恢复前副本 |\r\n| 本机保存失败被忽略，主题切换后立即刷新可能丢失 | 提交后立即保存，失败显示明确的导出提示 |\r\n| 金额显示省略分位，浮点合计出现尾差 | 显示两位小数，按分计算利润与异常合计 |\r\n| CSV 文本可能被 Excel 当作公式 | 对公式样式的文本加保护前缀，保留普通中文和金额 |\r\n| Widget 复制失败仍可能报告成功 | 检查实际复制结果，失败时提示手动复制 |\r\n| npm 包内缺少配套卸载与安装辅助文件 | 补齐 Shell / PowerShell 共用逻辑、卸载脚本和文档 |\r\n\r\n## 立即使用\r\n\r\n从源码预览：\r\n\r\n```bash\r\nnpm ci\r\nnpm run preview\r\n```\r\n\r\n打开 http://127.0.0.1:4173。预览中的台账和主题保存在该浏览器来源的本机存储，工作流指令需粘贴到 AI 对话执行。安装完整 WorkBuddy 应用见 [安装指南](../INSTALL_WORKBUDDY.md)。GitHub 下载包的版本以 Releases 页面为准。\r\n\r\n## 数据恢复\r\n\r\n导出格式仍为 v2，旧备份可以继续导入。新增备份包含资料置顶和最近工作流。历史备份缺少这两项时，保留当前记录。\r\n\r\n导入先检查所有数据，再保存恢复前副本，最后切换。校验失败不替换现有数据。“下载恢复前副本”可以导出回滚材料。存储拒绝写入或容量不足时，先导出备份再处理存储问题。\r\n\r\nJSON 备份不包含原始财务文件。Widget 的资料选择只建立当前会话索引，仍需在宿主对话中添加原始附件。\r\n\r\n## 验证与运行边界\r\n\r\n```bash\r\nnpm ci\r\nnpm run verify:release\r\nnpm run audit:deps\r\n```\r\n\r\nCI 覆盖 Linux Node.js 20、22、24 和 Windows Node.js 24 / PowerShell。浏览器回归使用虚构数据；真实 WorkBuddy / DSH 的插件加载与 AI 文件处理仍需在对应宿主内验收。此次源码升级不重启宿主，不更改现有模型、登录配置或业务文件。\r\n\n~~~~~~\n\n## package-lock.json\n\nSHA-256: 973d548bcb75582802649092aca9eebb2d51b274b30aeab93c24aff64c480252\n\n~~~~~~text\n{\r\n  \"name\": \"dsh-finance-workbench\",\r\n  \"version\": \"2.7.1\",\r\n  \"lockfileVersion\": 3,\r\n  \"requires\": true,\r\n  \"packages\": {\r\n    \"\": {\r\n      \"name\": \"dsh-finance-workbench\",\r\n      \"version\": \"2.7.1\",\r\n      \"license\": \"MIT\",\r\n      \"dependencies\": {\r\n        \"@deepseek-ai/dsh-typert-protocol\": \"^0.1.0-rc.7\",\r\n        \"esbuild\": \"^0.28.2\",\r\n        \"zod\": \"^4.6.5\"\r\n      },\r\n      \"bin\": {\r\n        \"zy-finance-team\": \"workbuddy/team-cli.mjs\"\r\n      },\r\n      \"devDependencies\": {\r\n        \"@modelcontextprotocol/ext-apps\": \"^1.7.5\",\r\n        \"@modelcontextprotocol/sdk\": \"1.32.1\",\r\n        \"preact\": \"^10.29.8\"\r\n      },\r\n      \"engines\": {\r\n        \"node\": \">=20\"\r\n      }\r\n    },\r\n    \"node_modules/@deepseek-ai/cordis\": {\r\n      \"version\": \"4.0.1\",\r\n      \"resolved\": \"https://registry.npmmirror.com/@deepseek-ai/cordis/-/cordis-4.0.1.tgz\",\r\n
