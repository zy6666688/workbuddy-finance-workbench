合并成一次询问，并用财务人员熟悉的语言说明如何准备。`\r\n\r\nfunction asLines(value) {\r\n  return (Array.isArray(value) ? value : [value]).filter(Boolean)\r\n}\r\n\r\nexport function composeFinanceTask(scenario, { includeChecklist = true } = {}) {\r\n  if (!scenario?.title || !scenario?.prompt) throw new Error('财务模块配置不完整')\r\n  const inputs = asLines(scenario.inputs)\r\n  const outputs = asLines(scenario.outputs)\r\n  const checklist = asLines(scenario.checklist)\r\n  const sections = [\r\n    `【财务任务包】${scenario.title}`,\r\n    FINANCE_PROFILE,\r\n    formatTaskBrief(scenario.taskBrief) || BEGINNER_BRIEF,\r\n    `【所需资料】\\n${inputs.map(item => `- ${item}`).join('\\n')}`,\r\n    `【交付成果】\\n${outputs.map(item => `- ${item}`).join('\\n')}`,\r\n    CONTROL_PROTOCOL,\r\n    `【模块执行指令】\\n${scenario.prompt}`,\r\n  ]\r\n  if (scenario.variant) sections.push(`【可选扩展指令】\\n${scenario.variant}\\n仅在用户明确需要此扩展时执行。`)\r\n  if (includeChecklist) sections.push(`【专项核查清单】\\n${checklist.map(item => `- [ ] ${item}`).join('\\n')}`)\r\n  sections.push('【完成回报】\\n不要只回复操作建议。完成后汇报：实际读取的文件、实际生成的文件、关键合计与勾稽结果、异常/待复核项、未完成事项及原因。')\r\n  return sections.join('\\n\\n')\r\n}\r\n\r\nexport function composeFinanceLaunch(scenario, workflowRelative, matchedFiles = []) {\r\n  if (!scenario?.title || !workflowRelative) throw new Error('财务工作流配置不完整')\r\n  const references = [workflowRelative, ...asLines(matchedFiles).slice(0, 8)]\r\n    .map(value => `@${value}`)\r\n    .join(' ')\r\n  return `${references}\\n请执行“${scenario.title}”。结合当前对话和已上传资料自动处理；缺少必要资料时一次性告诉我。`\r\n}\r\n\r\nexport function mergeFinanceLaunchDraft(current, launch) {\r\n  const existing = String(current || '').trim()\r\n  if (!existing) return launch\r\n  const isGeneratedTask = /【(?:教师|财务)任务包】|@财务工作台\\/内置工作流\\//.test(existing)\r\n  return isGeneratedTask ? launch : `${existing}\\n\\n${launch}`\r\n}\r\n\n~~~~~~\n\n## src/team-adapter.mjs\n\nSHA-256: 8cc9bc998819de1ef5ff7a1100002f57b8c7d70bc539026cf8764877dd2397b0\n\n~~~~~~text\nimport { createTeamClient } from './team-api-client.mjs'\nimport { realpath, readFile, stat, writeFile, open, link, unlink } from 'node:fs/promises'\nimport path from 'node:path'\nimport { randomUUID, createHash } from 'node:crypto'\nimport { loadTeamSession, defaultWorkspace } from './team-credentials.mjs'\n\n// A session must come from the employee's authorization flow. Do not accept\n// credentials in tool parameters or publish them in tool output.\nexport async function teamClientFromEnvironment(env = process.env) {\n  const synthetic = env.ZY_BRIDGE_SYNTHETIC_TEST === '1' && env.ZY_TEAM_URL === 'http://127.0.0.1:8081'\n  const auth = synthetic ? { baseUrl: env.ZY_TEAM_URL, session: env.ZY_TEAM_SESSION, csrf: env.ZY_TEAM_CSRF, workspace: env.ZY_TEAM_WORKSPACE } : await loadTeamSession()\n  const client = createTeamClient(auth)\n  client.workspace = auth.workspace || defaultWorkspace()\n  return client\n}\n\nasync function workspacePath(file, forOutput = false, workspace) {\n  workspace ||= process.env.ZY_TEAM_WORKSPACE\n  if (!workspace) throw new Error('请先设置用于交接的本机工作目录')\n  if (typeof file !== 'string' || !file || path.isAbsolute(file)) throw new Error('文件必须使用工作目录内的相对路径')\n  const root = await realpath(workspace)\n  const absolute = path.resolve(root, file)\n  const parent = await realpath(forOutput ? path.dirname(absolute) : absolute)\n  const relative = path.relative(root, parent)\n  if (relative === '..' || relative.startsWith('..' + path.sep) || path.isAbsolute(relative)) throw new Error('文件不在授权交接目录内')\n  return forOutput ? path.join(parent, path.basename(absolute)) : parent\n}\n\nasync function saveHandoff(dest, bytes) {\n  // Same-directory publication is atomic and link() refuses an existing target.\n  // A failed write never leaves a partial file under the requested output name.\n  const temporary = path.join(path.dirname(dest), `.invoice-handoff-${randomUUID()}.tmp`)\n  const handle = await open(temporary, 'wx', 0o600)\n  try {\n    try {\n      await handle.writeFile(bytes)\n      await handle.sync()\n    } finally {\n      await handle.close()\n    }\n    try {\n      await link(temporary, dest)\n    } catch (error) {\n      if (error.code === 'EEXIST') throw new Error('交接文件已存在，未覆盖；请核实上次下载或指定另一个输出文件名。')\n      throw error\n    }\n  } finally {\n    // Only this call's exclusively created temporary file may be removed.\n    await unlink(temporary).catch(() => {})\n  }\n}\n\nexport async function executeTeamCommand(client, command, args = {}) {\n  switch (command) {\n    case 'me': return client.me()\n    case 'companies': return client.companies(args)\n    case 'client-dossier': return client.dossier(args.companyId, args.period)\n    case 'client-dossier-revision': return client.dossierRevision(args.companyId, args.revisionId)\n    case 'client-dossier-draft': return client.dossierDraft(args.companyId, args.draftId)\n    case 'prepare-client-dossier': { const { companyId, ...body } = args; return client.createDossierDraft(companyId, body) }\n    case 'orders': return client.orders(args)\n    case 'order': return client.order(args.orderId)\n    case 'files': { const { orderId, ...query } = args; return client.files(orderId, query) }\n    case 'workflows': return client.workflows()\n    case 'workflow': return client.workflow(args.workflowId)\n    case 'jobs': return client.jobs()\n    case 'download-file':\n    case 'workflow-template':\n    case 'accounting-template': {\n      const dest = await workspacePath(args.filePath, true, client.workspace)\n      const bytes = command === 'download-file' ? await client.downloadFile(args.fileId) : command === 'workflow-template' ? await client.workflowTemplate(args.workflowId) : await client.accountingTemplate()\n      await writeFile(dest, bytes, { flag: 'wx', mode: 0o600 })\n      return { filePath: args.filePath, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') }\n    }\n    case 'start-accounting':\n    case 'start-prepared-workflow':\n    case 'upload-accounting-input': {\n      con port os from 'node:os'\n\n// Windows DPAPI ties the stored session to the current Windows account. It is\n// not a security boundary between apps running as the same Windows user.\nfunction crypt(input, operation) {\n  if (process.platform !== 'win32') throw new Error('本机授权目前仅支持 Windows；请使用独立 Windows 账号')\n  const script = `$ErrorActionPreference='Stop'; Add-Type -AssemblyName System.Security; $x=[Convert]::FromBase64String([Console]::In.ReadToEnd()); $v=[System.Security.Cryptography.ProtectedData]::${operation}($x,$null,[System.Security.Cryptography.DataProtectionScope]::CurrentUser); [Console]::Out.Write([Convert]::ToBase64String($v))`\n  const p = spawnSync('powershell.exe', ['-NoLogo', '-NoProfile', '-NonInteractive', '-Command', script], { input: Buffer.from(input).toString('base64'), encoding: 'utf8', windowsHide: true, maxBuffer: 65536 })\n  if (p.error || p.status !== 0) throw new Error('Windows 用户凭据保护不可用，未保存授权')\n  return Buffer.from(p.stdout.trim(), 'base64')\n}\n\nfunction sessionFile() {\n  if (!process.env.LOCALAPPDATA) throw new Error('无法找到当前 Windows 用户目录')\n  return path.join(process.env.LOCALAPPDATA, 'ZYFinance', 'workbuddy-session.dat')\n}\n\nexport async function saveTeamSession(value) {\n  const file = sessionFile(), dir = path.dirname(file)\n  const encrypted = crypt(Buffer.from(JSON.stringify(value)), 'Protect')\n  await mkdir(dir, { recursive: true, mode: 0o700 })\n  const temp = path.join(dir, `session-${randomUUID()}.tmp`)\n  try {\n    await writeFile(temp, encrypted, { flag: 'wx', mode: 0o600 })\n    await rename(temp, file)\n  } finally { await unlink(temp).catch(() => {}) }\n}\n\nexport async function loadTeamSession() {\n  if (process.platform !== 'win32') throw new Error('尚未授权：本机员工授权目前仅支持 Windows')\n  let encrypted\n  try { encrypted = await readFile(sessionFile()) } catch (e) {\n    if (e.code === 'ENOENT') throw new Error('尚未授权：请在本人 Windows 账号中运行 zy-finance-team login')\n    throw new Error('无法读取本机员工授权')\n  }\n  try {\n    const value et(['pdf', 'doc', 'docx', 'txt', 'md', 'rtf', 'pages']),\r\n  sheet: new Set(['xls', 'xlsx', 'csv', 'numbers']),\r\n  slides: new Set(['ppt', 'pptx', 'key']),\r\n  image: new Set(['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'heic']),\r\n}\r\n\r\nexport const DEFAULT_PIN_NAMES = [\r\n  'AGENTS.md',\r\n  '财务工作台-使用说明.md',\r\n  '财务工作流导航.md',\r\n  '字段字典.xlsx',\r\n  '财务规则表.xlsx',\r\n  '月结清单.xlsx',\r\n]\r\n\r\nexport function fileKind(path) {\r\n  const extension = String(path).split('.').pop()?.toLowerCase() || ''\r\n  for (const [kind, extensions] of Object.entries(TYPES)) if (extensions.has(extension)) return kind\r\n  return 'other'\r\n}\r\n\r\nexport function topFolder(path) {\r\n  const parts = String(path).split('/').filter(Boolean)\r\n  return parts.length > 1 ? parts[0] : '根目录'\r\n}\r\n\r\nexport function filterFiles(files, query = '', kind = 'all', folder = 'all') {\r\n  const needle = String(query).trim().toLocaleLowerCase('zh-CN')\r\n  return files.filter(file => {\r\n    if (kind !== 'all' && fileKind(file.relative) !== kind) return false\r\n    if (folder !== 'all' && topFolder(file.relative) !== folder) return false\r\n    return !needle || `${file.name} ${file.relative}`.toLocaleLowerCase('zh-CN').includes(needle)\r\n  })\r\n}\r\n\r\nexport function defaultPinnedPaths(files) {\r\n  const priority = new Map(DEFAULT_PIN_NAMES.map((name, index) => [name, index]))\r\n  return files\r\n    .filter(file => priority.has(file.name))\r\n    .sort((a, b) => priority.get(a.name) - priority.get(b.name))\r\n    .map(file => file.relative)\r\n}\r\n\r\nexport function orderFiles(files, pinnedPaths = [], order = 'recent') {\r\n  const pins = new Set(pinnedPaths)\r\n  const compare = order === 'name'\r\n    ? (a, b) => a.name.localeCompare(b.name, 'zh-CN', { numeric: true })\r\n    : order === 'size'\r\n      ? (a, b) => b.size - a.size || b.modifiedAt - a.modifiedAt\r\n      : (a, b) => b.modifiedAt - a.modifiedAt\r\n  return [...files].sort((a, b) => {\r\n    const pinDelta = Number(pins.has(b.relative)) - Number(pins.has(a.relative))\r\n    return pinDelta || compare(a, b)\r\n  })\r\n}\r\n\r\nexport function summarizeFiles(files) {\r\n  const summary = { total: files.length, bytes: 0, document: 0, sheet: 0, slides: 0, image: 0, other: 0 }\r\n  for (const file of files) {\r\n    summary.bytes += Number(file.size) || 0\r\n    summary[fileKind(file.relative)] += 1\r\n  }\r\n  return summary\r\n}\r\n\r\nexport function matchScenarioFiles(files, scenario, limit = 8) {\r\n  const keywords = (scenario?.keywords || []).map(value => String(value).toLocaleLowerCase('zh-CN')).filter(Boolean)\r\n  const acceptedKinds = new Set(scenario?.fileKinds || [])\r\n  return files\r\n    .map(file => {\r\n      const haystack = `${file.name} ${file.relative}`.toLocaleLowerCase('zh-CN')\r\n      const keywordHits = keywords.reduce((count, keyword) => count + Number(haystack.includes(keyword)), 0)\r\n      const kindHit = acceptedKinds.has(fileKind(file.relative)) ? 1 : 0\r\n      return { file, score: keywordHits * 10 + kindHit }\r\n    })\r\n    .filter(item => keywords.length ? item.score >= 10 : item.score > 0)\r\n    .sort((a, b) => b.score - a.score || b.file.modifiedAt - a.file.modifiedAt)\r\n    .slice(0, limit)\r\n    .map(item => item.file)\r\n}\r\n\n~~~~~~\n\n## src/version.js\n\nSHA-256: 437f4f46f29cf709aba42d8de428b9c8ceb49880009befd76951b0a5f78e5b43\n\n~~~~~~text\n// Generated from package.json by scripts/sync-version.mjs.\nexport const VERSION = '2.7.1'\n\n~~~~~~\n\n## src/workbuddy-mcp-server.mjs\n\nSHA-256: e8f259ab35d895f80e2b6e2e9f25c539cc0f226daba79b3fd8a8d03ad64ce3a5\n\n~~~~~~text\nimport { readFileSync } from 'node:fs'\r\nimport { dirname, join } from 'node:path'\r\nimport { fileURLToPath } from 'node:url'\r\nimport { McpServer } from '@modelcontextprotocol/sdk/server/mcp.js'\r\nimport { StdioServerTransport } from '@modelcontextprotocol/sdk/server/stdio.js'\r\nimport { z } from 'zod'\r\nimport { executeTeamCommand, teamClientFromEnv ositive(), resultFileIds: z.array(z.string().uuid()).min(1).max(100), inputHashes: z.record(z.string(), z.string()), summary: z.string().min(1).max(4000) }, 'return-run', false)\r\n\r\nserver.registerTool('show_finance_workbench', {\r\n  title: '打开 ZY 财务工作台（WorkBuddy 财务工作台）',\r\n  description: '打开完整的交互式财务工作台，包含总览、往来、核算、异常、月结、资料索引、备份和 25 个财务工作流。用户说“打开财务工作台”或需要财务控制面板时使用。',\r\n  annotations: { readOnlyHint: true, destructiveHint: false, openWorldHint: false },\r\n  _meta: { ui: { resourceUri: APP_URI } },\r\n}, async () => ({\r\n  content: [{ type: 'text', text: 'ZY 财务工作台（WorkBuddy 财务工作台）已打开。终端环境会自动降级为本段文字；Web UI 会渲染完整交互界面。' }],\r\n  structuredContent: { version: VERSION, modules: 20, workflows: 25, prompts: 25, mode: 'interactive-widget' },\r\n  _meta: { ui: { resourceUri: APP_URI } },\r\n}))\r\n\r\nserver.registerResource('finance-workbench-dashboard', APP_URI, {\r\n  title: 'ZY 财务工作台（WorkBuddy 财务工作台）',\r\n  description: '本机运行的交互式财务工作台 Widget',\r\n  mimeType: APP_MIME,\r\n  _meta: {\r\n    ui: {\r\n      prefersBorder: false,\r\n      permissions: {},\r\n      csp: { resourceDomains: [], connectDomains: [] },\r\n    },\r\n  },\r\n}, async () => ({\r\n  contents: [{\r\n    uri: APP_URI,\r\n    text: widgetHtml,\r\n    mimeType: APP_MIME,\r\n    _meta: {\r\n      ui: {\r\n        prefersBorder: false,\r\n        permissions: {},\r\n        csp: { resourceDomains: [], connectDomains: [] },\r\n      },\r\n    },\r\n  }],\r\n}))\r\n\r\nawait server.connect(new StdioServerTransport())\r\n\n~~~~~~\n\n## src/workbuddy-widget.jsx\n\nSHA-256: c753758f749d11bd880a4779414f6208d7e3d03d37e27fb542fb18eb48c1f7b9\n\n~~~~~~text\nimport React, { useEffect, useRef, useState } from 'react'\r\nimport { createRoot } from 'react-dom/client'\r\nimport { App } from '@modelcontextprotocol/ext-apps'\r\nimport { FinanceDashboard } from './finance-dashboard.jsx'\r\nimport { composeFinanceTask } from './task-prompt.js'\r\n\r\nimport { copyText } from './clipboard.js'\r\nimport { VERSION } from './version.js'\r\n\r\nconst MAX_FILES = 200\r\n\r\nfunction normalizeSelectedFiles(selected) {\r\n  return [...selected].slice(0, MAX_FILES).map((file, index) => ({\r\n    relative: file.webkitRelativePath || file.name || `文件-${index + 1}`,\r\n    name: file.name || `文件-${index + 1}`,\r\n    size: Number(file.size || 0),\r\n    modifiedAt: Number(file.lastModified || Date.now()),\r\n    sourceFile: file,\r\n  }))\r\n}\r\n\r\nfunction WorkBuddyFinanceApp() {\r\n  const [files, setFiles] = useState([])\r\n  const [references, setReferences] = useState([])\r\n  const [status, setStatus] = useState('WorkBuddy 图形工作台已就绪 · 数据保存在本机')\r\n  const [launching, setLaunching] = useState(false)\r\n  const appRef = useRef(null)\r\n  const filePicker = useRef(null)\r\n  const folderPicker = useRef(null)\r\n\r\n  useEffect(() => {\r\n    if (window.parent === window) {\r\n      setStatus('独立预览模式 · 工作流指令会复制到剪贴板')\r\n      return undefined\r\n    }\r\n    const app = new App(\r\n      { name: 'workbuddy-finance-workbench', version: VERSION },\r\n      {},\r\n      { autoResize: true },\r\n    )\r\n    let disposed = false\r\n    app.onhostcontextchanged = context => {\r\n      if (context?.theme) document.documentElement.dataset.hostTheme = context.theme\r\n    }\r\n    app.ontoolresult = result => {\r\n      const version = result?.structuredContent?.version\r\n      if (version) setStatus(`已连接 WorkBuddy MCP App · v${version}`)\r\n    }\r\n    void app.connect().then(async () => {\r\n      if (disposed) return\r\n      appRef.current = app\r\n      document.documentElement.dataset.hostTheme = app.getHostContext()?.theme || 'light'\r\n      setStatus('已连接 WorkBuddy · 数据保存在本机，可随时导出备份')\r\n      try { await app.requestDisplayMode({ mode: 'fullscreen' }) } catch {}\r\n    }).catch(() => setStatus('Widget 已打开；若功能未连接，请重新加载 WorkBuddy 会话'))\r\n    return () => { disposed = true; appRef.current = null; void app.close().catch(() => {}) }\r\n  }, [])\r\n\r\n  const addFiles = selected => {\r\n    const selection = [...selected]\r\n    const incoming = normalizeSelectedFiles(selection)\r\n    setFiles(current => {\r\n      const merged = new Map(current.map(item => [item.relative, item]))\r\n      for (const item of incoming) merged.set(item.relative, item)\r\n      const capped = merged.size > MAX_FILES || selection.length > MAX_FILES\r\n      setStatus(`当前 Widget 已索引 ${Math.min(merged.size, MAX_FILES)} 个文件${capped ? '（上限 200 个，超出部分未索引）' : ''}；执行时请在输入框确认附件`)\r\n      return [...merged.values()].slice(0, MAX_FILES)\r\n    })\r\n  }\r\n\r\n  const launchWorkflow = async workflow => {\r\n    setLaunching(true)\r\n    const chosen = references.length ? files.filter(file => references.includes(file.relative)) : files\r\n    const matched = chosen.length ? `\\n当前 Widget 已选择：${chosen.slice(0, 12).map(item => item.relative).join('、')}${chosen.length > 12 ? '等' : ''}。发送前请在 WorkBuddy 输入框核对并添加原始附件。` : '\\n发送前请在 WorkBuddy 输入框添加需要处理的原始附件。'\r\n    const prompt = `请使用 finance-workbench 执行「${workflow.title}」。\\n\\n${composeFinanceTask(workflow)}${matched}`\r\n    try {\r\n      if (appRef.current) {\r\n        const result = await appRef.current.sendMessage({\r\n          role: 'user',\r\n          content: [{ type: 'text', text: prompt }],\r\n          _meta: { 'codebuddy.ai/sendMessageMode': 'fill' },\r\n        })\r\n        if (result?.isError) throw new Error('WorkBuddy 未接收指令')\r\n        setStatus('工作流指令已填入 WorkBuddy 输入框；核对附件后发送')\r\n      } else {\r\n        await copyText(prompt)\r\n        setStatus('工作流指令已复制；请粘贴到 WorkBuddy 并添加附件')\r\n      }\r\n    } catch {\r\n      try { await copyText(prompt); setStatus('工作流指令已复制；请粘贴到 WorkBuddy 并添加附件') }\r\n      catch { setStatus('指令发送和复制均未完成，请展开完整提示词后手动复制') }\r\n    } finally {\r\n      setLaunching(false)\r\n    }\r\n  }\r\n\r\n  const downloadFile = file => {\r\n    if (!file.sourceFile) { setStatus('请重新选择该文件后再下载'); return }\r\n    const url = URL.createObjectURL(file.sourceFile)\r\n    const anchor = document.createElement('a')\r\n    anchor.href = url\r\n    anchor.download = file.name\r\n    anchor.click()\r\n    setTimeout(() => URL.revokeObjectURL(url), 3000)\r\n  }\r\n\r\n  return \u003c>\r\n    \u003cFinanceDashboard\r\n      sessionId=\"workbuddy-mcp-app\"\r\n      files={files}\r\n      workspace={{ name: 'WorkBuddy 当前对话', mode: 'index', path: 'Widget 只建立文件索引；原件仍由你在对话附件中确认' }}\r\n      status={status}\r\n      onStatus={setStatus}\r\n      onRefresh={() => setStatus(`已刷新 · 当前索引 ${files.length} 个文件`)}\r\n      onOpenWorkspace={() => setStatus('WorkBuddy Widget 不直接访问 Finder；请使用“选择文件”添加资料')}\r\n      onChooseFiles={() => filePicker.current?.click()}\r\n      onChooseFolder={() => folderPicker.current?.click()}\r\n      onUploadFiles={addFiles}\r\n      onReferenceFile={file => { setReferences(current => [...new Set([...current, file.relative])]); setStatus(`已标记引用 ${file.name}；启动工作流后请核对输入框附件`) }}\r\n      onDownloadFile={downloadFile}\r\n      onLaunchWorkflow={launchWorkflow}\r\n      launching={launching}\r\n      onClose={() => { if (appRef.current) void appRef.current.requestDisplayMode({ mode: 'inline' }).catch(() => setStatus('宿主未切回对话，请使用 WorkBuddy 返回按钮')); else setStatus('当前为独立预览；请切换回你的 AI 对话') }}\r\n    />\r\n    \u003cinput ref={filePicker} hidden type=\"file\" multiple onChange={event => { addFiles(event.target.files || []); event.target.value = '' }}/>\r\n    \u003cinput ref={folderPicker} hidden type=\"file\" multiple webkitdirectory=\"\" onChange={event => { addFiles(event.target.files || []); event.target.value = '' }}/>\r\n  \u003c/>\r\n}\r\n\r\ncreateRoot(document.getElementById('root')).render(\u003cWorkBuddyFinanceApp/>)\r\n\n~~~~~~\n\n## src/workflow-tools-styles.js\n\nSHA-256: b8f5b5a1a7b0f4feac27e2eb60f62a902699d5a270fa2e6b0a2ae1711f5587c2\n\n~~~~~~text\nexport const WORKBENCH_POLISH_CSS = `\r\n.dshDesk_root{--wb-accent:var(--desk-accent-strong);--wb-line:var(--desk-line);--wb-panel:var(--desk-panel);--wb-muted:var(--desk-muted);--wb-soft:var(--desk-soft)}\r\n bPro_brief footer{margin-top:12px}\r\n.wbPro_briefGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wbPro_briefGrid label{display:grid;gap:7px;font-size:12px;font-weight:600;min-width:0}.wbPro_briefGrid .is-wide{grid-column:1/-1}.wbPro_briefGrid input,.wbPro_briefGrid textarea{box-sizing:border-box;width:100%;min-width:0;border:1px solid var(--wb-line);background:var(--wb-panel);border-radius:8px;padding:10px 12px;font:inherit;font-size:13px;color:inherit;outline:none}.wbPro_briefGrid textarea{min-height:88px;resize:vertical}.wbPro_briefGrid :is(input,textarea):focus{border-color:var(--wb-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--wb-accent) 12%,transparent)}\r\n.wbPro_brief header button,.wbPro_filters button{border:1px solid var(--wb-line);border-radius:8px;padding:8px 12px;font-size:12px!important;background:var(--wb-panel);color:inherit;white-space:nowrap;cursor:pointer}.wbPro_filters{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.wbPro_filters button[aria-pressed=true]{background:var(--wb-soft);border-color:var(--wb-accent);color:var(--wb-accent);font-weight:700}.wbPro_search{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0}.wbPro_search input{flex:1;min-width:120px;border:1px solid var(--wb-line);border-radius:9px;padding:11px 12px;background:var(--wb-panel);color:inherit;font-size:13px}.wbPro_search small{font-size:12px;color:var(--wb-muted)}\r\n.dshDesk_root :focus-visible,.fdDesk_root :focus-visible{outline:2px solid var(--wb-accent);outline-offset:3px}\r\n.dshDesk_root .dshDesk_workflowGrid button,.fdDesk_root .fdDesk_workflowGrid button{transition:transform .15s,border-color .15s;min-height:116px}.dshDesk_root .dshDesk_workflowGrid button:hover,.fdDesk_root .fdDesk_workflowGrid button:hover{transform:translateY(-2px);border-color:var(--wb-accent)}\r\n.dshDesk_root .dshDesk_promptBlock pre,.fdDesk_root .fdDesk_promptPreview{font-size:13px;line-height:1.85;max-height:480px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}\r\n@container teacher-workbench (max-width:600px){.wbPro_briefGrid{grid-template-columns:1fr}.wbPro_brief{padding:14px}.wbPro_brief header{flex-wrap:wrap}}\r\n@container finance-workbench (max-width:600px){.wbPro_briefGrid{grid-template-columns:1fr}.wbPro_brief{padding:14px}.wbPro_brief header{flex-wrap:wrap}}\r\n@media(prefers-reduced-motion:reduce){.dshDesk_root *,.fdDesk_root *{transition:none!important;animation:none!important}}\r\n`\r\n\n~~~~~~\n\n## src/workflow-tools.js\n\nSHA-256: a5b02088d41494811c4ecf2122236957eb3a6b271281fbf78bae605c086c87bf\n\n~~~~~~text\nexport const BRIEF_FIELDS = [\r\n  ['subject', '处理对象', '单位 / 账套 / 项目'],\r\n  ['period', '时间范围', '会计期间 / 截止日期'],\r\n  ['goal', '本次想完成什么', '例如：核对银行流水，输出差异与复核清单'],\r\n  ['requirements', '特别要求', '格式、字数、口径、输出文件和需要避开的事项'],\r\n]\r\nexport function formatTaskBrief(brief = {}) {\r\n  const rows = BRIEF_FIELDS.map(([key, label]) => [label, typeof brief?.[key] === 'string' ? brief[key].trim().slice(0, 2000) : '']).filter(([, value]) => value)\r\n  return rows.length ? '【本次填写的任务要求】\\n' + rows.map(([label, value]) => label + '：' + value).join('\\n') : ''\r\n}\r\nexport function recentWorkflowIds(current, id) {\r\n  return [id, ...(Array.isArray(current) ? current : [])].filter((item, index, rows) => typeof item === 'string' && rows.indexOf(item) === index).slice(0, 8)\r\n}\r\nfunction matchesWorkflowNeedle(haystack, needle) {\r\n  if (haystack.includes(needle)) return true\r\n  if (!/^[\\p{Script=Han}]{4,}$/u.test(needle)) return false\r\n  const middle = Math.ceil([...needle].length / 2)\r\n  const chars = [...needle]\r\n  return [chars.slice(0, middle).join(''), chars.slice(middle).join('')].every(part => haystack.includes(part))\r\n}\r\nexport function filterWorkflowList(rows, { query = '', filter = 'all', favorites = [], recent = [] } = {}) {\r\n  const needles = String(query).trim().toLocaleLowerCase('zh-CN').split(/\\s+/).filter(Boolean)\r\n  const fav = Array.isArray(favorites) ? favorites : [], seen = Array.isArray(recent) ? recent : []\r\n  return rows.filter(item => {\r\n    const haystack = [item.title, item.desc, item.tag, item.role, item.group, ...(item.keywords || []), ...(item.inputs || []), ...(item.outputs || [])].join(' ').toLocaleLowerCase('zh-CN')\r\n    return (filter !== 'favorites' || fav.includes(item.id)) && (filter !== 'recent' || seen.includes(item.id)) && needles.every(word => matchesWorkflowNeedle(haystack, word))\r\n  }).sort((a, b) => filter === 'recent' ? seen.indexOf(a.id) - seen.indexOf(b.id) : Number(fav.includes(b.id)) - Number(fav.includes(a.id)))\r\n}\r\n\n~~~~~~\n\n## src/workflow-tools.jsx\n\nSHA-256: b7808fbe7053784f3530e48e2c65fef471010c3017f63db71ef1f1b1712d8083\n\n~~~~~~text\nimport React from 'react'\r\nimport { BRIEF_FIELDS } from './workflow-tools.js'\r\n\r\nexport function TaskBrief({ value, onChange }) {\r\n  return \u003csection className=\"wbPro_brief\" aria-label=\"填写本次任务要求\">\r\n    \u003cheader>\u003cdiv>\u003csmall>TASK BRIEF · 任务准备\u003c/small>\u003ch3>把这次要做的事，说清楚\u003c/h3>\u003cp>选填即可。填写内容同步到完整提示词；准备好后带入对话，由你确认发送。\u003c/p>\u003c/div>\u003cbutton type=\"button\" onClick={() => onChange({})}>清空填写\u003c/button>\u003c/header>\r\n    \u003cdiv className=\"wbPro_briefGrid\">{BRIEF_FIELDS.map(([key, label, placeholder]) => \u003clabel key={key} className={key === 'goal' || key === 'requirements' ? 'is-wide' : ''}>{label}{key === 'requirements' ? \u003ctextarea aria-label={label} value={value[key] || ''} maxLength={2000} placeholder={placeholder} onChange={event => onChange({ ...value, [key]: event.target.value })}/> : \u003cinput aria-label={label} value={value[key] || ''} maxLength={500} placeholder={placeholder} onChange={event => onChange({ ...value, [key]: event.target.value })}/>}\u003c/label>)}\u003c/div>\r\n    \u003cfooter>仅用于本次任务 · 原始文件保持不变 · 切换工作流后清空填写\u003c/footer>\r\n  \u003c/section>\r\n}\r\nexport function WorkflowFilter({ value, onChange }) {\r\n  return \u003cdiv className=\"wbPro_filters\" role=\"group\" aria-label=\"工作流筛选\">{[['all', '全部场景'], ['favorites', '我的收藏'], ['recent', '最近查看']].map(([key, label]) => \u003cbutton type=\"button\" key={key} aria-pressed={value === key} onClick={() => onChange(key)}>{label}\u003c/button>)}\u003c/div>\r\n}\r\nexport function WorkbenchPolish() {\r\n  return null\r\n}\r\nexport { WORKBENCH_POLISH_CSS } from './workflow-tools-styles.js'\r\n\n~~~~~~\n\n## test/clipboard.test.mjs\n\nSHA-256: 90caf24cafa69eadefdf23d54d533785e5ce8d4c094ecb2bc73da09104f93e3b\n\n~~~~~~text\nimport test from 'node:test'\r\nimport assert from 'node:assert/strict'\r\nimport { copyText } from '../src/clipboard.js'\r\n\r\nfunction fixture(t, clipboard, copied) {\r\n  const originalNavigator = Object.getOwnPropertyDescriptor(globalThis, 'navigator')\r\n  const originalDocument = Object.getOwnPropertyDescriptor(globalThis, 'document')\r\n  let removed = 0\r\n  const element = { style: {}, select() {}, remove() { removed++ } }\r\n  Object.defineProperty(globalThis, 'navigator', { value: { clipboard }, configurable: true })\r\n  Object.defineProperty(globalThis, 'document', { value: { createElement: () => element, body: { appendChild() {} }, execCommand: () => copied }, configurable: true })\r\n  t.after(() => {\r\n    if (originalNavigator) Object.defineProperty(globalThis, 'navigator', originalNavigator); else delete globalThis.navigator\r\n    if (originalDocument) Object.defineProperty(globalThis, 'document', originalDocument); else delete globalThis.document\r\n  })\r\n  return { element, removed: () => removed }\r\n}\r\n\r\ntest('modern clipboard writes the actual prompt', async t => {\r\n  let text\r\n  fixture(t, { writeText: async value => { text = value } }, false)\r\n  await copyText('实际财务任务')\r\n  assert.equal(text, '实际财务任务')\r\n})\r\n\r\ntest('clipboard denial falls back to selection copy and cleans up its temporary field', async t => {\r\n  const f = fixture(t, { writeText: async () => { throw new Error('denied') } }, true)\r\n  await copyText('完整提示词')\r\n  assert.equal(f.element.value, '完整提示词')\r\n  assert.equal(f.removed(), 1)\r\n})\r\n\r\ntest('failure of both clipboard methods is reported instead of claiming success', async t => {\r\n  const f = fixture(t, undefined, false)\r\n  await assert.rejects(copyText('未复制内容'), /剪贴板不可用/)\r\n  assert.equal(f.removed(), 1)\r\n})\r\n\n~~~~~~\n\n## test/finance-dashboard-helpers.test.mjs\n\nSHA-256: c2c5308a884440f79693324fefbdf49f4f6992eb85b834f761d2c89636f41d08\n\n~~~~~~text\nimport test from 'node:test'\r\nimport assert from 'node:assert/strict'\r\nimport { buildFinanceBackup, canCloseFinanceException, closeProgress, dueLabel, emptyFinanceSnapshot, financeExceptionRisk, financeExceptionsToCsv, greetingFor, localDateKey, normalizeFinanceException, normalizeFinanceSnapshot, normalizeTodo, parseFinanceBackup, shiftDate, snapshotProfit, snapshotBudgetDifference, summarizeFinanceExceptions, workflowsForView } from '../src/finance-dashboard-helpers.js'\r\n\r\ntest('date helpers use local dates and stable due labels', () => {\r\n  const date = new Date(2026, 7, 21, 9, 0, 0)\r\n  assert.equal(localDateKey(date), '2026-08-21')\r\n  assert.equal(shiftDate('2026-08-21', 1), '2026-08-22')\r\n  assert.equal(dueLabel('2026-08-20', '2026-08-21'), '逾期 1 天')\r\n  assert.equal(dueLabel('2026-08-22', '2026-08-21'), '明天')\r\n  assert.equal(greetingFor(date), '早上好')\r\n})\r\n\r\ntest('todo normalization and close progress remain deterministic', () => {\r\n  assert.deepEqual(normalizeTodo({ id: 'a', text: '  核对 ', priority: '未知', done: 1 }, '2026-08-21'), { id: 'a', text: '核对', category: '通用', due: '2026-08-21', priority: '中', done: true })\r\n  assert.deepEqual(closeProgress([{ done: true }, { done: false }, { done: true }]), { done: 2, total: 3, percent: 67 })\r\n})\r\n\r\ntest('backup round trip validates product, version and required collections', () => {\r\n  const backup = buildFinanceBackup({ profile: {}, todos: [], closeTasks: [], favorites: [], fieldDictionary: [], settings: {}, exceptions: [], theme: 'sand' })\r\n  assert.equal(parseFinanceBackup(JSON.stringify(backup)).product, 'dsh-finance-workbench')\r\n  assert.equal(backup.theme, 'sand')\r\n  assert.deepEqual(backup.exceptions, [])\r\n  assert.throws(() => parseFinanceBackup('{\"product\":\"other\",\"version\":2}'), /不是有效/)\r\n  assert.throws(() => parseFinanceBackup({ product: 'dsh-finance-workbench', version: 2, todos: [] }), /内容不完整/)\r\n})\r\n\r\ntest('finance exceptions normalize, score and summarize material risks', () => {\r\n  const today = '2026-08-22'\r\n  const high = normalizeFinanceException({ title: '  未达账项待确认  ', category: '对账', severity: '高', amount: '150000', owner: '总账会计', due: '2026-08-21' }, today)\r\n  const closed = normalizeFinanceException({ title: '已核销', severity: '高', amount: 500000, due: '2026-08-20', status: '已关闭', evidence: '凭证 001 已复核' }, today)\r\n  assert.equal(high.title, '未达账项待确认')\r\n  assert.equal(financeExceptionRisk(high, { largeAmount: 100000 }, today), 100)\r\n  assert.equal(financeExceptionRisk(closed, { largeAmount: 100000 }, today), 0)\r\n  assert.deepEqual(summarizeFinanceExceptions([high, closed], { largeAmount: 100000 }, today), { open: 1, high: 1, overdue: 1, waiting: 0, amount: 150000, closed: 1 })\r\n})\r\n\r\ntest('finance exception closure requires evidence and CSV remains Excel friendly', () => {\r\n  assert.equal(canCloseFinanceException({ evidence: '凭证已核销' }), true)\r\n  assert.equal(canCloseFinanceException({ evidence: '无' }), false)\r\n  const csv = financeExceptionsToCsv([{ title: '金额,日期差异', category: '对账', severity: '中', amount: 200, owner: '复核岗', due: '2026-08-22', source: '流水第2行', evidence: '凭证号 A-01' }])\r\n  assert.ok(csv.startsWith('\\uFEFF'))\r\n  assert.match(csv, /\"金额,日期差异\"/)\r\n  assert.match(csv, /\"凭证号 A-01\"/)\r\n})\r\n\r\ntest('finance snapshots normalize numbers and calculate profit safely', () => {\r\n  assert.deepEqual(emptyFinanceSnapshot('2026-08'), { period: '2026-08', income: '', expense: '', cash: '', receivable: '', payable: '', budget: '', note: '' })\r\n  const snapshot = normalizeFinanceSnapshot({ period: '2026-08', income: '1540000', expense: 980000, cash: -1, note: '  已复核  ' })\r\n  assert.equal(snapshot.income, 1540000)\r\n  assert.equal(snapshot.cash, '')\r\n  assert.equal(snapshot.note, '已复核')\r\n  assert.equal(snapshotProfit(snapshot), 560000)\r\n  assert.equal(snapshotProfit({ income: '', expense: 10 }), null)\r\n})\r\n\r\ntest('budget comparison handles missing values and decimal amounts', () => {\r\n  assert.equal(snapshotBudgetDifference({ expense: 40000.20, budget: 35000 }), 5000.20)\r\n  assert.equal(snapshotBudgetDifference({ expense: 0.1, budget: 0.3 }), -0.2)\r\n  assert.equal(snapshotBudgetDifference({ expense: '', budget: 0 }), null)\r\n  assert.equal(snapshotBudgetDifference({ expense: 0, budget: null }), null)\r\n})\r\n\r\ntest('module routing exposes focused finance workflows', () => {\r\n  const workflows = [{ id: 'a', group: 'data' }, { id: 'b', group: 'tax' }, { id: 'budget-variance', group: 'analysis' }, { id: 'month', group: 'close' }]\r\n  assert.deepEqual(workflowsForView(workflows, 'reconcile').map(item => item.id), ['a'])\r\n  assert.deepEqual(workflowsForView(workflows, 'tax').map(item => item.id), ['b'])\r\n  assert.deepEqual(workflowsForView(workflows, 'capital').map(item => item.id), ['budget-variance'])\r\n  assert.deepEqual(workflowsForView(workflows, 'close').map(item => item.id), ['month'])\r\n})\r\n\r\ntest('backup validation rejects malformed rows, duplicate IDs and invalid calendar dates before restore', () => {\r\n  const empty = () => buildFinanceBackup({ profile: { period: '2026-10' }, settings: {}, todos: [], closeTasks: [], favorites: [], fieldDictionary: [] })\r\n  const todo = { id: 'todo-1', text: '核对流水', category: '对账', due: '2026-10-08', priority: '中', done: false }\r\n  for (const todos of [[null], [{ ...todo, due: '2026-02-30' }], [{ ...todo, done: 'false' }], [todo, todo]]) {\r\n    assert.throws(() => parseFinanceBackup({ ...empty(), todos }), /备份/)\r\n  }\r\n  assert.throws(() => parseFinanceBackup({ ...empty(), profile: { period: '2026-13' } }), /期间/)\r\n  assert.throws(() => parseFinanceBackup({ ...empty(), auditLog: [{ id: 'a', at: 'not-a-date' }] }), /时间/)\r\n  assert.throws(() => parseFinanceBackup({ ...empty(), favorites: [{}] }), /收藏/)\r\n  assert.throws(() => parseFinanceBackup({ ...empty(), settings: { dateTolerance: 32 } }), /容差/)\r\n  assert.throws(() => parseFinanceBackup({ ...empty(), exceptions: [{ ...normalizeFinanceException({ title: '待核', due: '2026-10-08' }), status: '已关闭', evidence: '' }] }), /处置证据/)\r\n  const valid = { ...empty(), todos: [{ ...todo, due: '2028-02-29' }], pinnedFiles: ['财务资料/字段字典.xlsx'], recentWorkflows: ['bank-reconcile'] }\r\n  assert.deepEqual(parseFinanceBackup(valid).pinnedFiles, valid.pinnedFiles)\r\n  // Legacy v2 exports without the newly added collections stay readable.\r\n  delete valid.pinnedFiles; delete valid.recentWorkflows\r\n  assert.equal(parseFinanceBackup(valid).todos.length, 1)\r\n})\r\n\r\ntest('cent precision, invalid dates and missing closure evidence cannot corrupt finance totals', () => {\r\n  assert.equal(snapshotProfit({ income: 0.3, expense: 0.2 }), 0.1)\r\n  assert.equal(summarizeFinanceExceptions([{ amount: 0.1 }, { amount: 0.2 }]).amount, 0.3)\r\n  assert.equal(normalizeTodo({ due: '2026-02-30' }, '2026-10-08').due, '2026-10-08')\r\n  assert.equal(normalizeFinanceSnapshot({ period: '2026-13' }, '2026-10').period, '2026-10')\r\n  assert.equal(normalizeFinanceException({ status: '已关闭', evidence: '' }).status, '未处理')\r\n})\r\n\r\ntest('CSV export neutralizes formula cells while retaining ordinary Chinese text', () => {\r\n  const csv = financeExceptionsToCsv([{ title: '=1+1', owner: '\\t=1+1', source: '@SUM(A1)', evidence: '+危险公式', category: '对账' }])\r\n  for (const value of [\"'=1+1\", \"'=1+1\", \"'@SUM(A1)\", \"'+危险公式\"]) assert.ok(csv.includes(value))\r\n  assert.ok(csv.includes('\"对账\"'))\r\n})\r\n\n~~~~~~\n\n## test/finance-data.test.mjs\n\nSHA-256: 21489254723263240b26dd6ebf118160aa2a61c553961e0752bcde5cb502abd1\n\n~~~~~~text\nimport test from 'node:test'\r\nimport assert from 'node:assert/strict'\r\nimport { FINANCE_MODULES, FINANCE_WORKFLOWS, NAV_GROUPS, NAV_ITEMS, SOP_STEPS } from '../src/finance-data.js'\r\n\r\ntest('finance catalog contains 25 consistently numbered workflows and three advanced scenarios', () => {\r\n  assert.equal(FINANCE_WORKFLOWS.length, 25)\r\n  assert.deepEqual(FINANCE_WORKFLOWS.map(item => item.number), Array.from({ length: 25 }, (_, index) => String(index + 1).padStart(2, '0')))\r\n  assert.equal(new Set(FINANCE_WORKFLOWS.map(item => item.id)).size, 25)\r\n  assert.equal(FINANCE_WORKFLOWS.filter(item => item.extension).length, 3)\r\n})\r\n\r\ntest('every workflow is executable and includes controls, steps and deliverables', () => {\r\n  for (const item of FINANCE_WORKFLOWS) {\r\n    assert.ok(item.title && item.role && item.desc)\r\n    assert.ok(item.inputs.length >= 3, item.title)\r\n    assert.ok(item.minimumInputs.length >= 2, item.title)\r\n    assert.match(item.beginnerTip, /先准备/)\r\n    assert.match(item.sampleRequest, new RegExp(item.title))\r\n    assert.ok(item.rules.length >= 4, item.title)\r\n    assert.equal(item.steps.length, 7, item.title)\r\n    assert.ok(item.outputs.includes('处理日志与规则版本'), item.title)\r\n    assert.ok(item.checklist.length >= 4, item.title)\r\n    assert.match(item.prompt, /先输出字段映射|处理目标/)\r\n  }\r\n})\r\n\r\ntest('the standard SOP has eight controlled implementation steps', () => {\r\n  assert.equal(SOP_STEPS.length, 8)\r\n  assert.deepEqual(SOP_STEPS.map(item => item[0]), ['01', '02', '03', '04', '05', '06', '07', '08'])\r\n})\r\n\r\ntest('management desk exposes the 19 requested modules plus exception control in grouped navigation', () => {\r\n  assert.equal(NAV_ITEMS.length, 20)\r\n  assert.deepEqual(NAV_ITEMS.map(item => item[1]), ['财务总览', '收入管理', '应收账款', '应付账款', '费用报销', '资金管理', '预算管理', '固定资产', '税务管理', '发票管理', '工资管理', '银行对账', '成本核算', '财务报表', '财务分析', '投资管理', '异常控制台', '审计日志', '数据备份', '系统设置'])\r\n  assert.deepEqual(NAV_GROUPS.filter(group => group.label).map(group => group.label), ['经营与往来', '核算与合规', '报告与决策', '治理与系统'])\r\n})\r\n\r\ntest('each professional module has a complete process and valid workflow links', () => {\r\n  assert.equal(Object.keys(FINANCE_MODULES).length, 16)\r\n  const workflowIds = new Set(FINANCE_WORKFLOWS.map(item => item.id))\r\n  for (const module of Object.values(FINANCE_MODULES)) {\r\n    assert.equal(module.process.length, 4, module.title)\r\n    assert.ok(module.controls.length >= 4, module.title)\r\n    assert.ok(module.deliverables.length >= 3, module.title)\r\n    assert.ok(module.workflowIds.length >= 2, module.title)\r\n    for (const workflowId of module.workflowIds) assert.ok(workflowIds.has(workflowId), `${module.title}: ${workflowId}`)\r\n  }\r\n})\r\n\n~~~~~~\n\n## test/finance-storage.test.mjs\n\nSHA-256: a9223bdbc59f2affc507803d83d6eda16798fb5c4c77edd24d1c40932efb8a52\n\n~~~~~~text\nimport test from 'node:test'\r\nimport assert from 'node:assert/strict'\r\nimport { buildFinanceBackup } from '../src/finance-dashboard-helpers.js'\r\nimport { STORE_PREFIX, readFinanceStore, writeFinanceStore, storageIssueSnapshot, commitFinanceRestore } from '../src/finance-storage.js'\r\n\r\nfunction fixture() {\r\n  const map = new Map()\r\n  return { map, getItem: key => map.get(key) ?? null, setItem: (key, value) => map.set(key, value), removeItem: key => map.delete(key) }\r\n}\r\n\r\ntest('blocked localStorage access leaves the dashboard usable and restore fails safely', () => {\r\n  const descriptor = Object.getOwnPropertyDescriptor(globalThis, 'localStorage')\r\n  Object.defineProperty(globalThis, 'localStorage', { configurable: true, get() { throw new Error('storage blocked') } })\r\n  try {\r\n    assert.deepEqual(readFinanceStore('favorites', []), [])\r\n    assert.equal(writeFinanceStore('favorites', []), false)\r\n    assert.throws(() => commitFinanceRestore({}, {}), /无法保留恢复前副本/)\r\n  } finally {\r\n    if (descriptor) Object.defineProperty(globalThis, 'localStorage', descriptor)\r\n    else delete globalThis.localStorage\r\n    writeFinanceStore('favorites', [], fixture())\r\n  }\r\n})\r\n\r\ntest('corrupt local state is preserved and storage denial is visible to the user', () => {\r\n  const store = fixture()\r\n  store.setItem(`${STORE_PREFIX}todos`, '{broken')\r\n  assert.deepEqual(readFinanceStore('todos', [], store), [])\r\n  assert.equal(store.getItem(`${STORE_PREFIX}todos`), '{broken')\r\n  assert.match(storageIssueSnapshot(), /原存储已保留/)\r\n  assert.equal(writeFinanceStore('todos', [], { setItem() { throw new Error('quota') } }), false)\r\n  assert.match(storageIssueSnapshot(), /保存未完成/)\r\n  assert.equal(writeFinanceStore('todos', [], store), true)\r\n  assert.equal(storageIssueSnapshot(), '')\r\n})\r\n\r\ntest('restore keeps a complete rollback copy including pins and recent workflows', () => {\r\n  const store = fixture()\r\n  const current = buildFinanceBackup({ profile: { name: '原主体' }, settings: {}, todos: [], closeTasks: [], favorites: [], fieldDictionary: [], pinnedFiles: ['原资料.xlsx'], recentWorkflows: ['bank-reconcile'] })\r\n  const restored = { ...current, profile: { name: '新主体' }, pinnedFiles: ['新资料.xlsx'] }\r\n  commitFinanceRestore(current, restored, store)\r\n  assert.deepEqual(JSON.parse(store.getItem(`${STORE_PREFIX}beforeRestore`)), current)\r\n  assert.deepEqual(JSON.parse(store.getItem(`${STORE_PREFIX}pinnedFiles`)), ['新资料.xlsx'])\r\n  assert.deepEqual(JSON.parse(store.getItem(`${STORE_PREFIX}recentWorkflows`)), ['bank-reconcile'])\r\n})\r\n\r\ntest('partial restore write failure rolls back every already changed storage key', () => {\r\n  const store = fixture()\r\n  const original = JSON.stringify({ name: '原主体' })\r\n  store.setItem(`${STORE_PREFIX}profile`, original)\r\n  const realSet = store.setItem\r\n  let failing = true\r\n  store.setItem = (key, value) => {\r\n    if (key === `${STORE_PREFIX}closeTasks` && failing) { failing = false; throw new Error('quota') }\r\n    realSet(key, value)\r\n  }\r\n  const current = buildFinanceBackup({ profile: { name: '原主体' }, settings: {}, todos: [], closeTasks: [], favorites: [], fieldDictionary: [] })\r\n  assert.throws(() => commitFinanceRestore(current, { ...current, profile: { name: '新主体' } }, store), /原数据已保留/)\r\n  assert.equal(store.getItem(`${STORE_PREFIX}profile`), original)\r\n  assert.equal(store.getItem(`${STORE_PREFIX}todos`), null)\r\n  assert.deepEqual(JSON.parse(store.getItem(`${STORE_PREFIX}beforeRestore`)), current)\r\n})\r\n\n~~~~~~\n\n## test/helpers.test.mjs\n\nSHA-256: 99cf30a573e92b15ecb6c47dda4a734c61e0065f21105b772cdbaf499522c76b\n\n~~~~~~text\nimport test from 'node:test'\r\nimport assert from 'node:assert/strict'\r\nimport { isFinanceFile, isInside, safeUploadName, safeUploadRelativePath, safeWorkflowId } from '../src/index.js'\r\n\r\ntest('safeUploadName keeps Chinese names and removes unsafe separators', () => {\r\n  assert.equal(safeUploadName(' 银行 流水.xlsx '), '_银行_流水.xlsx_')\r\n  assert.equal(safeUploadName('../../报销明细.xlsx'), '报销明细.xlsx')\r\n})\r\n\r\ntest('safeUploadRelativePath preserves safe folders and blocks traversal', () => {\r\n  assert.equal(safeUploadRelativePath('2026年/发票/差旅 01.pdf', 'ignored.pdf'), '2026年/发票/差旅_01.pdf')\r\n  assert.equal(safeUploadRelativePath('', '合同 台账.xlsx'), '合同_台账.xlsx')\r\n  assert.throws(() => safeUploadRelativePath('../工资表/明细.xlsx', '明细.xlsx'), /无效目录/)\r\n  assert.throws(() => safeUploadRelativePath('/绝对路径/文件.pdf', '文件.pdf'), /上传路径无效/)\r\n})\r\n\r\ntest('isInside rejects traversal and accepts descendants', () => {\r\n  assert.equal(isInside('/tmp/work', '/tmp/work/财务资料/a.xlsx'), true)\r\n  assert.equal(isInside('/tmp/work', '/tmp/other/a.xlsx'), false)\r\n})\r\n\r\ntest('isFinanceFile accepts supported finance artifacts only', () => {\r\n  assert.equal(isFinanceFile('银行流水.XLSX'), true)\r\n  assert.equal(isFinanceFile('合同.pdf'), true)\r\n  assert.equal(isFinanceFile('说明.md'), true)\r\n  assert.equal(isFinanceFile('plugin.js'), false)\r\n  assert.equal(isFinanceFile('密钥.env'), false)\r\n})\r\n\r\ntest('safeWorkflowId only accepts deterministic internal names', () => {\r\n  assert.equal(safeWorkflowId('Bank-Reconcile'), 'bank-reconcile')\r\n  assert.throws(() => safeWorkflowId('../invoice'), /无效/)\r\n  assert.throws(() => safeWorkflowId('发票'), /无效/)\r\n})\r\n\n~~~~~~\n\n## test/installers.test.mjs\n\nSHA-256: e92017ab859fa60fdc5713e1c2f55531552af2f189f25f896daed3549c427861\n\n~~~~~~text\nimport test from 'node:test'\r\nimport assert from 'node:assert/strict'\r\nimport { execFile } from 'node:child_process'\r\nimport { promisify } from 'node:util'\r\nimport { mkdtemp, mkdir, readFile, writeFile, readdir, rm } from 'node:fs/promises'\r\nimport { tmpdir } from 'node:os'\r\nimport { join } from 'node:path'\r\nimport { fileURLToPath } from 'node:url'\r\nconst run = promisify(execFile)\r\nconst script = fileURLToPath(new URL('../scripts/workbuddy-install.mjs', import.meta.url))\r\n\r\nasync function fixture(t) {\r\n  const home = await mkdtemp(join(tmpdir(), 'installer-test-'))\r\n  t.after(() => rm(home, { recursive: true, force: true }))\r\n  const app = join(home, 'apps', 'finance-workbench'), skill = join(home, 'skills', 'finance-workbench')\r\n  for (const directory of [app, skill]) { await mkdir(directory, { recursive: true }); await writeFile(join(directory, 'user-note.txt'), '用户原资料') }\r\n  const execute = (...args) => run(process.execPath, [script, ...args], { env: { ...process.env, WORKBUDDY_HOME: home } })\r\n  return { home, app, skill, config: join(home, '.mcp.json'), execute }\r\n}\r\n\r\ntest('malformed config aborts both installation and removal without changing user data', async t => {\r\n  const f = await fixture(t)\r\n  for (const config of ['{broken', '[]', '{\"mcpServers\":[]}']) {\r\n    await writeFile(f.config, config)\r\n    for (const action of ['install', 'uninstall']) {\r\n      await assert.rejects(f.execute(action), /配置/)\r\n      assert.equal(await readFile(f.config, 'utf8'), config)\r\n      for (const directory of [f.app, f.skill]) assert.equal(await readFile(join(directory, 'user-note.txt'), 'utf8'), '用户原资料')\r\n    }\r\n  }\r\n})\r\n\r\ntest('updates preserve unrelated config, custom finance settings and distinct recoverable backups', async t => {\r\n  const f = await fixture(t)\r\n  const config = { marker: 'keep', mcpServers: { other: { command: 'fixture' }, 'finance-workbench': { disabled: false, env: { USER_SETTING: 'keep' } } } }\r\n  await writeFile(f.config, '\\uFEFF' + JSON.stringify(config))\r\n  await f.execute('install', '--dry-run')\r\n  assert.equal(await readFile(join(f.app, 'user-note.txt'), 'utf8'), '用户原资料')\r\n  await f.execute('install')\r\n  await f.execute('install')\r\n  const installed = JSON.parse(await readFile(f.config, 'utf8'))\r\n  assert.equal(installed.marker, 'keep')\r\n  assert.deepEqual(installed.mcpServers.other, config.mcpServers.other)\r\n  assert.equal(installed.mcpServers['finance-workbench'].env.USER_SETTING, 'keep')\r\n  if (process.platform === 'win32' && process.env.LOCALAPPDATA)\r\n    assert.equal(installed.mcpServers['finance-workbench'].env.LOCALAPPDATA, process.env.LOCALAPPDATA)\r\n  const backups = (await readdir(join(f.home, 'apps'))).filter(name => name.startsWith('finance-workbench.backup-'))\r\n  assert.equal(backups.length, 2)\r\n  const retained = await Promise.all(backups.map(name => readFile(join(f.home, 'apps', name, 'user-note.txt'), 'utf8').catch(() => '')))\r\n  assert.ok(retained.includes('用户原资料'))\r\n  await f.execute('uninstall')\r\n  const removed = JSON.parse(await readFile(f.config, 'utf8'))\r\n  assert.equal(removed.mcpServers['finance-workbench'], undefined)\r\n  assert.deepEqual(removed.mcpServers.other, config.mcpServers.other)\r\n  assert.ok((await readdir(join(f.home, 'apps'))).some(name => name.startsWith('finance-workbench.uninstalled-')))\r\n})\r\n\r\ntest('native Shell or PowerShell wrapper invokes the shared installer and propagates failure', async t => {\r\n  const f = await fixture(t)\r\n  const windows = process.platform === 'win32'\r\n  const wrapper = fileURLToPath(new URL(`../scripts/install-workbuddy-app.${windows ? 'ps1' : 'sh'}`, import.meta.url))\r\n  const command = windows ? 'powershell.exe' : 'bash'\r\n  const args = windows ? ['-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', wrapper, '-DryRun'] : [wrapper, '--dry-run']\r\n  const env = { ...process.env, WORKBUDDY_HOME: f.home }\r\n  assert.match((await run(command, args, { env })).stdout, /预检通过/)\r\n  await writeFile(f.config, '{broken')\r\n  await assert.rejects(run(command, args, { env }))\r\n})\r\n\r\ntest('desktop MCP config is preserved, updated and restored independently of CLI config', async t => {\r\n  const f = await fixture(t), desktop = join(f.home, 'mcp.json')\r\n  const original = { marker: 'desktop', mcpServers: { unrelated: { type: 'stdio', command: 'example' } } }\r\n  await writeFile(desktop, JSON.stringify(original))\r\n  await f.execute('install')\r\n  const configured = JSON.parse(await readFile(desktop, 'utf8'))\r\n  assert.deepEqual(configured.mcpServers.unrelated, original.mcpServers.unrelated)\r\n  assert.equal(configured.mcpServers['finance-workbench'].type, 'stdio')\r\n  assert.equal(await readFile(join(f.app, 'team-cli.mjs'), 'utf8').then(x => x.length > 0), true)\r\n  await f.execute('uninstall')\r\n  assert.deepEqual(JSON.parse(await readFile(desktop, 'utf8')), original)\r\n})\r\n\r\ntest('invalid desktop config aborts installation without changing CLI config', async t => {\r\n  const f = await fixture(t), desktop = join(f.home, 'mcp.json')\r\n  await writeFile(f.config, '{\"mcpServers\":{\"other\":{\"command\":\"keep\"}}}')\r\n  await writeFile(desktop, '{broken')\r\n  await assert.rejects(f.execute('install'), /配置/)\r\n  assert.equal(await readFile(desktop, 'utf8'), '{broken')\r\n  assert.equal(JSON.parse(await readFile(f.config, 'utf8')).mcpServers.other.command, 'keep')\r\n})\r\n\n~~~~~~\n\n## test/public-release.test.mjs\n\nSHA-256: efa42a5cfeb89e70e9959e9d1b55c163e65d897d740484d5ae9fadfaebc1a03f\n\n~~~~~~text\nimport test from 'node:test'\r\nimport assert from 'node:assert/strict'\r\nimport { access, readFile, readdir } from 'node:fs/promises'\r\n\r\ntest('public package contains beginner docs and agent artifacts', async () => {\r\n  const files = [\r\n    'README.md',\r\n    'docs/INSTALL_DSH.md',\r\n    'docs/INSTALL_AGENT.md',\r\n    'docs/INSTALL_WORKBUDDY.md',\r\n    'docs/images/readme-hero.png',\r\n    'docs/images/dashboard-desktop.png',\r\n    'docs/images/dashboard-mobile.png',\r\n    'docs/images/exception-control.png',\r\n    'docs/images/theme-night.png',\r\n    'agents/finance-workbench/SKILL.md',\r\n    'agents/finance-workbench/references/workflows.json',\r\n    'agents/finance-workbench/references/prompts/README.md',\r\n    'scripts/install-agent.sh',\r\n    'scripts/install-dsh.sh',\r\n    'scripts/install-workbuddy-app.sh',\r\n    'workbuddy/widget.html',\r\n  ]\r\n  await Promise.all(files.map(file => access(new URL(`../${file}`, import.meta.url))))\r\n  const catalog = JSON.parse(await readFile(new URL('../agents/finance-workbench/references/workflows.json', import.meta.url), 'utf8'))\r\n  assert.equal(catalog.workflows.length, 25)\r\n  assert.equal(catalog.productVersion, JSON.parse(await readFile(new URL('../package.json', import.meta.url), 'utf8')).version)\r\n  const promptFiles = (await readdir(new URL('../agents/finance-workbench/references/prompts/', import.meta.url))).filter(file => /^\\d{2}-.+\\.md$/.test(file))\r\n  assert.equal(promptFiles.length, 25)\r\n  for (const workflow of catalog.workflows) {\r\n    const filename = `${workflow.number}-${workflow.id}.md`\r\n    assert.ok(promptFiles.includes(filename), filename)\r\n    const prompt = await readFile(new URL(`../agents/finance-workbench/references/prompts/${filename}`, import.meta.url), 'utf8')\r\n    assert.match(prompt, new RegExp(`【财务任务包】${workflow.title}`))\r\n    assert.match(prompt, /【新手填写区/)\r\n  }\r\n})\r\n\r\ntest('public defaults use generic demonstration identity', async () => {\r\n  const dashboard = await readFile(new URL('../src/finance-dashboard.jsx', import.meta.url), 'utf8')\r\n  const prompt = await readFile(new URL('../src/task-prompt.js', import.meta.url), 'utf8')\r\n  assert.match(dashboard, /name: '财务伙伴'/)\r\n  assert.match(dashboard, /雾光靛蓝/)\r\n  assert.match(dashboard, /松石墨绿/)\r\n  assert.match(dashboard, /暖砂棕金/)\r\n  assert.match(dashboard, /夜航深色/)\r\n  assert.match(dashboard, /data-theme=\\{theme\\}/)\r\n  assert.match(dashboard, /异常要有主人，也要有退出条件/)\r\n  assert.match(dashboard, /25 个财务工作流，每个都有完整提示词/)\r\n  assert.match(dashboard, /复制完整提示词/)\r\n  assert.match(dashboard, /canCloseFinanceException/)\r\n  assert.match(prompt, /你是用户的财务执行助理/)\r\n  assert.doesNotMatch(`${dashboard}\\n${prompt}`, new RegExp(['永', '模'].join('')))\r\n})\r\n\r\ntest('package, lock, MCP App, plugin metadata and Skill share the same version', async () => {\r\n  const read = file => readFile(new URL(`../${file}`, import.meta.url), 'utf8')\r\n  const pkg = JSON.parse(await read('package.json'))\r\n  const lock = JSON.parse(await read('package-lock.json'))\r\n  const plugin = JSON.parse(await read('.codebuddy-plugin/plugin.json'))\r\n  const { VERSION } = await import('../src/version.js')\r\n  assert.equal(lock.version, pkg.version)\r\n  assert.equal(lock.packages[''].version, pkg.version)\r\n  assert.equal(plugin.version, pkg.version)\r\n  assert.equal(VERSION, pkg.version)\r\n  assert.ok((await read('agents/finance-workbench/SKILL.md')).includes(`version: \"${pkg.version}\"`))\r\n  for (const file of ['scripts/workbuddy-install.mjs', 'scripts/uninstall-workbuddy-app.sh', 'scripts/uninstall-workbuddy-app.ps1']) assert.ok(pkg.files.includes(file))\r\n})\r\n\n~~~~~~\n\n## test/reproduction.test.mjs\n\nSHA-256: e8931bdbe7a9a02dc640b8234cd4c53106e4dd006d970147c622319b28e263d2\n\n~~~~~~text\nimport test from 'node:test'\r\nimport assert from 'node:assert/strict'\r\nimport { readFile } from 'node:fs/promises'\r\nimport { createHash } from 'node:crypto'\r\nconst root=new URL('../',import.meta.url)\r\ntest('offline reproduction package preserves every source hash and full workflow prompt', async()=>{\r\n const html=await readFile(new URL('docs/reproduce/index.html',root),'utf8')\r\n const payload=JSON.parse(html.match(/\u003cscript id=\"data\" type=\"application\\/json\">([\\s\\S]*?)\u003c\\/script>/)[1])\r\n const pkg=JSON.parse(await readFile(new URL('package.json',root),'utf8'))\r\n const teacher=pkg.name.includes('teacher')\r\n const data=await import(new URL(teacher?'src/teacher-workflows.js':'src/finance-data.js',root))\r\n const compose=await import(new URL('src/task-prompt.js',root))\r\n const workflows=teacher?data.TEACHER_WORKFLOWS:data.FINANCE_WORKFLOWS\r\n assert.equal(payload.workflows.length,teacher?12:25)\r\n assert.equal(payload.version,pkg.version)\r\n for(let i=0;i\u003cworkflows.length;i++) assert.equal(payload.workflows[i].prompt,teacher?compose.composeTeacherTask(workflows[i]):compose.composeFinanceTask(workflows[i]))\r\n assert.equal(payload.master,await readFile(new URL('docs/reproduce/MASTER_PROMPT.md',root),'utf8'))\r\n assert.equal(payload.context,await readFile(new URL('docs/reproduce/source-context.md',root),'utf8'))\r\n const manifest=JSON.parse(await readFile(new URL('docs/reproduce/manifest.json',root),'utf8'))\r\n for(const file of manifest.files) assert.equal(createHash('sha256').update(await readFile(new URL(file.path,root))).digest('hex'),file.sha256,file.path)\r\n assert.ok(manifest.files.some(f=>f.path==='package-lock.json'))\r\n assert.doesNotMatch(html,/\u003cscript[^>]+src=/)\r\n})\r\n\n~~~~~~\n\n## test/task-prompt.test.mjs\n\nSHA-256: 7e224883a6dc152906144c426ccbcc854ac4866088a6f386af91aafd89a72b27\n\n~~~~~~text\nimport test from 'node:test'\r\nimport assert from 'node:assert/strict'\r\nimport { composeFinanceLaunch, composeFinanceTask, mergeFinanceLaunchDraft } from '../src/task-prompt.js'\r\n\r\nconst scenario = {\r\n  title: '银行流水与账面核对',\r\n  inputs: ['银行流水.xlsx', '账面记录.xlsx'],\r\n  outputs: ['银行对账结果.xlsx', '对账复核说明.md'],\r\n  prompt: '执行唯一的一对一匹配，不能确定的记录进入疑似匹配。',\r\n  variant: '生成按月汇总的趋势表。',\r\n  checklist: ['每条记录最多参与一次匹配', '双方金额合计一致'],\r\n}\r\n\r\ntest('composeFinanceTask creates an executable, evidence-backed task package', () => {\r\n  const value = composeFinanceTask(scenario)\r\n  assert.match(value, /【财务任务包】银行流水与账面核对/)\r\n  assert.match(value, /【新手填写区（不清楚可留空）】/)\r\n  assert.match(value, /所有必需缺项合并成一次询问/)\r\n  assert.match(value, /【所需资料】[\\s\\S]*银行流水\\.xlsx/)\r\n  assert.match(value, /【交付成果】[\\s\\S]*银行对账结果\\.xlsx/)\r\n  assert.match(value, /当前工作区“输出\\/财务工作台”子目录/)\r\n  assert.match(value, /【模块执行指令】[\\s\\S]*一对一匹配/)\r\n  assert.match(value, /【可选扩展指令】[\\s\\S]*按月汇总/)\r\n  assert.match(value, /- \\[ \\] 每条记录最多参与一次匹配/)\r\n  assert.match(value, /不要只回复操作建议/)\r\n  assert.doesNotMatch(value, /第[一二三四五六七八九十]+章/)\r\n})\r\n\r\ntest('composeFinanceTask validates incomplete module configuration', () => {\r\n  assert.throws(() => composeFinanceTask({ title: '缺失指令' }), /配置不完整/)\r\n})\r\n\r\ntest('composeFinanceLaunch keeps the visible request short and references hidden workflow', () => {\r\n  const value = composeFinanceLaunch(scenario, '财务工作台/内置工作流/bank-reconcile.md', ['财务资料/银行流水.xlsx'])\r\n  assert.match(value, /^@财务工作台\\/内置工作流\\/bank-reconcile\\.md @财务资料\\/银行流水\\.xlsx/)\r\n  assert.match(value, /请执行“银行流水与账面核对”/)\r\n  assert.doesNotMatch(value, /【执行闭环】|【专项核查清单】|一对一匹配/)\r\n  assert.ok(value.length \u003c 180)\r\n})\r\n\r\ntest('mergeFinanceLaunchDraft replaces old generated packages but keeps user notes', () => {\r\n  const launch = '@财务工作台/内置工作流/invoice.md\\n请执行“发票批量识别与报销”。'\r\n  assert.equal(mergeFinanceLaunchDraft('【教师任务包】旧任务\\n很多指令', launch), launch)\r\n  assert.equal(mergeFinanceLaunchDraft('请重点检查三月数据', launch), `请重点检查三月数据\\n\\n${launch}`)\r\n})\r\n\n~~~~~~\n\n## test/team-api-client.test.mjs\n\nSHA-256: 6fa08c18b4922aff873703ac6f854c59b7c39873448c23734821b75820e2deab\n\n~~~~~~text\nimport test from 'node:test'\nimport assert from 'node:assert/strict'\nimport { createTeamClient } from '../src/team-api-client.mjs'\nimport { executeTeamCommand } from '../src/team-adapter.mjs'\nimport { mkdtemp, writeFile, readFile, unlink, rmdir } from 'node:fs/promises'\nimport { tmpdir } from 'node:os'\nimport path from 'node:path'\nimport { saveTeamSession, loadTeamSession, clearTeamSession } from '../src/team-credentials.mjs'\n\nconst session = 'a'.repeat(64)\nconst csrf = 'b'.repeat(64)\nconst order = '30000000-0000-4000-8000-000000000001'\n\ntest('team client rejects unsafe endpoints and invalid session credentials', () => {\n  for (const baseUrl of ['http://example.com', 'https://user:password@example.com', 'https://example.com/path', 'file:///']) {\n    assert.throws(() => createTeamClient({ baseUrl, session, csrf }))\n  }\n  assert.throws(() => createTeamClient({ baseUrl: 'http://127.0.0.1:8081', session: 'bad', csrf }))\n})\n\ntest('team client forwards the employee session and prevents credential exposure in identity output', async () => {\n  const calls = []\n  const client = createTeamClient({ baseUrl: 'http://127.0.0.1:8081', session, csrf, fetchImpl: async (url, opts) => {\n    calls.push({ url: String(url), opts })\n    return new Response(JSON.stringify(url.pathname.endsWith('/me') ? { id: 'employee', csrf } : { ok: true }))\n  } })\n  assert.deepEqual(await client.me(), { id: 'employee' })\n  await client.createRun(order, { version: 1, workflowId: 'workflow', fileIds: [] })\n  assert.equal(calls[1].opts.headers.cookie, `zy_session=${session}`)\n  assert.equal(calls[1].opts.headers['x-csrf-token'], csrf)\n  assert.equal(calls[1].opts.redirect, 'error')\n  assert.throws(() => client.order('../other'), /编号格式/)\n})\n\ntest('team client preserves authorization failures without retrying with elevated credentials', async () => {\n  let calls = 0\n  const client = createTeamClient({ baseUrl: 'https://team.example', session, csrf, fetchImpl: async () => {\n    calls++\n    return new Response(JSON.stringify({ error: '无权访问' }), { status: 403 })\n  } })\n  await assert.rejects(client.order(order), e => e.status === 403 && e.message === '无权访问')\n  assert.equal(calls, 1)\n})\n\ntest('command dispatcher uses only explicit operations and cannot access review actions', async () => {\n  const client = { order: async id => ({ id }) }\n  assert.deepEqual(await executeTeamCommand(client, 'order', { orderId: order }), { id: order })\n  await assert.rejects(executeTeamCommand(client, 'approve', {}), /未知团队命令/)\n  await assert.rejects(executeTeamCommand(client, 'request', { path: '/api/v1/orders' }), /未知团队命令/)\n})\n\ntest('workflow commands preserve the request key and query a specific task', async () => {\n  const calls = []\n  const client = createTeamClient({ baseUrl: 'http://127.0.0.1:8081', session, csrf, fetchImpl: async (url, opts) => {\n    calls.push({ pathname: url.pathname, method: opts.method, body: opts.body && JSON.parse(opts.body) })\n    return new Response(JSON.stringify({ runId: order, state: 'queued' }))\n  } })\n  const body = { version: 1, key: order, workflowId: 'w', fileIds: [order] }\n  await executeTeamCommand(client, 'start-workflow', { orderId: order, ...body })\n  await executeTeamCommand(client, 'start-workflow', { orderId: order, ...body })\n  await executeTeamCommand(client, 'workflow-status', { runId: order })\n  assert.deepEqual(calls[0], { pathname: `/api/v1/orders/${order}/workflow-tasks`, method: 'POST', body })\n  assert.deepEqual(calls[1], calls[0])\n  assert.equal(calls[2].pathname, `/api/v1/workflow-tasks/${order}`)\n  assert.equal(calls[2].method, 'GET')\n  assert.throws(() => client.workflowStatus('../jobs'), /编号格式/)\n})\n\ntest('file handoff stays inside the selected workspace and never overwrites an existing file', async () => {\n  const root = await mkdtemp(path.join(tmpdir(), 'team-handoff-'))\n  const old = process.env.ZY_TEAM_WORKSPACE\n  process.env.ZY_TEAM_WORKSPACE = root\n  try {\n    await writeFile(path.join(root, 'result.txt'), 'synthetic result')\n    let received\n    const client = { uploadRunResult: async (_, data) => { received = data; return { id: 'file' } }, downloadJob: async () => Buffer.from('synthetic package') }\n    await executeTeamCommand(client, 'upload-result', { runId: order, version: 1, filePath: 'result.txt' })\n    assert.equal(received.bytes.toString(), 'synthetic result')\n    await assert.rejects(executeTeamCommand(client, 'upload-result', { runId: order, version: 1, filePath: '../outside.txt' }))\n    await executeTeamCommand(client, 'download-package', { jobId: order, filePath: 'package.zip' })\n    assert.equal((await readFile(path.join(root, 'package.zip'))).toString(), 'synthetic package')\n    await assert.rejects(executeTeamCommand(client, 'download-package', { jobId: order, filePath: 'package.zip' }), /EEXIST/)\n    await unlink(path.join(root, 'package.zip')); await unlink(path.join(root, 'result.txt'))\n  } finally {\n    if (old === undefined) delete process.env.ZY_TEAM_WORKSPACE; else process.env.ZY_TEAM_WORKSPACE = old\n    await rmdir(root)\n  }\n})\n\ntest('Windows employee authorization is encrypted at rest and removable', { skip: process.platform !== 'win32' }, async () => {\n  const root = await mkdtemp(path.join(tmpdir(), 'team-session-'))\n  const old = process.env.LOCALAPPDATA\n  process.env.LOCALAPPDATA = root\n  const credential = { baseUrl: 'https://team.example', session, csrf, workspace: root }\n  try {\n    await saveTeamSession(credential)\n    const encrypted = await readFile(path.join(root, 'ZYFinance', 'workbuddy-session.dat'))\n    assert.equal(encrypted.includes(Buffer.from(session)), false)\n    assert.equal(encrypted.includes(Buffer.from(csrf)), false)\n    assert.deepEqual(await loadTeamSession(), credential)\n    await clearTeamSession()\n    await assert.rejects(loadTeamSession(), /尚未授权/)\n    await rmdir(path.join(root, 'ZYFinance'))\n  } finally {\n    if (old === undefined) delete process.env.LOCALAPPDATA; else process.env.LOCALAPPDATA = old\n    await rmdir(root)\n  }\n})\n\ntest('continuation timeout and malformed receipts preserve the exact request for safe retry', async () => {\n  const body = { key: order, items: [{ itemId: order, action: 'ledger', expectedAttemptId: null, orderVersion: 1, requestVersion: 2, reason: 'synthetic review' }] }\n  for (const failure of ['timeout', 'malformed', 'server']) {\n    const calls = []\n    const client = createTeamClient({ baseUrl: 'http://127.0.0.1:8081', session, csrf, fetchImpl: async (_url, options) => {\n      calls.push(options.body)\n      if (calls.length > 1) return new Response(JSON.stringify({ id: order, items: [], scopeComplete: false }))\n      if (failure === 'timeout') throw new Error('aborted')\n      if (failure === 'malformed') return new Response('\u003chtml>interrupted\u003c/html>')\n      return new Response(JSON.stringify({ error: 'unavailable' }), { status: 500 })\n    } })\n    await assert.rejects(executeTeamCommand(client, 'continue-invoice-batch', { batchId: order, ...body }), e => e.outcomeUnknown === true)\n    assert.equal(calls.length, 1)\n    await executeTeamCommand(client, 'continue-invoice-batch', { batchId: order, ...body })\n    assert.equal(calls[0], calls[1])\n    assert.deepEqual(JSON.parse(calls[1]), body)\n  }\n})\n\ntest('handoff transport refuses error pages and interrupted bodies rather than returning a false download', async () => {\n  for (const response of [\n    new Response('\u003chtml>login\u003c/html>', { headers: { 'content-type': 'text/html' } }),\n    new Response(new ReadableStream({ start(c) { c.enqueue(new Uint8Array([1, 2])); c.error(new Error('interrupted')) } }), { headers: { 'content-type': 'application/json' } }),\n  ]) {\n    const client = createTeamClient({ baseUrl: 'http://127.0.0.1:8081', session, csrf, fetchImpl: async () => response })\n    await assert.rejects(client.downloadInvoiceAccounting(order, 'json'))\n  }\n})\n\n~~~~~~\n\n## test/ui-helpers.test.mjs\n\nSHA-256: ad340d1efbc27198ee766735f31345d9b117e56edae20c40bacf786e259831f9\n\n~~~~~~text\nimport test from 'node:test'\r\nimport assert from 'node:assert/strict'\r\nimport { fileKind, filterFiles, matchScenarioFiles, summarizeFiles } from '../src/ui-helpers.js'\r\n\r\nconst files = [\r\n  { name: '合同.pdf', relative: '财务资料/合同.pdf', size: 100 },\r\n  { name: '流水.xlsx', relative: '财务资料/流水.xlsx', size: 200 },\r\n  { name: '发票.png', relative: '财务资料/发票.png', size: 300 },\r\n]\r\n\r\ntest('fileKind classifies common finance files', () => {\r\n  assert.equal(fileKind('a.pdf'), 'document')\r\n  assert.equal(fileKind('a.xlsx'), 'sheet')\r\n  assert.equal(fileKind('a.pptx'), 'slides')\r\n  assert.equal(fileKind('a.png'), 'image')\r\n})\r\n\r\ntest('filterFiles combines query and kind', () => {\r\n  assert.equal(filterFiles(files, '合同', 'all', 'all').length, 1)\r\n  assert.equal(filterFiles(files, '', 'sheet', 'all')[0].name, '流水.xlsx')\r\n  assert.equal(filterFiles(files, '', 'document', 'all').length, 1)\r\n})\r\n\r\ntest('summarizeFiles totals counts and bytes', () => {\r\n  assert.deepEqual(summarizeFiles(files), { total: 3, bytes: 600, document: 1, sheet: 1, slides: 0, image: 1, other: 0 })\r\n})\r\n\r\ntest('matchScenarioFiles prefers filename relevance and limits noise', () => {\r\n  const matched = matchScenarioFiles(files, { keywords: ['发票', '报销'], fileKinds: ['image', 'document'] })\r\n  assert.deepEqual(matched.map(file => file.name), ['发票.png'])\r\n  assert.deepEqual(matchScenarioFiles(files, { keywords: ['流水'], fileKinds: [] }).map(file => file.name), ['流水.xlsx'])\r\n})\r\n\n~~~~~~\n\n## test/upload.test.mjs\n\nSHA-256: a752cd8f07af264481ef70b881a79e4c115161e08ba8ae30f02ac06948615c33\n\n~~~~~~text\nimport test from 'node:test'\r\nimport assert from 'node:assert/strict'\r\nimport { mkdtemp, readFile, readdir, rm, writeFile, mkdir, rename, symlink } from 'node:fs/promises'\r\nimport { tmpdir } from 'node:os'\r\nimport { join } from 'node:path'\r\nimport { FinanceFilesService } from '../src/index.js'\r\n\r\nasync function fixture(t) {\r\n  const root = await mkdtemp(join(tmpdir(), 'upload-test-'))\r\n  t.after(() => rm(root, { recursive: true, force: true }))\r\n  const service = Object.create(FinanceFilesService.prototype)\r\n  service.uploads = new Map()\r\n  const agent = { session: { header: { cwd: root } } }\r\n  const begin = (name, text) => service.beginUpload(agent, { name, size: Buffer.byteLength(text) })\r\n  const chunk = (upload, text) => service.uploadChunk(agent, { uploadId: upload.uploadId, offset: 0, data: Buffer.from(text).toString('base64') })\r\n  const finish = upload => service.finishUpload(agent, { uploadId: upload.uploadId })\r\n  return { root, service, agent, begin, chunk, finish }\r\n}\r\n\r\ntest('concurrent same-name uploads and an existing file all survive intact', async t => {\r\n  const f = await fixture(t)\r\n  await mkdir(join(f.root, '财务资料'))\r\n  await writeFile(join(f.root, '财务资料', '资料.txt'), 'original')\r\n  const uploads = await Promise.all(['first', 'second'].map(text => f.begin('资料.txt', text)))\r\n  await Promise.all(uploads.map((u, i) => f.chunk(u, ['first', 'second'][i])))\r\n  const results = await Promise.all(uploads.map(f.finish))\r\n  assert.equal(new Set(results.map(r => r.relative)).size, 2)\r\n  assert.deepEqual(await Promise.all(results.map(r => readFile(join(f.root, r.relative), 'utf8'))), ['first', 'second'])\r\n  assert.equal(await readFile(join(f.root, '财务资料', '资料.txt'), 'utf8'), 'original')\r\n  assert.equal((await readdir(join(f.root, '财务资料'))).some(n => n.endsWith('.part')), false)\r\n})\r\n\r\ntest('a file created after beginUpload is preserved', async t => {\r\n  const f = await fixture(t)\r\n  const u = await f.begin('资料.txt', 'new')\r\n  await f.chunk(u, 'new')\r\n  await writeFile(join(f.root, u.relative), 'created meanwhile')\r\n  const result = await f.finish(u)\r\n  assert.notEqual(result.relative, u.relative)\r\n  assert.equal(await readFile(join(f.root, u.relative), 'utf8'), 'created meanwhile')\r\n})\r\n\r\ntest('double finish commits exactly once', async t => {\r\n  const f = await fixture(t)\r\n  const u = await f.begin('资料.txt', 'new')\r\n  await f.chunk(u, 'new')\r\n  const results = await Promise.allSettled([f.finish(u), f.finish(u)])\r\n  assert.equal(results.filter(r => r.status === 'fulfilled').length, 1)\r\n  assert.equal((await readdir(join(f.root, '财务资料'))).length, 1)\r\n})\r\n\r\ntest('incomplete upload remains resumable and invalid sizes are rejected', async t => {\r\n  const f = await fixture(t)\r\n  const u = await f.begin('资料.txt', 'new')\r\n  await assert.rejects(f.finish(u), /尚未上传完整/)\r\n  await f.chunk(u, 'new')\r\n  assert.equal((await f.finish(u)).size, 3)\r\n  for (const size of [-1, 0.5, NaN, Infinity]) {\r\n    await assert.rejects(f.service.beginUpload(f.agent, { name: 'invalid.txt', size }), /文件大小无效/)\r\n  }\r\n})\r\n\r\ntest('empty files can be uploaded', async t => {\r\n  const f = await fixture(t)\r\n  assert.equal((await f.finish(await f.begin('empty.txt', ''))).size, 0)\r\n})\r\n\r\ntest('upload and task writes reject directory symlinks, including changes after upload begins', async t => {\r\n  const f = await fixture(t)\r\n  const outside = await mkdtemp(join(tmpdir(), 'outside-test-'))\r\n  t.after(() => rm(outside, { recursive: true, force: true }))\r\n  const link = (target, path) => symlink(target, path, process.platform === 'win32' ? 'junction' : 'dir')\r\n  await link(outside, join(f.root, '财务资料'))\r\n  await assert.rejects(f.begin('资料.txt', 'new'), /符号链接/)\r\n  assert.deepEqual(await readdir(outside), [])\r\n  await rm(join(f.root, '财务资料'), { recursive: true, force: true })\r\n  const u = await f.begin('资料.txt', 'new')\r\n  await f.chunk(u, 'new')\r\n  await rename(join(f.root, '财务资料'), join(f.root, '原财务资料'))\r\n  await link(outside, join(f.root, '财务资料'))\r\n  await assert.rejects(f.finish(u), /符号链接/)\r\n  assert.deepEqual(await readdir(outside), [])\r\n  await link(outside, join(f.root, '财务工作台'))\r\n  await assert.rejects(f.service.prepareTask(f.agent, { id: 'bank-reconcile', title: '对账', content: '核对样本' }), /符号链接/)\r\n  assert.deepEqual(await readdir(outside), [])\r\n})\r\n\r\ntest('invalid chunks, cross-workspace IDs, traversal and download offsets are rejected', async t => {\r\n  const f = await fixture(t)\r\n  const u = await f.begin('资料.txt', 'new')\r\n  for (const data of ['%%%=', 'a', 'bmV3===', 'bmV3\\n']) await assert.rejects(f.service.uploadChunk(f.agent, { uploadId: u.uploadId, offset: 0, data }), /编码无效/)\r\n  const other = await fixture(t)\r\n  await assert.rejects(f.service.finishUpload(other.agent, { uploadId: u.uploadId }), /已失效/)\r\n  await f.chunk(u, 'new')\r\n  const result = await f.finish(u)\r\n  const downloaded = await f.service.downloadChunk(f.agent, { relative: result.relative, offset: 0, length: 100 })\r\n  assert.equal(Buffer.from(downloaded.data, 'base64').toString(), 'new')\r\n  await assert.rejects(f.service.downloadChunk(f.agent, { relative: '../outside.txt', offset: 0, length: 1 }), /超出/)\r\n  await assert.rejects(f.service.downloadChunk(f.agent, { relative: result.relative, offset: -1, length: 1 }), /偏移/)\r\n  await assert.rejects(f.service.downloadChunk(f.agent, { relative: result.relative, offset: 0, length: 0 }), /长度/)\r\n})\r\n\n~~~~~~\n\n## test/workbuddy-app.test.mjs\n\nSHA-256: d8e713642b47c549586919cfb26ab99bea4fd9f752031bde773861d6cae684ab\n\n~~~~~~text\nimport test from 'node:test'\r\nimport assert from 'node:assert/strict'\r\nimport { access, readFile, mkdtemp, rmdir } from 'node:fs/promises'\r\nimport { tmpdir } from 'node:os'\r\nimport { join } from 'node:path'\r\nimport { fileURLToPath } from 'node:url'\r\nimport { Client } from '@modelcontextprotocol/sdk/client/index.js'\r\nimport { StdioClientTransport } from '@modelcontextprotocol/sdk/client/stdio.js'\r\n\r\nconst root = new URL('../', import.meta.url)\r\n\r\ntest('WorkBuddy package contains a complete MCP App and one-click installers', async () => {\r\n  const files = [\r\n    '.codebuddy-plugin/plugin.json', '.mcp.json',\r\n    'workbuddy/server.mjs', 'workbuddy/widget.html',\r\n    'scripts/install-workbuddy-app.sh', 'scripts/uninstall-workbuddy-app.sh',\r\n    'scripts/install-workbuddy-app.ps1', 'scripts/uninstall-workbuddy-app.ps1',\r\n    '安装 WorkBuddy 财务工作台.command', '卸载 WorkBuddy 财务工作台.command',\r\n  ]\r\n  await Promise.all(files.map(file => access(new URL(file, root))))\r\n  const html = await readFile(new URL('workbuddy/widget.html', root), 'utf8')\r\n  assert.ok(Buffer.byteLength(html) \u003c 256 * 1024, 'MCP App Widget must stay below the WorkBuddy prefetch limit')\r\n  assert.match(html, /WorkBuddy 财务工作台/)\r\n  assert.match(html, /DecompressionStream/)\r\n  assert.doesNotMatch(html, /https?:\\/\\//)\r\n})\r\n\r\ntest('WorkBuddy MCP server exposes and serves the interactive dashboard', async () => {\r\n  // Never reuse the developer's real employee authorization for package tests.\r\n  const sessionHome = await mkdtemp(join(tmpdir(), 'finance-no-session-'))\r\n  const transport = new StdioClientTransport({\r\n    command: process.execPath,\r\n    args: [fileURLToPath(new URL('workbuddy/server.mjs', root))],\r\n    stderr: 'pipe',\r\n    env: { LOCALAPPDATA: sessionHome },\r\n  })\r\n  const client = new Client({ name: 'finance-workbench-test', version: '1.0.0' })\r\n  try {\r\n    await client.connect(transport)\r\n    const tools = await client.listTools()\r\n    assert.ok(tools.tools.some(tool => tool.name === 'show_finance_workbench'))\r\n    assert.ok(tools.tools.some(tool => tool.name === 'team_order'))\r\n    assert.ok(tools.tools.some(tool => tool.name === 'team_return_run'))\r\n    assert.ok(tools.tools.find(tool => tool.name === 'team_start_workflow').inputSchema.required.includes('key'))\r\n    assert.equal(tools.tools.find(tool => tool.name === 'team_workflow_status').annotations.readOnlyHint, true)\r\n    assert.ok(!tools.tools.some(tool => /approve|review/.test(tool.name)))\r\n    assert.equal(tools.tools.find(tool => tool.name === 'show_finance_workbench')._meta.ui.resourceUri, 'ui://workbuddy-finance-workbench/dashboard')\r\n    const resources = await client.listResources()\r\n    assert.equal(resources.resources[0].mimeType, 'text/html;profile=mcp-app')\r\n    const resource = await client.readResource({ uri: 'ui://workbuddy-finance-workbench/dashboard' })\r\n    assert.ok(resource.contents[0].text.length > 100000)\r\n    const result = await client.callTool({ name: 'show_finance_workbench', arguments: {} })\r\n    assert.equal(result.structuredContent.version, JSON.parse(await readFile(new URL('../package.json', import.meta.url), 'utf8')).version)\r\n    assert.equal(result.structuredContent.modules, 20)\r\n    assert.equal(result.structuredContent.workflows, 25)\r\n    assert.equal(result.structuredContent.prompts, 25)\r\n    const noSession = await client.callTool({ name: 'team_whoami', arguments: {} })\r\n    assert.equal(noSession.isError, true)\r\n    assert.match(noSession.content[0].text, /尚未授权|员工会话/)\r\n  } finally {\r\n    await client.close()\r\n    await rmdir(sessionHome)\r\n  }\r\n})\r\n\n~~~~~~\n\n## test/workflow-snapshot.test.mjs\n\nSHA-256: 0bf3b9275ee04e87c1cb7d30443ad41df10f1218a38b4a395e5b714b93be9085\n\n~~~~~~text\nimport test from 'node:test'\r\nimport assert from 'node:assert/strict'\r\nimport { workflowSnapshotName } from '../src/index.js'\r\n\r\ntest('task snapshots stay independent and reject unsafe names', () => {\r\n  const first = workflowSnapshotName('bank-reconcile')\r\n  assert.match(first, /^bank-reconcile-[a-f0-9-]+\\.md$/)\r\n  assert.notEqual(first, workflowSnapshotName('bank-reconcile'))\r\n  assert.throws(() => workflowSnapshotName('../invoice'), /无效/)\r\n})\r\n\n~~~~~~\n\n## test/workflow-tools.test.mjs\n\nSHA-256: 65bacac696f2b1526912192274410680b83bf75b3e08668eeab30ee0adfe9ed5\n\n~~~~~~text\nimport test from 'node:test'\r\nimport assert from 'node:assert/strict'\r\nimport { filterWorkflowList, recentWorkflowIds, formatTaskBrief } from '../src/workflow-tools.js'\r\nimport { composeFinanceTask } from '../src/task-prompt.js'\r\n\r\ntest('task brief is bounded, optional and included in the actual full prompt', () => {\r\n  const item = { title: '测试任务', prompt: '只读原件', inputs: [], output: '', outputs: [], checks: [], checklist: [], taskBrief: { subject: '示例对象', period: '2026-09', goal: '生成检查表', requirements: '脱敏' } }\r\n  const prompt = composeFinanceTask(item)\r\n  assert.ok(prompt.includes(formatTaskBrief(item.taskBrief)))\r\n  assert.ok(prompt.includes('生成检查表'))\r\n  assert.equal(formatTaskBrief(null), '')\r\n  assert.ok(formatTaskBrief({ subject: 'x'.repeat(5000) }).length \u003c 2100)\r\n})\r\ntest('search, favorites and recent ordering compose without mutating catalog', () => {\r\n  const rows = [{id:'a',title:'教学 财务',keywords:['报销']},{id:'b',title:'财务报表',keywords:[]}]\r\n  assert.deepEqual(filterWorkflowList(rows,{query:'教学 报销'}).map(x=>x.id),['a'])\r\n  assert.deepEqual(filterWorkflowList([{id:'bank',title:'银行流水与账务明细核对',keywords:['对账']}],{query:'银行对账'}).map(x=>x.id),['bank'])\r\n  assert.deepEqual(filterWorkflowList(rows,{filter:'favorites',favorites:['b']}).map(x=>x.id),['b'])\r\n  assert.deepEqual(filterWorkflowList(rows,{filter:'recent',recent:['b','a']}).map(x=>x.id),['b','a'])\r\n  assert.deepEqual(rows.map(x=>x.id),['a','b'])\r\n  assert.deepEqual(recentWorkflowIds(['a','b','a'],'b'),['b','a'])\r\n  assert.equal(recentWorkflowIds(Array.from({length:20},(_,i)=>String(i)),'new').length,8)\r\n})\r\n\n~~~~~~\n\n## 卸载 WorkBuddy 财务工作台.command\n\nSHA-256: 7a886994bae7cd0fd3e13a495e21a266edabfec4223078710defd6c0f32054d8\n\n~~~~~~text\n#!/bin/bash\nset -e\nscript_dir=\"$(cd \"$(dirname \"$0\")\" && pwd)\"\nclear\necho \"WorkBuddy 财务工作台 · 安全卸载\"\necho \"====
